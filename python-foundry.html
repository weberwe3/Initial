st(expenses)`. Write tests for these\n   *first* (TDD) or *straight after*.\n5. **`summary` command** with nicely aligned output.\n6. **CSV import/export.** Real bank exports have different column names; map\n   them (e.g. `\"Transaction Amount\"` → `amount`). Skip and report rows that\n   can't be parsed instead of crashing.\n7. **Budgets.** Store per-category monthly limits in the same JSON file and\n   flag overspending in the summary.\n\n### Level up\n- `delete` / `edit` commands (give each expense an `id`).\n- Auto-categorise imported rows by keyword (\"TESCO\" → food).\n- A bar chart in the terminal using `\"█\" * int(amount / scale)`.\n- Install `rich` and print a coloured table.\n- Recurring expenses (rent every month).\n\n---\n\n## Skills checklist\n- [ ] Multiple modules in a package, imported from a main script\n- [ ] A dataclass\n- [ ] JSON persistence with graceful handling of a missing file\n- [ ] CSV reading and writing with `csv.DictReader` / `DictWriter`\n- [ ] `argparse` with subcommands\n- [ ] Input validation with helpful error messages\n- [ ] At least 8 pytest tests, all passing\n"}, {"n": 3, "title": "Capstone: Build Your Own Tool", "md": "# Capstone: Build Your Own Tool\n\n**After:** Module 15 · **Time:** 15–25 hours (2–3 weeks)\n\nThis is where you prove to yourself that you can program. You'll design and\nbuild something real from scratch, for **your** track, and finish it properly:\nwith tests, a README, and code you'd be happy to show someone.\n\n---\n\n## The rules\n\nYour project must include:\n\n- [ ] **At least 3 modules** (files), organised as a package\n- [ ] **At least one class or dataclass** that earns its place\n- [ ] **Reading and/or writing files** (CSV, JSON, text) *or* calling a web API\n- [ ] **Error handling**: bad input or a failed request shouldn't crash it\n- [ ] **A command-line interface** (`argparse`) or an interactive menu\n- [ ] **At least 10 pytest tests**, all passing\n- [ ] **Type hints** on your function signatures\n- [ ] **A `README.md`** explaining what it does, how to install it, and how to run it\n- [ ] **A `requirements.txt`** if you use third-party packages\n- [ ] Use at least one Module 15 tool (a generator, decorator, or context manager) where it genuinely helps\n\n---\n\n## Pick a project from your track\n\n### 🛠 Automation / productivity\n- **Downloads folder organiser**: sort files into folders by type/date, with a\n  `--dry-run` mode, an undo log (JSON), and a config file for custom rules.\n- **Spreadsheet cleaner**: take a messy CSV export (inconsistent dates, stray\n  spaces, duplicates, mixed-case names) and produce a clean file plus a report\n  of what changed. Stretch: read/write `.xlsx` with `openpyxl`.\n- **Report generator**: combine several CSVs into a weekly summary, written\n  out as a Markdown or HTML file you could email.\n- **Bulk file renamer**: preview-then-apply renames using patterns\n  (`IMG_2041.jpg` → `2026-11-06_holiday_001.jpg`).\n\n### 📊 Data & analysis\n- **Personal finance analyser**: extend Project 2 with trends over months,\n  averages, the \"where did my money go\" top 10, and charts with `matplotlib`.\n- **Habit / fitness tracker**: log entries, compute streaks and weekly\n  averages, chart progress.\n- **Dataset explorer**: download a public dataset (e.g. from data.gov or Kaggle),\n  then write a tool that answers 5 interesting questions about it.\n\n### 🌐 Web & APIs\n- **Weather dashboard**: use Open-Meteo (no key needed) to show the\n  forecast for saved cities, cache responses to disk, and warn about rain.\n- **Price / stock watcher**: track values over time in a JSON or SQLite file\n  and alert when they cross a threshold.\n- **GitHub stats tool**: summarise a user's or organisation's repositories:\n  languages, stars, recent activity.\n- **News digest**: pull headlines from an RSS feed or API, de-duplicate, and\n  write a daily digest file.\n\n### 🎮 Games & creative\n- **Text adventure engine**: rooms, items and puzzles loaded from a JSON file,\n  so the *game* is data and the *engine* is code. Save/load games.\n- **Card game** (blackjack, war...) with classes for `Card`, `Deck`, `Hand`,\n  `Player`, plus a simple computer opponent.\n- **Life simulation**: Conway's Game of Life or a predator/prey simulation in\n  the terminal, with patterns loaded from files.\n- **Quiz app**: questions from a JSON/CSV file, scoring, high-score table,\n  spaced repetition for questions you got wrong.\n\nGot your own idea? Even better. Use it, as long as it meets the rules above.\nThe best projects solve a problem you actually have.\n\n---\n\n## How to approach it\n\n1. **Write a one-paragraph description** of what it does and who it's for.\n2. **List the features**, then cut it down to a minimum version you could build\n   in a weekend. Everything else goes on a \"later\" list.\n3. **Sketch the structure**: which modules, which classes, which functions?\n   Data in, data out. Keep printing in one place.\n4. **Build the smallest end-to-end slice first.** For example, the organiser\n   moves *one* file type correctly before you handle all of them.\n5. **Write tests as you go**, not at the end.\n6. **Commit to git regularly** (see below).\n7. **Polish**: README, help text, error messages, remove dead code.\n8. **Show someone.** Explaining your code is the final test of understanding it.\n\n### Use git\n```bash\ngit init\ngit add .\ngit commit -m \"First working version\"\n```\nCommit every time something works. It's an unlimited undo button, and a\nGitHub profile with real projects is worth more than any certificate.\n\n---\n\n## Self-review checklist\n\nBefore you call it done, read your code as if someone else wrote it:\n\n- [ ] Could a stranger run it using only the README?\n- [ ] Are names clear? Would you know what `process(d)` does in six months?\n- [ ] Is any function over ~30 lines? Can it be split?\n- [ ] Is anything copy-pasted 3+ times? Make it a function.\n- [ ] Does bad input give a helpful mes    ===================================================================== */
const INTERVALS = [0, 1, 3, 7, 16, 35, 90, 180];
function itemFor(id) {
  // ids: c-01-3 (card) or q-01-2 (quiz)
  const [kind, mid, idx] = id.split("-");
  const m = byId[mid]; if (!m || !m.learn) return null;
  if (kind === "c") { const c = m.learn.cards[+idx]; return c && { id, kind: "card", mid, front: c[0], back: c[1] }; }
  const q = m.learn.quiz[+idx]; return q && { id, kind: "quiz", mid, q };
}
function addToDeck(id, box = 0) {
  const s = Store.state.srs;
  if (s[id]) return false;
  s[id] = { box, due: today() + (box ? INTERVALS[box] : 1), last: today(), reps: 0, lapses: 0 };
  return true;
}
function grade(id, g) { // 0 again, 1 hard, 2 good, 3 easy
  const s = Store.state.srs[id] ||= { box: 0, due: today(), last: today(), reps: 0, lapses: 0 };
  if (g === 0) { s.box = 1; s.lapses++; s.due = today() + 1; }
  else if (g === 1) { s.box = Math.max(1, s.box); s.due = today() + Math.max(1, Math.round(INTERVALS[s.box] / 2)); }
  else { s.box = Math.min(INTERVALS.length - 1, s.box + (g === 3 ? 2 : 1)); s.due = today() + INTERVALS[s.box]; }
  s.last = today(); s.reps++;
}
function nextIntervalLabel(id, g) {
  const s = Store.state.srs[id] || { box: 0 };
  let days;
  if (g === 0) days = 1;
  else if (g === 1) days = Math.max(1, Math.round(INTERVALS[Math.max(1, s.box)] / 2));
  else days = INTERVALS[Math.min(INTERVALS.length - 1, s.box + (g === 3 ? 2 : 1))];
  return days === 1 ? "tomorrow" : `${days} days`;
}
const dueIds = () => Object.entries(Store.state.srs).filter(([id, s]) => s.due <= today() && itemFor(id)).map(([id]) => id);
function retention(s) {
  const stability = Math.max(1, INTERVALS[s.box] || 1) * 1.6;
  return Math.exp(-(today() - s.last) / stability);
}
function memoryStrength(mid) {
  const items = Object.entries(Store.state.srs).filter(([id]) => id.split("-")[1] === mid);
  if (!items.length) return null;
  return items.reduce((a, [, s]) => a + retention(s), 0) / items.length;
}
function interleave(ids) {
  // round-robin across modules so consecutive items come from different topics
  const groups = {};
  shuffle(ids).forEach(id => (groups[id.split("-")[1]] ||= []).push(id));
  const lists = shuffle(Object.values(groups)); const out = [];
  while (lists.some(l => l.length)) lists.forEach(l => l.length && out.push(l.shift()));
  return out;
}

class _Param:
    def __init__(self, *values, **kwargs):
        self.values = values

def param(*values, **kwargs):
    return _Param(*values, **kwargs)

class _RaisesContext:
    def __init__(self, expected, match=None):
        self.expected, self.match, self.value = expected, match, None
    def __enter__(self):
        return self
    def __exit__(self, et, ev, tb):
        if et is None:
            raise AssertionError(f"DID NOT RAISE {self.expected}")
        if issubclass(et, self.expected):
            self.value = ev
            if self.match:
                import re
                if not re.search(self.match, str(ev)):
                    raise AssertionError(f"pattern {self.match!r} not found in {str(ev)!r}")
            return True
        return False

def raises(expected, *args, match=None, **kwargs):
    if args:
        try:
            args[0](*args[1:], **kwargs)
        except expected:
            return None
        raise AssertionError(f"DID NOT RAISE {expected}")
    return _RaisesContext(expected, match)

class approx:
    def __init__(self, expected, rel=1e-6, abs=1e-12):
        self.expected, self.rel, self.abs = expected, rel, abs
    def _close(self, a, b):
        return math.isclose(a, b, rel_tol=self.rel, abs_tol=self.abs)
    def __eq__(self, other):
        if isinstance(self.expected, (list, tuple)):
            return len(other) == len(self.expected) and all(self._close(a, b) for a, b in zip(other, self.expected))
        return self._close(other, self.expected)
    def __repr__(self):
        return f"approx({self.expected!r})"

def fixture(fn=None, **kwargs):
    return fn if fn is not None else (lambda f: f)

def fail(msg=""):
    raise AssertionError(msg)

function workerMain() {
  let py = null;
  self.onmessage = async (e) => {
    const m = e.data;
    try {
      if (m.op === "init") {
        importScripts(m.indexURL + "pyodide.js");
        const opts = { indexURL: m.indexURL };
        if (m.stdlibText) {
          // Some hosts can't serve .zip files, so the standard library ships as base64 text.
          const b64 = await (await fetch(m.stdlibText)).text();
          const bin = atob(b64.trim());
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          opts.stdLibURL = URL.createObjectURL(new Blob([bytes], { type: "application/zip" }));
        }
        py = await loadPyodide(opts);
        py.FS.mkdirTree("/course/lib");
        py.FS.writeFile("/course/lib/pytest.py", m.pytest);
        py.FS.writeFile("/course/lib/_foundry.py", m.helper);
        py.runPython("import sys; sys.path.insert(0, '/course/lib'); import _foundry");
        self.postMessage({ id: m.id, result: { version: py.version } });
        return;
      }
      py.globals.set("_args_json", JSON.stringify(m.args));
      const fn = m.op === "check" ? "check" : "run";
      const r = py.runPython(`import json, _foundry\njson.dumps(_foundry.${fn}(**json.loads(_args_json)))`);
      self.postMessage({ id: m.id, result: JSON.parse(r) });
    } catch (err) {
      self.postMessage({ id: m.id, error: String(err && err.message || err) });
    }
  };
}

const Engine = {
  worker: null, starting: null, seq: 0, pending: new Map(), status: "idle",
  setStatus(s, text) {
    this.status = s;
    const el = $("#engine"); el.className = "engine " + s;
    $("#engineText").textContent = text;
  },
  async pickIndexURL() {
    const local = new URL("pyodide/", location.href).href;
    if (location.protocol.startsWith("http")) {
      try {
        const r = await fetch(local + "pyodide.js", { method: "HEAD" });
        if (r.ok) return { indexURL: local, stdlibText: local + "python_stdlib.txt" };
      } catch (_) {}
    }
    return { indexURL: `https://cdn.jsdelivr.net/npm/pyodide@${C.pyodideVersion}/` };
  },
  start() {
    if (this.starting) return this.starting;
    this.setStatus("loading", "Python: loading…");
    this.starting = (async () => {
      const src = `(${workerMain.toString()})()`;
      this.worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
      this.worker.onmessage = (e) => {
        const p = this.pending.get(e.data.id); if (!p) return;
        this.pending.delete(e.data.id); clearTimeout(p.timer);
        e.data.error ? p.reject(new Error(e.data.error)) : p.resolve(e.data.result);
      };
      this.worker.onerror = (e) => { e.preventDefault && e.preventDefault(); };
      const where = await this.pickIndexURL();
      await this.send({ op: "init", ...where, pytest: PYTEST_SHIM, helper: PY_HELPER }, 90000);
      this.setStatus("ready", "Python ready");
    })().catch(err => {
      this.reset();
      this.setStatus("error", "Python unavailable");
      throw err;
    });
    return this.starting;
  },
  send(msg, timeout) {
    return new Promise((resolve, reject) => {
      const id = ++this.seq;
      const timer = setTimeout(() => {
        this.pending.delete(id);
        reject(Object.assign(new Error("timeout"), { timeout: true }));
        this.reset();
        this.setStatus("idle", "Python: stopped");
      }, timeout);
      this.pending.set(id, { resolve, reject, timer });
      this.worker.postMessage({ ...msg, id });
    });
  },
  reset() {
    if (this.worker) this.worker.terminate();
    this.worker = null; this.starting = null;
    this.pending.forEach(p => { clearTimeout(p.timer); p.reject(Object.assign(new Error("stopped"), { stopped: true })); });
    this.pending.clear();
  },
  stop() { this.reset(); this.setStatus("idle", "Python: stopped"); },
  async run(args) { await this.start(); return this.send({ op: "run", args }, 10000); },
  async check(args) { await this.start(); return this.send({ op: "check", args }, 20000); },
};

/* Render output text (value lines are marked with \x00) + friendly error */
function renderOutput(el, res) {
  el.innerHTML = "";
  const out = (res.out || "").replace(/\n$/, "");
  if (out) out.split("\n").forEach(line => {
    if (line.startsWith("\x00")) el.append(h("span", { class: "val" }, "↳ " + line.slice(1)), "\n");
    else el.append(line + "\n");
  });
  if (res.error) {
    el.append(h("span", { class: "err" }, res.error));
    const tip = ERROR_HINTS[res.etype];
    if (tip) el.append(h("span", { class: "hint" }, h("strong", {}, res.etype + ": "), tip));
  }
  if (!out && !res.error) el.append(h("span", { class: "val" }, "(ran fine, nothing printed)"));
}
const plainOutput = res => (res.out || "").split("\n").map(l => l.startsWith("\x00") ? l.slice(1) : l).join("\n").trim();
const normalise = s => String(s).trim().split("\n").map(l => l.trim().replace(/\s+/g, " ")).join("\n").replace(/"/g, "'");

let liveEditors = [];
function makeEditor(host, value, opts = {}) {
  const cm = CodeMirror(host, {
    value, mode: opts.mode || "python", lineNumbers: opts.lineNumbers ?? true, indentUnit: 4,
    tabSize: 4, viewportMargin: Infinity, readOnly: opts.readOnly || false, lineWrapping: false,
    extraKeys: {

function isRunnable(code) {
  if (/^\s*>>>/m.test(code) || /Traceback \(most recent/.test(code)) return false;
  if (/requests\.(get|post)\(|pip install|breakpoint\(\)|@app\./.test(code)) return false;
  return true;
}

function codeBlock(code, { key = "play", cwd = "/course/play", support = null, lang = "python", runnable = true } = {}) {
  const wrap = h("div", { class: "codeblock" });
  const isPy = lang === "python";
  const canRun = isPy && runnable && isRunnable(code);
  const top = h("div", { class: "bar-top" }, h("span", { class: "lang" }, isPy ? (canRun ? "python · editable" : "python") : (lang || "text")));
  wrap.append(top);
  if (!isPy) {
    wrap.append(h("pre", { class: "static" }, code));
    return wrap;
  }
  const host = h("div"); wrap.append(host);
  const original = code;
  let ran = false;
  const needsInput = /input\(/.test(code);
  let stdinBox = null;
  const outEl = h("pre", { class: "output", hidden: true });
  const run = async (prediction) => {
    Store.studied();
    outEl.hidden = false; outEl.textContent = Engine.status === "ready" ? "Running…" : "Starting Python (first run takes a few seconds)…";
    try {
      const res = await Engine.run({ code: cm.getValue(), key, cwd, support, stdin: stdinBox ? stdinBox.value.split("\n") : [] });
      renderOutput(outEl, res);
      ran = true;
      if (prediction != null) showCompare(prediction, res);
    } catch (e) {
      outEl.textContent = e.timeout ? "Stopped after 10 seconds. Is there a loop that never ends?" :
        e.stopped ? "Stopped." : "Python couldn't start here: " + e.message + ". Copy the code and run it on your computer instead.";
    }
  };
  const cm = makeEditor(host, code, { onRun: () => trigger(), lineNumbers: code.split("\n").length > 3 });
  const predictPanel = h("div", { class: "predict", hidden: true });
  const compare = h("div", { class: "compare", hidden: true });
  function showCompare(pred, res) {
    const actual = plainOutput(res);
    const match = normalise(pred) === normalise(actual);
    Store.state.predictions.made++; if (match) Store.state.predictions.right++;
    Store.save();
    compare.hidden = false; compare.innerHTML = "";
    compare.append(
      h("div", {}, h("strong", {}, "Your prediction"), h("pre", {}, pred || "(blank)")),
      h("div", {}, h("strong", { style: `color:var(${match ? "--good" : "--bad"})` }, match ? "Match. Nice." : "Different. Spot why before moving on."), h("pre", {}, actual || "(nothing printed)")),
    );
  }
  const trigger = () => {
    if (Store.state.predict && !ran && !predictPanel.dataset.skip) {
      predictPanel.hidden = false;
      $("textarea", predictPanel).focus();
      return;
    }
    run(null);
  };
  predictPanel.append(
    h("label", { for: "p" + Math.random().toString(36).slice(2) }, "Predict first: what will this print?"),
    h("textarea", { placeholder: "Type the output you expect. Guessing wrong is how this sticks." }),
    h("div", { class: "row" },
      h("button", { class: "btn small amber", type: "button", onclick: () => { predictPanel.hidden = true; run($("textarea", predictPanel).value); } }, "Run and compare"),
      h("button", { class: "btn small ghost", type: "button", onclick: () => { predictPanel.dataset.skip = "1"; predictPanel.hidden = true; run(null); } }, "Just run it")),
  );
  if (canRun) {
    top.append(
      h("button", { class: "btn small primary", type: "button", onclick: trigger, title: "Ctrl+Enter" }, "▶ Run"),
      h("button", { class: "btn small ghost", type: "button", onclick: () => { cm.setValue(original); outEl.hidden = true; compare.hidden = true; } }, "Reset"),
    );
    if (needsInput) {
      stdinBox = h("textarea", { placeholder: "One line per input() call" });
      wrap.append(h("div", { class: "stdin" }, "Input (what you'd type when the program asks):", stdinBox));
    }
    wrap.append(predictPanel, outEl, compare);
  }
  return wrap;
}

function renderMd(md, ctx = {}) {
  const div = h("div", { class: "prose", html: marked.parse(md) });
  $$("table", div).forEach(t => { const w = h("div", { class: "table-wrap" }); t.replaceWith(w); w.append(t); });
  $$("a[href^='http']", div).forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  $$("pre > code", div).forEach(code => {
    const pre = code.parentElement;
    const m = /language-(\w+)/.exec(code.className || "");
    const lang = m ? m[1] : "";
    const text = code.textContent.replace(/\n$/, "");
    pre.replaceWith(codeBlock(text, { ...ctx, lang: lang === "py" ? "python" : lang }));
  });
  return div;
}

      if (prior) fb.append(h("div", { class: "muted", html: `Before the lesson you said: <em>${esc(prior.given || "(no answer)")}</em> ${prior.correct ? "(right)" : "(wrong)"}` }));
      if (confidence === "sure" && !correct) fb.append(h("div", {}, "You felt sure, so this is a classic illusion of knowing. It's now scheduled for review soon."));
    }
    if (isOutput && mode !== "pretest") {
      const out = h("pre", { class: "output", hidden: true });
      fb.append(h("div", { class: "row" }, h("button", {
        class: "btn small", type: "button", onclick: async () => {
          out.hidden = false; out.textContent = "Running…";

          catch (e) { out.textContent = "Python isn't available here right now."; }
        },
      }, "▶ Run it yourself")), out);
    }

  const confidenceStep = (cb) => {

    box.append(c);

    const btn = h("button", { class: "btn primary", type: "button" }, "Check");
    btn.onclick = () => {

/* Parsons problem: rebuild the program from shuffled lines */
function renderParsons(p, onSolved) {
  const lines = p.lines.filter(l => l.trim() !== "");
  let pool = shuffle(lines.map((t, i) => ({ t, i })));
  if (lines.length > 1 && pool.every((x, k) => x.i === k)) pool.reverse();
  let answer = [];
  const box = h("div", { class: "q" });
  const poolCol = h("div", { class: "p-col", "aria-label": "Available lines" });
  const ansCol = h("div", { class: "p-col", "aria-label": "Your program" });
  const fb = h("div");
  const draw = () => {
    poolCol.innerHTML = ""; ansCol.innerHTML = "";
    pool.forEach(x => poolCol.append(h("button", { class: "p-line", type: "button", onclick: () => { pool = pool.filter(y => y !== x); answer.push(x); draw(); } }, x.t)));
    answer.forEach(x => ansCol.append(h("button", { class: "p-line", type: "button", onclick: () => { answer = answer.filter(y => y !== x); pool.push(x); draw(); } }, x.t)));
    if (!pool.length) poolCol.append(h("div", { class: "muted" }, "All lines used."));
    if (!answer.length) ansCol.append(h("div", { class: "muted" }, "Tap lines on the left to build the program here, in order."));
  };
  draw();
  box.append(h("p", { class: "q-text" }, p.prompt),
    h("div", { class: "parsons" },
      h("div", {}, h("div", { class: "eyebrow" }, "Pieces"), poolCol),
      h("div", {}, h("div", { class: "eyebrow" }, "Your program"), ansCol)),
    h("div", { class: "row" },
      h("button", { class: "btn primary", type: "button", onclick: () => {
        const btns = $$(".p-line", ansCol);
        if (pool.length) { fb.innerHTML = ""; fb.append(h("div", { class: "callout" }, "Use every line first.")); return; }
        let ok = true;
        answer.forEach((x, k) => { const good = lines[k] === x.t; btns[k].classList.add(good ? "good" : "bad"); if (!good) ok = false; });
        fb.innerHTML = "";
        if (ok) { fb.append(h("div", { class: "callout good" }, h("strong", {}, "Solved. "), "Now try writing it from memory in the playground.")); onSolved(); }
        else fb.append(h("div", { class: "callout bad" }, "The red lines are out of place. Think about what each line needs to exist before it runs."));
        setTimeout(() => btns.forEach(b => b.classList.remove("good", "bad")), ok ? 99999 : 2200);
      } }, "Check order"),
      h("button", { class: "btn ghost", type: "button", onclick: () => { pool = shuffle(lines.map((t, i) => ({ t, i }))); answer = []; fb.innerHTML = ""; draw(); } }, "Start over")),
    fb);
  return box;
}

function viewModule(mid) {
  const m = byId[mid]; if (!m) return [h("p", {}, "Module not found.")];
  const p = Store.mod(mid);
  const stages = stagesFor(m);
  let stage = ui.stage[mid] || stages.find(s => !stageDone(m, s.k))?.k || "lesson";
  ui.stage[mid] = stage;
  const partName = C.parts.find(([, ids]) => ids.includes(mid))[0];
  const out = [];
  out.push(h("header", { class: "mod-head" },
    h("div", { class: "eyebrow" }, `Module ${mid} · ${partName}`),
    h("h1", {}, m.title),
    m.goal && h("p", { class: "goal", html: inlineMd(m.goal[0].toUpperCase() + m.goal.slice(1) + (m.time ? ` · ${m.time}` : "")) }),
    m.learn.big_idea && h("div", { class: "callout" }, h("div", { class: "eyebrow", style: "color:var(--amber)" }, "The big idea"), h("div", { style: "font-size:1.08rem;margin-top:4px" }, m.learn.big_idea))));
  const bar = h("nav", { class: "stages", "aria-label": "Module stages" });
  stages.forEach((s, i) => bar.append(h("button", {
    class: "stage" + (s.k === stage ? " on" : "") + (stageDone(m, s.k) ? " done" : ""), type: "button",
    onclick: () => { ui.stage[mid] = s.k; render(); },
  }, h("span", { class: "sn" }, stageDone(m, s.k) ? "✓" : i + 1), s.label)));
  out.push(bar);
  const goStage = k => { ui.stage[mid] = k; render(); $("#view").scrollIntoView(); window.scrollTo(0, 0); };
  const nextStageOf = k => { const i = stages.findIndex(s => s.k === k); return stages[i + 1]?.k; };
  const body = h("section", { class: "panel" });
  out.push(body);

  if (stage === "warmup") {
    const due = dueIds().filter(id => id.split("-")[1] !== mid).slice(0, 2);
    if (due.length) {
      body.append(h("h2", {}, "Quick recall from earlier"),
        h("p", { class: "muted" }, "Two items from previous modules. Mixing old topics in keeps them alive."));
      due.forEach(id => {
        const it = itemFor(id); const slot = h("div", { style: "margin:16px 0;padding-top:16px;border-top:1px solid var(--line)" });
        if (it.kind === "card") slot.append(renderCard(it, g => { grade(id, g); Store.save(); slot.innerHTML = ""; slot.append(h("div", { class: "muted" }, "Logged. Next review " + nextIntervalLabel(id, g) + ".")); }));
        else slot.append(renderQuestion(it.q, { onDone: r => { grade(id, r.correct ? (r.confidence === "guess" ? 1 : 2) : 0); Store.save(); } }));
        body.append(slot);
      });
      body.append(h("hr", { style: "border:0;border-top:1px solid var(--line);margin:22px 0" }));
    }
    body.append(h("h2", {}, "Guess first"),
      h("p", { class: "muted" }, "You haven't learned this yet, and that's the point. Guessing first, even wrongly, makes the lesson stick better. Nothing here is scored."));
    const pre = m.learn.pretest || [];
    let answered = 0;
    pre.forEach(qi => {
      const slot = h("div", { style: "margin-top:20px" });
      slot.append(renderQuestion(m.learn.quiz[qi], { mode: "pretest", onDone: r => {
        p.pre[qi] = { given: r.given, correct: r.correct };
        if (++answered === pre.length) { p.preDone = true; Store.save(); renderSidebar(); }
      } }));
      body.append(slot);
    });
    body.append(h("div", { class: "row", style: "margin-top:24px" },
      h("button", { class: "btn primary", type: "button", onclick: () => { p.preDone = true; Store.save(); goStage("lesson"); } }, "Start the lesson →")));
  }

  if (stage === "lesson") {
    const steps = [{ title: "Overview", md: null }, ...m.sections];
    let i = Math.min(p.step || 0, steps.length - 1);
    const ctx = { key: "lesson-" + mid, cwd: "/course/m" + mid, support: Object.keys(m.support || {}).length ? m.support : null };
    const s = steps[i];
    body.append(h("div", { class: "spread" }, h("div", { class: "eyebrow" }, `Step ${i + 1} of ${steps.length}`),
      h("div", { class: "step-dots" }, ...steps.map((_, k) => h("button", { type: "button", "aria-label": `Step ${k + 1}`, class: (k === i ? "cur" : k <= p.seen ? "seen" : ""), onclick: () => { p.step = k; Store.save(); render(); } })))));
    body.append(h("div", { class: "progress", style: "margin:10px 0 22px" }, h("i", { style: `width:${((i + 1) / steps.length) * 100}%` })));
    if (i === 0) {
      body.append(h("h2", {}, "What you'll learn"));
      if (m.intro) body.append(renderMd(m.intro, ctx));
      body.append(h("ol", { class: "prose", style: "padding-left:1.3em;margin-top:12px" }, ...m.sections.map((sec, k) =>
        h("li", {}, h("a", { href: "#m-" + mid, onclick: (e) => { e.preventDefault(); p.step = k + 1; p.seen = Math.max(p.seen, k + 1); Store.save(); render(); }, html: inlineMd(sec.title) })))));
      body.append(h("p", { class: "callout blue", style: "margin-top:18px" }, "Type the examples rather than just reading them. Edit any code block and press ▶ Run, or Ctrl+Enter."));
    } else {
      body.append(h("h2", { html: inlineMd(s.title), style: "margin-bottom:14px" }), renderMd(s.md, ctx));
      // retrieval check every third step
      const pool = (m.learn.quiz || []).map((q, k) => k).filter(k => !(m.learn.pretest || []).includes(k));
      if (i % 3 === 0 && pool.length && i < steps.length - 1) {
        const qi = pool[(i / 3 - 1) % pool.length];
        const slot = h("div", { class: "panel flat", style: "margin-top:26px;background:var(--sunk)" },
          h("div", { class: "eyebrow", style: "margin-bottom:10px;color:var(--amber)" }, "Quick check: recall, don't scroll up"));
        slot.append(renderQuestion(m.learn.quiz[qi], { onDone: r => { if (!r.correct) addToDeck(`q-${mid}-${qi}`, 1); Store.save(); } }));
        body.append(slot);
      }
    }
    const last = i === steps.length - 1;
    body.append(h("div", { class: "step-nav", style: "margin-top:28px" },
      h("button", { class: "btn", type: "button", disabled: i === 0, onclick: () => { p.step = i - 1; Store.save(); render(); window.scrollTo(0, 0); } }, "← Back"),
      h("button", { class: "btn primary", type: "button", onclick: () => {
        Store.studied();
        if (last) { p.lessonDone = true; Store.save(); goStage(nextStageOf("lesson")); return; }
        p.step = i + 1; p.seen = Math.max(p.seen, i + 1); if (p.seen >= steps.length - 1) p.lessonDone = true;
        Store.save(); render(); window.scrollTo(0, 0);
      } }, last ? "Finish lesson →" : "Next →")));
  }

  if (stage === "puzzle") {
    body.append(h("h2", {}, "Rebuild it"),
      h("p", { class: "muted" }, "Put the lines in the right order. Rearranging real code is the bridge between reading it and writing it yourself."));
    if (m.learn.parsons) body.append(renderParsons(m.learn.parsons, () => { p.parsonsDone = true; Store.studied(); Store.save(); renderSidebar(); }));
    body.append(h("div", { class: "row", style: "margin-top:20px" }, h("button", { class: "btn", type: "button", onclick: () => goStage(nextStageOf("puzzle")) }, "Continue →")));
  }

  if (stage === "practice" && m.exercise) viewPractice(m, body, () => goStage("quiz"));

  if (stage === "quiz") {
    const quiz = m.learn.quiz || [];
    const order = shuffle(quiz.map((_, k) => k));
    let idx = 0, score = 0;
    const slot = h("div");
    body.append(h("div", { class: "spread" }, h("h2", {}, "Recall quiz"), h("span", { class: "muted" }, p.quizBest != null ? `Best: ${p.quizBest}/${quiz.length}` : "")),
      h("p", { class: "muted" }, "No peeking at the lesson. The effort of recalling is what builds memory. Rate your confidence honestly."), slot);
    const nextQ = () => {
      slot.innerHTML = "";
      if (idx >= order.length) {
        p.quizBest = Math.max(p.quizBest ?? 0, score); p.quizDone = true; Store.save(); renderSidebar();
        slot.append(h("div", { class: "q", style: "align-items:flex-start" },
          h("div", { class: "score-big num" }, `${score}/${order.length}`),
          h("p", {}, score === order.length ? "Perfect recall. These will still come back in review, because spacing matters even when it feels easy." :
            "The ones you missed are now in your review deck, due tomorrow. Missing them now is what makes them stick later."),
          h("div", { class: "row" },
            h("button", { class: "btn primary", type: "button", onclick: () => goStage("reflect") }, "Explain it →"),
            h("button", { class: "btn", type: "button", onclick: () => render() }, "Retake quiz"))));
        return;
      }
      const qi = order[idx];
      slot.append(h("div", { class: "eyebrow", style: "margin:18px 0 10px" }, `Question ${idx + 1} of ${order.length}`));
      const prior = p.pre[qi];
      const card = renderQuestion(quiz[qi], { prior, onDone: r => {
        if (r.correct) score++;
        const id = `q-${mid}-${qi}`;
        if (!Store.state.srs[id]) addToDeck(id, r.correct && r.confidence !== "guess" ? 2 : 1);
        else grade(id, r.correct ? 2 : 0);
        Store.save();
        card.append(h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: () => { idx++; nextQ(); } }, idx + 1 < order.length ? "Next question →" : "See results")));
        $(".row:last-child .btn", card).focus();
      } });
      slot.append(card); card.focus({ preventScroll: true });
    };
    nextQ();
  }

  if (stage === "reflect") {
    const key = m.sections.find(s => /key takeaways/i.test(s.title));
    const ta = h("textarea", { id: "note-" + mid, placeholder: "Write it as if explaining to a friend. Plain words, your own examples." });
    ta.value = Store.state.notes[mid] || "";
    let t; ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { Store.state.notes[mid] = ta.value; Store.save(); }, 400); });
    const reveal = h("div", { hidden: true, style: "margin-top:18px" }, h("div", { class: "eyebrow", style: "margin-bottom:8px" }, "Compare with the key points"), key ? renderMd(key.md) : h("p", {}, m.learn.big_idea));
    body.append(h("h2", {}, "Explain it in your own words"),
      h("p", { class: "q-text", style: "margin-top:12px" }, m.learn.explain || "Summarise this module in your own words."),
      h("p", { class: "muted" }, "Explaining shows you what you really understand. Saved to your notebook."),
      h("label", { for: "note-" + mid, class: "eyebrow", style: "display:block;margin:6px 0" }, "Your explanation"), ta,
      h("div", { class: "row", style: "margin-top:12px" },
        h("button", { class: "btn", type: "button", onclick: () => { reveal.hidden = false; } }, "Compare with the key points"),
        h("button", { class: "btn primary", type: "button", onclick: () => {
          Store.state.notes[mid] = ta.value; p.reflectDone = true;
          let added = 0; (m.learn.cards || []).forEach((_, k) => { if (addToDeck(`c-${mid}-${k}`)) added++; });
          Store.studied(); Store.save(); renderSidebar();
          toast(added ? `${plural(added, "flashcard")} added to your deck. First review tomorrow.` : "Module complete");
          const nx = MODS[MODS.indexOf(m) + 1];
          if (nx) location.hash = "m-" + nx.id; else location.hash = "home";
        } }, "Complete module →")),
      reveal);
    if (m.read) body.append(readingCard(m.read));
  }
  return out;
}

function viewPractice(m, body, onNext) {

        p.exRuns++; Store.save(); return;
      }
      const passed = res.results.filter(r => r.status === "pass").length;
      const prev = p.exPassed;
      p.exPassed = passed; p.exTotal = res.results.length; p.exRuns++;
      Store.save(); renderSidebar();
      const head = h("div", { class: "spread" }, h("strong", {}, `${passed}/${res.results.length} checks passing`), passed > prev ? h("span", { style: "color:var(--good)" }, `+${passed - prev} since last run`) : null);
      results.append(head, h("div", { class: "progress" }, h("i", { style: `width:${passed / res.results.length * 100}%;background:var(--good)` })));
      res.results.forEach(r => {
        const icon = { pass: "✓", fail: "✗", todo: "…" }[r.status];
        results.append(h("button", { class: "res " + r.status, type: "button", onclick: () => jumpTo(r.name.slice(5)) },
          h("span", { class: "ic" }, icon), h("span", {}, r.label + (r.status === "todo" ? " · not started" : ""), r.msg ? h("span", { class: "msg" }, r.msg) : null)));
      });
      if (passed === res.results.length) {
        results.append(h("div", { class: "callout good" }, h("strong", {}, "Everything passes. "), "Next: the recall quiz.",
          h("div", { class: "row", style: "margin-top:10px" }, h("button", { class: "btn primary", type: "button", onclick: onNext }, "Take the quiz →"))));
      }
    } catch (e) {
      results.innerHTML = "";
      results.append(h("div", { class: "callout bad" }, e.timeout ? "Stopped after 20 seconds. Look for a while loop whose condition never becomes False." :
        "Python couldn't start in this view. You can still use the terminal version: download the course and run python check.py " + Number(m.id) + "."));
    }
  };
  cm = makeEditor(edHost, saved || m.exercise.code, { onRun: runChecks });
  let t; cm.on("change", () => { clearTimeout(t); t = setTimeout(() => { p.code = cm.getValue(); Store.save(); }, 600); });
  function jumpTo(name) {
    const words = name.split("_");
    const camel = words.map(w => w[0].toUpperCase() + w.slice(1)).join("");
    const lines = cm.getValue().split("\n");
    const tries = [new RegExp(`^def ${name}\\b`), new RegExp(`^class ${camel}\\b`), new RegExp(`^(def|class) ${words[0]}`, "i"), new RegExp(`class ${words[0]}`, "i")];
    for (const re of tries) {
      const ln = lines.findIndex(l => re.test(l));
      if (ln >= 0) { cm.focus(); cm.setCursor({ line: ln + 1, ch: 4 }); cm.scrollIntoView({ line: ln, ch: 0 }, 120); host.scrollIntoView({ behavior: "smooth", block: "start" }); return; }

      const e = h("div"); wrap.append(e); solWrap.append(wrap);

    liveEditors.forEach(c => c.refresh());
  } }, "Show solution");
  body.append(host,
    h("div", { class: "row", style: "margin-top:12px" },
      h("button", { class: "btn primary", type: "button", onclick: runChecks, title: "Ctrl+Enter" }, "▶ Run checks"),
      h("button", { class: "btn", type: "button", onclick: () => Engine.stop() }, "Stop"),
      h("button", { class: "btn ghost", type: "button", onclick: function () {
        if (this.dataset.confirm !== "1") { this.dataset.confirm = "1"; this.textContent = "Click again to erase your code"; return; }
        cm.setValue(m.exercise.code); this.dataset.confirm = ""; this.textContent = "Reset to starter";
      } }, "Reset to starter"),
      solBtn),
    h("div", { style: "margin-top:16px" }, results), printed, solWrap);
  if (pendingFind) { const f = pendingFind; pendingFind = null; setTimeout(() => jumpTo(f), 80); }
}

function viewReview() {
  const out = [h("header", { class: "mod-head" }, h("div", { class: "eyebrow" }, "Spaced review"), h("h1", {}, "Review"),
    h("p", { class: "goal" }, "Cards from every module, mixed together and timed to come back just before you'd forget them."))];
  const panel = h("section", { class: "panel" }); out.push(panel);
  if (!ui.review) {

    panel.append(h("div", { class: "grid3" },
      h("div", { class: "stat" }, h("span", { class: "v num" }, due.length), h("span", { class: "k" }, "due now")),
      h("div", { class: "stat" }, h("span", { class: "v num" }, deck.length), h("span", { class: "k" }, "cards in deck")),
      h("div", { class: "stat" }, h("span", { class: "v num" }, deck.filter(id => Store.state.srs[id].box >= 4).length), h("span", { class: "k" }, "well learned (16+ day gap)"))));
    const startWith = ids => { ui.review = { queue: interleave(ids).slice(0, 25), i: 0, right: 0 }; render(); };
    const unlocked = MODS.filter(m => Store.mod(m.id).lessonDone || Store.mod(m.id).quizDone);
    const practicePool = unlocked.flatMap(m => [...(m.learn.cards || []).map((_, k) => `c-${m.id}-${k}`), ...(m.learn.quiz || []).map((_, k) => `q-${m.id}-${k}`)]);
    panel.append(h("div", { class: "row", style: "margin-top:20px" },
      h("button", { class: "btn primary", type: "button", disabled: !due.length, onclick: () => startWith(due) }, due.length ? `Start review (${Math.min(25, due.length)})` : "Nothing due right now"),
      h("button", { class: "btn", type: "button", disabled: !practicePool.length, onclick: () => startWith(shuffle(practicePool).slice(0, 12)) }, "Mixed practice (12)")),
      h("p", { class: "muted", style: "margin-top:14px" }, practicePool.length ? "Mixed practice draws from every module you've studied. Use it on top of, not instead of, your due reviews." :
        "Complete a module's lesson to unlock practice. Cards join your deck when you finish a module."));
    return out;
  }
  const r = ui.review;

    panel.append(h("div", { class: "q", style: "align-items:flex-start" }, h("h2", {}, "Session done"),
      h("div", { class: "score-big num" }, `${r.right}/${r.queue.length}`),

      h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: () => { ui.review = null; render(); } }, "Done"))));
    return out;
  }
  const id = r.queue[r.i]; const it = itemFor(id);
  panel.append(h("div", { class: "spread" }, h("span", { class: "eyebrow" }, `${r.i + 1} of ${r.queue.length}`),
    h("button", { class: "link-btn", type: "button", onclick: () => { ui.review = null; render(); } }, "End session")),
    h("div", { class: "progress", style: "margin:10px 0 20px" }, h("i", { style: `width:${(r.i / r.queue.length) * 100}%;background:var(--amber)` })));
  const advance = () => { r.i++; render(); };
  if (it.kind === "card") {
    const card = renderCard(it, g => { grade(id, g); if (g >= 2) r.right++; Store.studied(); Store.save(); advance(); });
    panel.append(card);
    setTimeout(() => $("textarea", card)?.focus(), 30);
  } else {
    panel.append(h("div", { class: "tag", style: "margin-bottom:8px" }, `Module ${it.mid} · ${byId[it.mid].title}`));
    const q = renderQuestion(it.q, { onDone: res => {
      grade(id, res.correct ? (res.confidence === "guess" ? 1 : 2) : 0);
      if (res.correct) r.right++;
      Store.save();
      q.append(h("div", { class: "row" }, h("button", { class: "btn primary", type: "button", onclick: advance }, "Next →")));
      $(".row:last-child .btn", q).focus();
    } });
    panel.append(q); q.focus({ preventScroll: true });
  }
  return out;
}

  "Guessing game": 'import random\n\nsecret = random.randint(1, 10)\nfor attempt in range(1, 4):\n    guess = int(input("Guess (1-10): "))\n    if guess == secret:\n        print(f"Got it in {attempt}!")\n        break\n    print("Too high" if guess > secret else "Too low")\nelse:\n    print("The number was", secret)',
  "Compound interest": 'balance = 1000.0\nrate = 0.05\nfor year in range(1, 11):\n    balance *= 1 + rate\n    print(f"Year {year:>2}: ${balance:>9,.2f}")',
  "FizzBuzz": 'for n in range(1, 21):\n    if n % 15 == 0:\n        print("FizzBuzz")\n    elif n % 3 == 0:\n        print("Fizz")\n    elif n % 5 == 0:\n        print("Buzz")\n    else:\n        print(n)',
};
function viewPlay() {
  const st = Store.state;
  const out = [h("header", { class: "mod-head" }, h("div", { class: "eyebrow" }, "Scratchpad"), h("h1", {}, "Playground"),
    h("p", { class: "goal" }, "Write anything. The best test of a lesson is closing it and rebuilding the example here from memory."))];
  const ex = h("div", { class: "chips" }, h("span", { class: "muted", style: "margin-right:4px" }, "Load an example:"),
    ...Object.keys(PLAY_EXAMPLES).map(k => h("button", { class: "chip", type: "button", onclick: () => { cm.setValue(PLAY_EXAMPLES[k]); if (/input\(/.test(PLAY_EXAMPLES[k]) && !stdin.value) stdin.value = k === "Hello" ? "Sam" : "5\n7\n3"; } }, k)));
  const host = h("div", { class: "codeblock editor-tall" }, h("div", { class: "bar-top" }, h("span", { class: "lang" }, "main.py"), h("span", {}, "Ctrl+Enter to run")));
  const edHost = h("div"); host.append(edHost);
  const stdin = h("textarea", { id: "play-stdin", placeholder: "One line per input() call" });
  const outEl = h("pre", { class: "output", style: "border:1px solid var(--line);border-radius:10px;min-height:80px" }, "Output appears here.");
  const run = async () => {
    st.play = cm.getValue(); Store.save();
    outEl.textContent = Engine.status === "ready" ? "Running…" : "Starting Python…";
    try { renderOutput(outEl, await Engine.run({ code: cm.getValue(), key: "play", cwd: "/course/play", stdin: stdin.value.split("\n"), fresh: true })); }
    catch (e) { outEl.textContent = e.timeout ? "Stopped after 10 seconds. Is there a loop that never ends?" : e.stopped ? "Stopped." : "Python couldn't start in this view."; }
  };
  const cm = makeEditor(edHost, st.play || PLAY_EXAMPLES["Word counter"], { onRun: run });
  let t; cm.on("change", () => { clearTimeout(t); t = setTimeout(() => { st.play = cm.getValue(); Store.save(); }, 600); });
  out.push(ex, host,
    h("div", { class: "grid2" },
      h("div", {}, h("label", { for: "play-stdin", class: "eyebrow", style: "display:block;margin-bottom:6px" }, "Input"), stdin),
      h("div", { class: "row", style: "align-items:flex-end" },
        h("button", { class: "btn primary", type: "button", onclick: run }, "▶ Run"),
        h("button", { class: "btn", type: "button", onclick: () => Engine.stop() }, "Stop"))),
    h("div", {}, h("div", { class: "eyebrow", style: "margin-bottom:6px" }, "Output"), outEl));
  return out;
}

function viewNotebook() {
  const out = [h("header", { class: "mod-head" }, h("div", { class: "eyebrow" }, "Your words"), h("h1", {}, "Notebook"),
    h("p", { class: "goal" }, "Every explain-it answer you've written. Re-read and improve them; rewriting an explanation is another round of retrieval."))];
  MODS.forEach(m => {
    const ta = h("textarea", { id: "nb-" + m.id, placeholder: m.learn.explain || "" });
    ta.value = Store.state.notes[m.id] || "";
    let t; ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { Store.state.notes[m.id] = ta.value; Store.save(); }, 400); });
    out.push(h("section", { class: "panel flat" }, h("div", { class: "spread" }, h("h3", {}, `${m.id} · ${m.title}`), h("a", { href: `#m-${m.id}`, class: "muted" }, "Open module")),
      h("p", { class: "muted", style: "margin:6px 0 10px" }, m.learn.explain || ""), ta));
  });
  return out;
}

function viewScience() {
  return [h("header", { class: "mod-head" }, h("div", { class: "eyebrow" }, "The design"), h("h1", {}, "How this course makes it stick"),
    h("p", { class: "goal" }, "Most courses optimise for feeling productive: re-reading, highlighting, watching. Those feel good and fade fast. Every feature here is borrowed from decades of memory research instead.")),
    h("section", { class: "panel" }, h("div", { style: "display:flex;flex-direction:column;gap:22px" }, ...SCIENCE.map(s => h("div", { class: "science-item" },
      h("div", { class: "icon", "aria-hidden": "true" }, s.k),
      h("div", {}, h("h3", {}, s.name), h("p", {}, s.what), h("p", {}, h("strong", {}, "In this course: "), s.here), h("p", { class: "cite" }, s.cite)))))),
    h("section", { class: "callout blue" }, h("strong", {}, "The daily habit that matters most: "), "do your due reviews first (usually 5–10 minutes), then continue the next module. Little and often beats long and rare.")];
}

function viewDoc(md, eyebrow) {
  return [h("div", { class: "eyebrow" }, eyebrow), h("section", { class: "panel" }, renderMd(md, { runnable: false }))];
}

/* =====================================================================
   Sidebar, router, boot
   ===================================================================== */
function renderSidebar() {
  const nav = $("#nav"); nav.innerHTML = "";
  const cur = location.hash.slice(1) || "home";
  const link = (href, label, extra) => h("a", { class: "nav-link" + (cur === href ? " active" : ""), href: "#" + href }, h("span", { class: "ntitle" }, label), extra || null);
  const due = dueIds().length;
  nav.append(link("home", "Dashboard"), link("review", "Review", due ? h("span", { class: "nav-badge num" }, due) : null), link("play", "Playground"));
  C.parts.forEach(([name, ids]) => {
    nav.append(h("div", { class: "nav-group" }, name));
    ids.forEach(id => nav.append(h("a", { class: "nav-link" + (cur === "m-" + id ? " active" : ""), href: "#m-" + id },
      h("span", { class: "nid" }, id), h("span", { class: "ntitle" }, byId[id].title), ring(modProgress(byId[id]), 18))));
  });
  nav.append(h("div", { class: "nav-group" }, "Projects"));
  C.projects.forEach(p => nav.append(link("project-" + p.n, p.title.replace(/^(Checkpoint Project \d|Capstone):\s*/, (m0) => m0.startsWith("Cap") ? "Capstone: " : `${p.n}. `))));
  nav.append(h("div", { class: "nav-group" }, "Reference"), link("cheatsheet", "Cheatsheet"), link("notebook", "My notebook"), link("science", "How it's designed"));
}

function render() {
  const route = location.hash.slice(1) || "home";
  liveEditors = [];
  const view = $("#view"); view.innerHTML = "";
  let nodes, crumb;
  if (route.startsWith("m-") && byId[route.slice(2)]) { const m = byId[route.slice(2)]; nodes = viewModule(m.id); crumb = `<b>Module ${m.id}</b> · ${esc(m.title)}`; }
  else if (route === "review") { nodes = viewReview(); crumb = "<b>Review</b>"; }
  else if (route === "play") { nodes = viewPlay(); crumb = "<b>Playground</b>"; }
  else if (route === "notebook") { nodes = viewNotebook(); crumb = "<b>Notebook</b>"; }
  else if (route === "science") { nodes = viewScience(); crumb = "<b>How it's designed</b>"; }
  else if (route === "cheatsheet") { nodes = viewDoc(C.cheatsheet, "Reference"); crumb = "<b>Cheatsheet</b>"; }
  else if (route.startsWith("project-")) { const p = C.projects.find(x => "project-" + x.n === route); nodes = p ? viewDoc(p.md, "Project") : viewHome(); crumb = p ? `<b>${esc(p.title)}</b>` : ""; }
  else { nodes = viewHome(); crumb = "<b>Dashboard</b>"; }
  view.append(...nodes);
  $("#crumb").innerHTML = crumb;
  renderSidebar();
  requestAnimationFrame(() => { liveEditors.forEach(cm => cm.refresh()); applyHighlight(); });
  if (route !== "home" && Engine.status === "idle" && !Engine.starting) setTimeout(() => Engine.start().catch(() => {}), 800);
}

function applyTheme() {
  let t = null; try { t = localStorage.getItem("python-foundry-theme"); } catch (_) {}
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  $("#themeBtn").textContent = "Theme: " + (t || "system");
}

function boot() {
  Store.load();
  applyTheme();
  $("#predictToggle").checked = Store.state.predict;
  $("#predictToggle").addEventListener("change", e => { Store.state.predict = e.target.checked; Store.save(); toast(e.target.checked ? "You'll predict output before running examples" : "Examples run straight away"); });
  $("#themeBtn").addEventListener("click", () => {
    let t = null; try { t = localStorage.getItem("python-foundry-theme"); } catch (_) {}
    const next = { null: "light", light: "dark", dark: null }[t];
    try { next ? localStorage.setItem("python-foundry-theme", next) : localStorage.removeItem("python-foundry-theme"); } catch (_) {}
    if (next) document.documentElement.setAttribute("data-theme", next); else document.documentElement.removeAttribute("data-theme");
    $("#themeBtn").textContent = "Theme: " + (next || "system");
    liveEditors.forEach(cm => cm.refresh());
  });
  $("#menuBtn").addEventListener("click", () => $("#sidebar").classList.toggle("open"));
  $("#nav").addEventListener("click", e => { if (e.target.closest("a")) $("#sidebar").classList.remove("open"); });
  $("#searchOpen").addEventListener("click", () => Search.open());
  $("#searchClose").addEventListener("click", () => Search.close());
  $("#searchLayer").addEventListener("click", e => { if (e.target.id === "searchLayer") Search.close(); });
  let st; $("#searchInput").addEventListener("input", () => { clearTimeout(st); st = setTimeout(() => Search.draw(), 80); });
  $("#searchInput").addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); Search.move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); Search.move(-1); }
    else if (e.key === "Enter") { e.preventDefault(); Search.go(Search.sel); }
    else if (e.key === "Escape") Search.close();
  });
  document.addEventListener("keydown", e => {
    const typing = e.target.closest("input, textarea, .CodeMirror, [contenteditable]");
    if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !typing)) { e.preventDefault(); Search.open(); return; }
    if (e.key === "Escape" && !$("#searchLayer").hidden) Search.close();
    if (e.key === " " && !typing) { const r = $("#view .flash button.btn.primary"); if (r && r.textContent.startsWith("Reveal")) { e.preventDefault(); r.click(); } }
  });
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  render();
  // Sync with private cloud storage when available (claude.ai, signed in)
  Store.connect().then(found => { if (!found) setTimeout(() => Store.connect(), 1500); });
}

boot();
})();

</script>
