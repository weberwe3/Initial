on.get(\"args\", {})\n        history.append({\"role\": \"assistant\", \"tool\": name, \"args\": args})\n        if needs_approval(name, risky_tools) and (approve is None or not approve(name, args)):\n            result = \"denied: needs human approval\"\n        else:\n            result = run_tool(name, args, tools)\n        history.append({\"role\": \"tool\", \"content\": result})\n        steps += 1\n    return {\"answer\": None, \"steps\": steps, \"history\": history, \"stopped\": \"max_steps\"}\n\n\ndef tool_call_log(history):\n    log = []\n    for i, msg in enumerate(history):\n        if msg.get(\"role\") == \"assistant\" and \"tool\" in msg:\n            args = \", \".join(f\"{k}={v}\" for k, v in sorted(msg[\"args\"].items()))\n            result = history[i + 1][\"content\"] if i + 1 < len(history) else \"(no result)\"\n            log.append(f\"{msg['tool']}({args}) -> {result}\")\n    return log\n"}, "support": {}}, {"id": "A11", "slug": "A11_ambassador_playbook", "track": "ai", "title": "The AI Ambassador Playbook", "goal": "lead AI adoption on your team: find and prioritise use cases, measure value, teach colleagues, manage risk, and communicate results to leadership.", "time": "4 hours, then ongoing.", "intro": "Being labelled an \"AI ambassador\" is an opportunity: you're being asked to\nlead change, not just use tools. The people who do this well become the\nnatural candidates for AI-focused roles. This module is the playbook.", "sections": [{"title": "What a great ambassador actually does", "md": "| Role | In practice |\n|------|-------------|\n| **Practitioner** | Uses AI daily on real work; has stories and receipts |\n| **Teacher** | Runs short demos, office hours, and pairs with colleagues |\n| **Curator** | Maintains the team prompt library, guardrail card and tool guide |\n| **Scout** | Finds and prioritises use cases; runs small pilots |\n| **Translator** | Explains AI to leadership in business terms, and leadership's goals to the team |\n| **Guardian** | Knows the policies; raises risks early; partners with IT, security, legal |\n\nYou don't need to be the most technical person. You need to be the most\n**useful** person on AI for your team."}, {"title": "Finding use cases", "md": "Run a 45-minute **use-case workshop**:\n\n1. Everyone lists tasks they do weekly that are **repetitive, text-heavy, or\n   slow to start** (drafting, summarising, reformatting, searching, explaining).\n2. For each: hours per week, number of people, how painful, and data sensitivity.\n3. Cluster similar ideas; pick the top few to score.\n\nGood first use cases share traits: **frequent, low-risk, easy to verify,\nmeasurable**, e.g. meeting notes → action items, first drafts of recurring\nreports, SQL/formula help, documenting Alteryx workflows, classifying\nsurvey comments."}, {"title": "Prioritising: value × feasibility", "md": "Score each use case 1–5 on **value** (time saved, quality, revenue/risk impact)\nand **feasibility** (data available and allowed, tool approved, easy to verify),\nthen place it on a 2×2:\n\n```text\n            Feasibility →\n          low                 high\n high  ┌──────────────────┬──────────────────┐\n Value │ Strategic bet    │ QUICK WIN ✅     │\n       │ (plan it)        │ (do it now)      │\n       ├──────────────────┼──────────────────┤\n  low  │ Avoid            │ Fill-in          │\n       │                  │ (if time allows) │\n       └──────────────────┴──────────────────┘\n```\n\nStart with **quick wins**: they build credibility and momentum. Subtract\npoints for risk (personal data, customer-facing output, decisions about\npeople). You'll code this scoring in the exercises."}, {"title": "Running a pilot", "md": "```text\nWeek 0  Define: task, baseline time/quality, success metric, guardrails\nWeek 1–3  3–6 volunteers use the approach; log time and issues\nWeek 4  Measure vs baseline; collect quotes; decide: scale, adjust, or stop\n```\n\nWrite down the **baseline before you start** (how long it takes today, error\nrate, turnaround). Without a baseline, there's no proof."}, {"title": "Measuring value", "md": "| Metric | How to get it |\n|--------|---------------|\n| **Time saved** | Before/after timings on real tasks; weekly self-report |\n| **Adoption** | Active users ÷ licensed users; weekly active trend |\n| **Quality** | Error rates, rework, reviewer scores, stakeholder feedback |\n| **Speed** | Turnaround time for requests or reports |\n| **Capability** | Analyses now possible that weren't (e.g. all 20k comments read, not a sample) |\n| **Confidence** | Short survey: \"How confident are you using AI for X?\" (1–5), before and after training |\n\nTranslate to money carefully and conservatively:\n\n> annual value ≈ hours saved per week × people × working weeks × loaded hourly cost\n\nThen subtract tool costs. Present ranges, state assumptions, and prefer\n**measured** savings over hoped-for savings. Leaders trust modest, evidenced\nnumbers more than big projections."}, {"title": "Teaching your team", "md": "What works:\n- **15-minute \"show, don't tell\" demos** on a real team task, live.\n- **Office hours:** a weekly slot to bring a task and solve it together.\n- **Prompt library:** a shared doc or page of tested prompts, by task, with\n  an example output and an owner.\n- **Buddy pairing:** sit with someone for 30 minutes on their own work.\n- **Celebrate wins:** share a \"tip of the week\" with a real time saving.\n\nMeet people where they are. Sceptics often have valid concerns (accuracy,\njob security, data). Acknowledge them, show the guardrails, and start with\ntasks they dislike doing."}, {"title": "Talking to leadership", "md": "Leaders want to know: *What's the value? What's the risk? What do you need?*\n\n```text\nOne-page AI update\n1. Headline: \"AI-assisted reporting saved the team ~14 hrs/week in the pilot.\"\n2. Evidence: baseline vs pilot numbers, adoption, two quotes.\n3. Risks & controls: data rules followed, verification steps, incidents (none).\n4. Next: scale to 2 more teams; needs: licences for 12 people, 2 hrs/week of my time.\n```\n\nSpeak in the language of **business outcomes** (cycle time, capacity,\nquality, risk), not model names."}, {"title": "Governance partnership", "md": "Partner early with IT, security, data governance and legal. Bring them\n**specific** use cases with data classes and controls, not vague enthusiasm.\nHelp write: approved-tools list, data rules, an intake form for new use cases,\nand an incident path (\"AI produced something wrong that got out: what do we do?\").\nBeing the bridge between enthusiasts and risk owners is one of the most valued\nambassador skills."}, {"title": "Key takeaways", "md": "Practitioner, teacher, curator, scout, translator, guardian.\n- Find use cases in workshops; prioritise by value × feasibility, minus risk; start with quick wins.\n- Pilot with a baseline; measure time, adoption, quality, and confidence.\n- Report modest, evidenced value to leadership with risks and asks.\n\n**Continue reading:** [The State of AI](https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai) (McKinsey Global Survey). The annual survey of how organisations adopt AI and where they see value, useful benchmarks and language for making the business case to leadership."}], "learn": {"big_idea": "Lead adoption like a product: find use cases, prioritise by value × feasibility minus risk, pilot against a baseline, and report evidence.", "pretest": [0, 3], "quiz": [{"q": "Which use case is the best first 'quick win'?", "options": ["Meeting notes → action items", "Auto-approving refunds", "Ranking job candidates", "Rewriting the forecasting model"], "answer": 0, "why": "Frequent, low-risk, easy to verify, measurable."}, {"q": "Why record a baseline before a pilot?", "options": ["Without it you can't prove improvement", "It's required by IT", "To slow the pilot down", "Baselines improve the model"], "answer": 0, "why": "Before and after numbers are your evidence."}, {"type": "output", "q": "Annual value estimate: what prints?", "code": "hours, people, weeks, rate = 2, 10, 46, 50\nprint(hours * people * weeks * rate)", "answer": "46000", "why": "hours/week × people × working weeks × loaded hourly cost."}, {"q": "How should a leadership AI update start?", "options": ["With a business outcome and evidence", "With the model's name and version", "With a demo of prompts", "With a long history of AI"], "answer": 0, "why": "Leaders want value, risk and asks, in business terms."}, {"q": "A colleague worries AI is inaccurate. Best ambassador response?", "options": ["Acknowledge it, show the verification guardrails, start with low-risk tasks", "Tell them they're wrong", "Ignore them", "Escalate to their manager"], "answer": 0, "why": "Sceptics often have valid concerns; guardrails and small wins persuade."}, {"q": "A use case scores high value but involves decisions about people with no controls. Where does it go?", "options": ["Avoid, until controls lower the risk", "Quick win", "Fill-in", "Launch immediately"], "answer": 0, "why": "Risk overrides value until it's controlled."}], "cards": [["Six ambassador roles?", "Practitioner, teacher, curator, scout, translator, guardian."], ["The value × feasibility 2×2?", "Quick win (high/high), strategic bet (high value, low feasibility), fill-in, avoid."], ["Traits of a good first use case?", "Frequent, low-risk, easy to verify, measurable."], ["Pilot shape?", "Week 0 define + baseline → 3 weeks with volunteers → week 4 measure and decide."], ["Five metrics of AI value?", "Time saved, adoption, quality, speed, confidence (+ new capability)."], ["One-page leadership update?", "Headline outcome, evidence, risks and controls, next step and ask."]], "parsons": {"prompt": "Prioritise use cases.", "lines": ["for uc in use_cases:", "    uc[\"score\"] = uc[\"value\"] * 0.5 + uc[\"feasibility\"] * 0.3 - (uc[\"risk\"] - 1) * 0.2", "ranked = sorted(use_cases, key=lambda uc: -uc[\"score\"])", "quick_wins = [uc for uc in ranked if quadrant(uc) == \"Quick win\"]", "print([uc[\"name\"] for uc in quick_wins[:3]])"]}, "explain": "Draft your team's first AI pilot: the task, the baseline you'll measure, the guardrails, and how you'll report the result."}, "read": {"title": "The State of AI", "url": "https://www.mckinsey.com/capabilities/quantumblack/our-insights/the-state-of-ai", "source": "McKinsey Global Survey", "why": "The annual survey of how organisations adopt AI and where they see value, useful benchmarks and language for making the business case to leadership."}, "exercise": {"code": "\"\"\"\nModule A11 exercises: The ambassador's toolkit.   Run:  python check.py A11\n\nPrioritise use cases, estimate value conservatively, and report adoption,\nthe numbers that turn AI enthusiasm into leadership decisions.\n\"\"\"\n\nimport math\n\n\ndef score_use_case(uc):\n    # TODO: uc is a dict with \"value\", \"feasibility\" (1-5 each) and \"risk\" (1-5,\n    # 5 = riskiest). Return value * 0.5 + feasibility * 0.3 - (risk - 1) * 0.2,\n    # rounded to 2 decimals.\n    raise NotImplementedError\n\n\ndef quadrant(uc):\n    # TODO: place a use case on the 2x2:\n    #   value >= 3 and feasibility >= 3 -> \"Quick win\"\n    #   value >= 3 and feasibility < 3  -> \"Strategic bet\"\n    #   value < 3 and feasibility >= 3  -> \"Fill-in\"\n    #   otherwise                       -> \"Avoid\"\n    # A use case with risk 5 is always \"Avoid\" until controls lower the risk.\n    raise NotImplementedError\n\n\ndef prioritise(use_cases):\n    # TODO: return a NEW list of new dicts, each with added \"score\" and \"quadrant\"\n    # fields, sorted by score (highest first; ties keep the original order).\n    raise NotImplementedError\n\n\ndef annual_value(hours_saved_per_week, people, hourly_cost, weeks=46, tool_cost_per_month=0):\n    # TODO: (hours x people x weeks x hourly_cost) - 12 x tool_cost_per_month,\n    # rounded to 0 decimals (return an int).\n    raise NotImplementedError\n\n\ndef payback_months(setup_cost, monthly_net_saving):\n    # TODO: months until savings repay the setup cost, rounded UP to a whole month.\n    # Return None if monthly_net_saving <= 0 (it never pays back).\n    raise NotImplementedError\n\n\ndef adoption_rate(weekly_active, licensed):\n    # TODO: weekly_active is a list of active-user counts per week. Return the\n    # latest week's adoption as a percentage of licensed seats, rounded to 1 decimal.\n    raise NotImplementedError\n\n\ndef confidence_shift(before, after):\n    # TODO: before/after are lists of 1-5 survey scores. Return\n    # {\"before\": avg, \"after\": avg, \"change\": after - before}, each rounded to 2 decimals.\n    raise NotImplementedError\n", "tests": "UCS = [\n    {\"name\": \"Meeting notes\", \"value\": 3, \"feasibility\": 5, \"risk\": 1},\n    {\"name\": \"Auto-approve refunds\", \"value\": 5, \"feasibility\": 3, \"risk\": 5},\n    {\"name\": \"Survey comment tagging\", \"value\": 4, \"feasibility\": 4, \"risk\": 2},\n    {\"name\": \"Forecast rewrite\", \"value\": 4, \"feasibility\": 2, \"risk\": 2},\n    {\"name\": \"Slide fonts\", \"value\": 1, \"feasibility\": 2, \"risk\": 1},\n]\n\n\ndef test_score_use_case(ex):\n    assert ex.score_use_case(UCS[0]) == 3.0, \"3*0.5 + 5*0.3 - 0 = 3.0\"\n    assert ex.score_use_case(UCS[2]) == 3.0, \"4*0.5 + 4*0.3 - 1*0.2 = 3.0\"\n    assert ex.score_use_case(UCS[1]) == 2.6\n\n\ndef test_quadrant(ex):\n    assert [ex.quadrant(u) for u in UCS] == [\"Quick win\", \"Avoid\", \"Quick win\", \"Strategic bet\", \"Avoid\"]\n    assert ex.quadrant({\"value\": 2, \"feasibility\": 4, \"risk\": 1}) == \"Fill-in\"\n\n\ndef test_prioritise(ex):\n    got = ex.prioritise(UCS)\n    assert [u[\"name\"] for u in got] == [\"Meeting notes\", \"Survey comment tagging\", \"Auto-approve refunds\",\n                                        \"Forecast rewrite\", \"Slide fonts\"], [u[\"name\"] for u in got]\n    assert got[0][\"quadrant\"] == \"Quick win\" and got[0][\"score\"] == 3.0\n    assert \"score\" not in UCS[0], \"don't modify the input\"\n\n\ndef test_annual_value(ex):\n    assert ex.annual_value(2, 10, 50) == 46000\n    assert ex.annual_value(2, 10, 50, tool_cost_per_month=300) == 42400\n    assert isinstance(ex.annual_value(1.5, 3, 40.5), int)\n\n\ndef test_payback_months(ex):\n    assert ex.payback_months(10000, 3000) == 4\n    assert ex.payback_months(9000, 3000) == 3\n    assert ex.payback_months(5000, 0) is None\n\n\ndef test_adoption_rate(ex):\n    assert ex.adoption_rate([5, 9, 14], 20) == 70.0\n\n\ndef test_confidence_shift(ex):\n    assert ex.confidence_shift([2, 3, 2, 1], [4, 4, 3, 4]) == {\"before\": 2.0, \"after\": 3.75, \"change\": 1.75}\n", "solution": "\"\"\"Module A11 solutions.\"\"\"\n\nimport math\n\n\ndef score_use_case(uc):\n    return round(uc[\"value\"] * 0.5 + uc[\"feasibility\"] * 0.3 - (uc[\"risk\"] - 1) * 0.2, 2)\n\n\ndef quadrant(uc):\n    if uc.get(\"risk\", 1) >= 5:\n        return \"Avoid\"\n    high_value, feasible = uc[\"value\"] >= 3, uc[\"feasibility\"] >= 3\n    if high_value and feasible:\n        return \"Quick win\"\n    if high_value:\n        return \"Strategic bet\"\n    if feasible:\n        return \"Fill-in\"\n    return \"Avoid\"\n\n\ndef prioritise(use_cases):\n    scored = [{**uc, \"score\": score_use_case(uc), \"quadrant\": quadrant(uc)} for uc in use_cases]\n    return sorted(scored, key=lambda uc: -uc[\"score\"])\n\n\ndef annual_value(hours_saved_per_week, people, hourly_cost, weeks=46, tool_cost_per_month=0):\n    return int(round(hours_saved_per_week * people * weeks * hourly_cost - 12 * tool_cost_per_month))\n\n\ndef payback_months(setup_cost, monthly_net_saving):\n    if monthly_net_saving <= 0:\n        return None\n    return math.ceil(setup_cost / monthly_net_saving)\n\n\ndef adoption_rate(weekly_active, licensed):\n    return round(weekly_active[-1] / licensed * 100, 1)\n\n\ndef confidence_shift(before, after):\n    b, a = sum(before) / len(before), sum(after) / len(after)\n    return {\"before\": round(b, 2), \"after\": round(a, 2), \"change\": round(a - b, 2)}\n"}, "support": {}}, {"id": "A12", "slug": "A12_ai_career", "track": "ai", "title": "Your AI Career", "goal": "turn this curriculum into career capital: a clear target role, a portfolio that proves your skills, and a story that positions you for AI-related positions.", "time": "2 hours to plan, then a 90-day plan to execute.", "intro": "You're in a strong position. Business analysts who combine **domain knowledge,\ndata skills (Alteryx, SQL), Python and practical AI** are exactly who\norganisations need to turn AI from demos into business results. This module\nhelps you make that visible.", "sections": [{"title": "Roles this curriculum points toward", "md": "| Role | What it involves | What to emphasise |\n|------|------------------|-------------------|\n| **AI-enabled business / data analyst** | Analysis with AI throughout; text analytics; automation | Measurable time savings; text analytics projects; verification habits |\n| **AI enablement lead / AI champion lead** | Adoption programmes, training, governance, prompt libraries | Ambassador results: adoption %, training delivered, use cases scaled |\n| **Analytics engineer / automation developer** | Production data pipelines with AI steps (Alteryx, Python, SQL, cloud) | Reliable pipelines; testing; evaluation; cost control |\n| **AI product analyst / AI product owner** | Defining AI features, success metrics, evaluation, rollout | Use-case discovery, evals, stakeholder communication |\n| **AI solutions consultant (internal or external)** | Scoping and delivering AI use cases for business teams | Breadth: tools, RAG, agents, governance; storytelling |\n\nTitles vary wildly between companies. Read job descriptions for the **skills**\nthey ask for, not the title."}, {"title": "Your skills map", "md": "Rate yourself 1–5 today, then again in 90 days:\n\n| Area | Skills | Modules |\n|------|--------|---------|\n| AI literacy | How LLMs work, limits, costs, vendors | A00, A02 |\n| Prompting | Structured prompts, templates, iteration, prompt libraries | A01 |\n| Responsible AI | Data classes, minimisation, verification, bias, regulation | A03 |\n| Analysis | AI-assisted analysis, verification, pandas | A04–A06 |\n| AI engineering | APIs, structured outputs, row-level automation, evaluation | A07–A08 |\n| Advanced patterns | RAG, agents, tool use, MCP | A09–A10 |\n| Leadership | Use-case discovery, ROI, teaching, governance | A11 |\n| Python | Core language through intermediate | Python track |"}, {"title": "A portfolio that proves it", "md": "Three to four solid projects beat ten tutorials. Strong choices for a BA in an\nAlteryx shop (use public or synthetic data, or anonymised work examples you're\nallowed to share):\n\n1. **Customer-feedback insights pipeline:** AI classification of thousands of\n   comments, evaluated against a gold set, with a keyword baseline comparison\n   and a one-page insight report. (This track's capstone.)\n2. **Alteryx ↔ Python translation:** a real-style workflow rebuilt in pandas,\n   with row-count reconciliation and a write-up of when you'd use each.\n3. **Policy/document Q&A (RAG):** a small grounded Q&A over public documents\n   with citations and a 30-question evaluation.\n4. **Ambassador case study:** the use-case workshop, prioritisation, pilot\n   design and measured results (anonymised), as a 2-page write-up.\n\nFor each project, show: **the business problem, your approach, how you\nverified it, the result in numbers, and what you'd do next.** Put code on\nGitHub with a clear README (the Python track's capstone teaches this)."}, {"title": "Telling your story", "md": "Use **situation → action → result**, with numbers:\n\n> \"Our team spent ~6 hours a week manually tagging survey comments, so we only\n> sampled 10%. I built an AI classification step into our Alteryx workflow,\n> evaluated it at 91% agreement with expert labels, and now we analyse 100% of\n> comments in under an hour. As AI ambassador I trained 14 colleagues; weekly\n> active usage went from 3 to 11 people.\"\n\nKeep a running **brag document**: every win, metric, quote and lesson,\ndated. It writes your performance review, your CV bullets and your interview\nanswers."}, {"title": "Credentials (optional, useful for signalling)", "md": "Credentials don't replace a portfolio, but they help get past filters:\n\n- **Your platforms:** Alteryx's own certifications validate the skills you\n  use daily.\n- **Cloud AI fundamentals:** entry-level AI certifications from major cloud\n  providers (Microsoft, Google, AWS) are widely recognised.\n- **Vendor courses:** AI model providers and learning platforms offer free or\n  low-cost courses on prompting, APIs and agents.\n\nPick one or two that match your target role and your company's technology stack."}, {"title": "Staying current without drowning", "md": "Follow **two or three** trusted sources, not twenty.\n- Re-test your prompt library when models change; keep what still wins.\n- Spend 30 minutes a week trying one new capability on a real task.\n- Share what you learn: teaching is the fastest way to deepen it, and it's\n  visible leadership."}, {"title": "Your 90-day plan", "md": "| Days | Focus | Output |\n|------|-------|--------|\n| 1–30 | Daily AI use; A00–A04; guardrail card; prompt library v1 | Evidence log; first team demo |\n| 31–60 | A05–A08; capstone pipeline on a real or public dataset | Evaluated pipeline; write-up |\n| 61–90 | A09–A11; run a use-case workshop and one pilot | Pilot results; leadership one-pager; portfolio on GitHub |\n\nAt day 90, update your CV and internal profile, share the pilot results, and\nhave a conversation with your manager about where AI fits in your next role."}, {"title": "Key takeaways", "md": "Domain + data + Python + AI is a rare, valuable combination; aim it at a specific role.\n- Three or four evaluated, measured portfolio projects beat any number of tutorials.\n- Tell stories with situation → action → result, and keep a brag document.\n- A 90-day plan turns this curriculum into visible career capital.\n\n**Continue reading:** [AI Engineer Roadmap](https://roadmap.sh/ai-engineer) (roadmap.sh). A community-maintained, interactive map of the skills behind AI engineering roles, useful for spotting gaps and planning what to learn after this track."}], "learn": {"big_idea": "Domain + data + Python + AI is rare and valuable. Prove it with evaluated, measured projects and tell it as situation → action → result.", "pretest": [0, 2], "quiz": [{"q": "What makes a portfolio project persuasive?", "options": ["A business problem, verified approach and measured result", "Lots of code", "A famous dataset", "Using the newest model"], "answer": 0, "why": "Show the problem, approach, verification, result in numbers, and next steps."}, {"q": "Which story format works best in interviews and reviews?", "options": ["Situation → action → result, with numbers", "A list of tools you know", "Your job title history", "A summary of AI news"], "answer": 0, "why": "Concrete outcomes beat lists of skills."}, {"q": "What is a 'brag document'?", "options": ["A running, dated log of wins, metrics and quotes", "A CV", "A LinkedIn post", "A performance warning"], "answer": 0, "why": "It writes your review, CV bullets and interview answers for you."}, {"q": "How should you read AI job postings?", "options": ["For the skills asked for, not the title", "By title only", "By salary only", "Ignore them"], "answer": 0, "why": "Titles vary wildly; skills transfer."}, {"q": "How many sources should you follow to stay current?", "options": ["Two or three trusted ones", "Every newsletter", "None", "Only social media"], "answer": 0, "why": "Depth beats drowning. Test new capabilities on real tasks."}, {"q": "What should happen at day 90 of your plan?", "options": ["Share pilot results, update your CV, and discuss next role with your manager", "Start over", "Stop using AI", "Wait for a promotion"], "answer": 0, "why": "Make the capital visible."}], "cards": [["Five roles this track points to?", "AI-enabled analyst, AI enablement lead, analytics/automation engineer, AI product analyst, AI solutions consultant."], ["Four strong portfolio projects?", "Feedback insights pipeline, Alteryx↔Python translation, document Q&A (RAG), ambassador case study."], ["What should every project write-up include?", "Problem, approach, verification, result in numbers, next steps."], ["Credentials strategy?", "One or two matching your target role and company stack. A portfolio matters more."], ["90-day plan phases?", "Days 1–30 habits and foundations; 31–60 capstone; 61–90 workshop, pilot and portfolio."], ["Weekly staying-current habit?", "30 minutes trying one new capability on a real task, then share what you learned."]], "parsons": {"prompt": "Order a strong STAR-style story.", "lines": ["Situation: we only read 10% of survey comments (6 hrs/week)", "Action: built an AI classification step in our Alteryx workflow", "Verification: 91% agreement with expert labels on a 200-row gold set", "Result: 100% of comments analysed in under an hour", "Leadership: trained 14 colleagues; weekly users rose from 3 to 11"]}, "explain": "Write your own situation → action → result story about AI (real or planned), with the numbers you'll need to collect."}, "read": {"title": "AI Engineer Roadmap", "url": "https://roadmap.sh/ai-engineer", "source": "roadmap.sh", "why": "A community-maintained, interactive map of the skills behind AI engineering roles, useful for spotting gaps and planning what to learn after this track."}, "support": {}}], "projects": [{"n": "1", "track": "python", "title": "Checkpoint Project 1: Your First Real Programs", "md": "# Checkpoint Project 1: Your First Real Programs\n\n**After:** Module 06 · **Time:** 3–5 hours\n\nExercises train individual skills; projects make you combine them. Build these\nin a new folder, e.g. `my_projects/`, as complete programs you run with\n`python guess.py`.\n\nThere's no checker for projects. You'll know it works because you can use it.\nReference solutions are in the `projects/solutions/` folder of the course repo, but\ntry for real first.\n\n---\n\n## Part A: Number-guessing game\n\nThe computer picks a secret number between 1 and 100. The player guesses until\nthey get it, and the program says \"too high\" or \"too low\" each time.\n\n```\nI'm thinking of a number between 1 and 100.\nYour guess: 50\nToo high!\nYour guess: 25\nToo low!\nYour guess: 37\n🎉 Got it in 3 guesses!\n```\n\n### Requirements\n1. Pick the secret with `import random` and `random.randint(1, 100)`.\n2. Loop until the guess is right.\n3. Count the guesses and report the total at the end.\n4. If the player types something that isn't a number, say so and **don't** count it\n   (hint: `.isdigit()`).\n\n### Level up (pick any)\n- Let the player choose a difficulty (1–10, 1–100, 1–1000).\n- Limit the number of guesses and reveal the number if they lose.\n- Ask \"Play again? (y/n)\" and keep a best score across rounds.\n- Swap roles: **you** think of a number and the *computer* guesses (hint: halve the range each time).\n\n---\n\n## Part B: Bill splitter & tip calculator\n\n```\nBill total: $86.40\nTip percentage (15/18/20 or custom): 18\nHow many people? 3\n\nSubtotal:        $86.40\nTip (18%):       $15.55\nTotal:          $101.95\nEach person pays: $33.98\n```\n\n### Requirements\n1. Ask for the bill, tip percent, and number of people.\n2. Print a neatly aligned summary using f-string formatting (`:>10.2f`).\n3. Re-ask if any input is invalid (negative, zero people, not a number).\n\n### Level up\n- Let each person enter what they ordered (a list of item prices per person) and\n  split the tip proportionally.\n- Store everyone's name and share in a dict and print a per-person table.\n\n---\n\n## Part C: Word statistics\n\nAsk the user to paste a paragraph. Report:\n\n- Number of words and characters\n- The 5 most common words (ignore case and punctuation)\n- The longest word\n- Average word length\n\nHint: to strip punctuation, loop over the characters and keep only\n`ch.isalpha() or ch == \" \"`.\n\n---\n\n## What you're practising\n`input`, type conversion, `while` loops, `if/elif/else`, string methods,\nlists, dicts, and the counting pattern: all of Part 1 in one place.\n"}, {"n": "2", "track": "python", "title": "Checkpoint Project 2: Personal Expense Tracker", "md": "# Checkpoint Project 2: Personal Expense Tracker\n\n**After:** Module 10 · **Time:** 8–12 hours (spread over a week)\n\nBuild a command-line tool you'll actually use to track your spending. It saves\ndata between runs, imports bank CSV exports, and prints monthly reports.\n\nThis is your first *multi-file* program. A reference solution lives in\nthe `projects/solutions/` folder of the course repo. Look at the\nstructure if you're stuck on organisation, but write your own code.\n\n---\n\n## What it should do\n\n```bash\npython tracker.py add 12.50 food \"Lunch with Sam\"\npython tracker.py add 1200 rent \"November rent\" --date 2026-11-01\npython tracker.py list\npython tracker.py list --month 2026-11 --category food\npython tracker.py summary --month 2026-11\npython tracker.py import bank_export.csv\npython tracker.py export november.csv --month 2026-11\npython tracker.py budget food 300        # set a monthly budget for a category\n```\n\nExample `summary` output:\n\n```\nNovember 2026\n────────────────────────────────────\nrent          $1,200.00\nfood            $412.30   ⚠ over budget ($300.00)\ntransport        $65.00\nfun             $134.00\n────────────────────────────────────\nTotal         $1,811.30\nBiggest expense: November rent ($1,200.00)\n```\n\n---\n\n## Suggested structure\n\n```\nexpense_tracker/\n    tracker.py            # command-line interface only (argparse, printing)\n    expenses/\n        __init__.py\n        models.py         # Expense dataclass\n        storage.py        # load/save JSON, import/export CSV\n        reports.py        # pure functions: filter, totals, summaries\n    tests/\n        test_reports.py\n        test_storage.py\n```\n\n**The key design rule:** `reports.py` and `models.py` never call `print()` or\n`input()`. They take data in and return data out. Only `tracker.py` talks to\nthe user. This keeps the logic testable (Module 13).\n\n---\n\n## Milestones\n\nBuild it in this order, getting each step working before the next.\n\n1. **Model.** An `Expense` dataclass: `amount`, `category`, `description`, `date`\n   (store dates as `\"YYYY-MM-DD\"` strings for easy JSON and sorting).\n2. **Storage.** `load_expenses(path)` / `save_expenses(path, expenses)` using\n   JSON. A missing file means \"no expenses yet\", not a crash.\n3. **`add` and `list` commands** with `argparse` subcommands.\n4. **Reports.** `filter_expenses(expenses, month=None, category=None)`,\n   `totals_by_category(expenses)`, `biggest(expenses)`. Write tests for these\n   *first* (TDD) or *straight after*.\n5. **`summary` command** with nicely aligned output.\n6. **CSV import/export.** Real bank exports have different column names; map\n   them (e.g. `\"Transaction Amount\"` → `amount`). Skip and report rows that\n   can't be parsed instead of crashing.\n7. **Budgets.** Store per-category monthly limits in the same JSON file and\n   flag overspending in the summary.\n\n### Level up\n- `delete` / `edit` commands (give each expense an `id`).\n- Auto-categorise imported rows by keyword (\"TESCO\" → food).\n- A bar chart in the terminal using `\"█\" * int(amount / scale)`.\n- Install `rich` and print a coloured table.\n- Recurring expenses (rent every month).\n\n---\n\n## Skills checklist\n- [ ] Multiple modules in a package, imported from a main script\n- [ ] A dataclass\n- [ ] JSON persistence with graceful handling of a missing file\n- [ ] CSV reading and writing with `csv.DictReader` / `DictWriter`\n- [ ] `argparse` with subcommands\n- [ ] Input validation with helpful error messages\n- [ ] At least 8 pytest tests, all passing\n"}, {"n": "3", "track": "python", "title": "Capstone: Build Your Own Tool", "md": "# Capstone: Build Your Own Tool\n\n**After:** Module 15 · **Time:** 15–25 hours (2–3 weeks)\n\nThis is where you prove to yourself that you can program. You'll design and\nbuild something real from scratch, for **your** track, and finish it properly:\nwith tests, a README, and code you'd be happy to show someone.\n\n---\n\n## The rules\n\nYour project must include:\n\n- [ ] **At least 3 modules** (files), organised as a package\n- [ ] **At least one class or dataclass** that earns its place\n- [ ] **Reading and/or writing files** (CSV, JSON, text) *or* calling a web API\n- [ ] **Error handling**: bad input or a failed request shouldn't crash it\n- [ ] **A command-line interface** (`argparse`) or an interactive menu\n- [ ] **At least 10 pytest tests**, all passing\n- [ ] **Type hints** on your function signatures\n- [ ] **A `README.md`** explaining what it does, how to install it, and how to run it\n- [ ] **A `requirements.txt`** if you use third-party packages\n- [ ] Use at least one Module 15 tool (a generator, decorator, or context manager) where it genuinely helps\n\n---\n\n## Pick a project from your track\n\n### 🛠 Automation / productivity\n- **Downloads folder organiser**: sort files into folders by type/date, with a\n  `--dry-run` mode, an undo log (JSON), and a config file for custom rules.\n- **Spreadsheet cleaner**: take a messy CSV export (inconsistent dates, stray\n  spaces, duplicates, mixed-case names) and produce a clean file plus a report\n  of what changed. Stretch: read/write `.xlsx` with `openpyxl`.\n- **Report generator**: combine several CSVs into a weekly summary, written\n  out as a Markdown or HTML file you could email.\n- **Bulk file renamer**: preview-then-apply renames using patterns\n  (`IMG_2041.jpg` → `2026-11-06_holiday_001.jpg`).\n\n### 📊 Data & analysis\n- **Personal finance analyser**: extend Project 2 with trends over months,\n  averages, the \"where did my money go\" top 10, and charts with `matplotlib`.\n- **Habit / fitness tracker**: log entries, compute streaks and weekly\n  averages, chart progress.\n- **Dataset explorer**: download a public dataset (e.g. from data.gov or Kaggle),\n  then write a tool that answers 5 interesting questions about it.\n\n### 🌐 Web & APIs\n- **Weather dashboard**: use Open-Meteo (no key needed) to show the\n  forecast for saved cities, cache responses to disk, and warn about rain.\n- **Price / stock watcher**: track values over time in a JSON or SQLite file\n  and alert when they cross a threshold.\n- **GitHub stats tool**: summarise a user's or organisation's repositories:\n  languages, stars, recent activity.\n- **News digest**: pull headlines from an RSS feed or API, de-duplicate, and\n  write a daily digest file.\n\n### 🎮 Games & creative\n- **Text adventure engine**: rooms, items and puzzles loaded from a JSON file,\n  so the *game* is data and the *engine* is code. Save/load games.\n- **Card game** (blackjack, war...) with classes for `Card`, `Deck`, `Hand`,\n  `Player`, plus a simple computer opponent.\n- **Life simulation**: Conway's Game of Life or a predator/prey simulation in\n  the terminal, with patterns loaded from files.\n- **Quiz app**: questions from a JSON/CSV file, scoring, high-score table,\n  spaced repetition for questions you got wrong.\n\nGot your own idea? Even better. Use it, as long as it meets the rules above.\nThe best projects solve a problem you actually have.\n\n---\n\n## How to approach it\n\n1. **Write a one-paragraph description** of what it does and who it's for.\n2. **List the features**, then cut it down to a minimum version you could build\n   in a weekend. Everything else goes on a \"later\" list.\n3. **Sketch the structure**: which modules, which classes, which functions?\n   Data in, data out. Keep printing in one place.\n4. **Build the smallest end-to-end slice first.** For example, the organiser\n   moves *one* file type correctly before you handle all of them.\n5. **Write tests as you go**, not at the end.\n6. **Commit to git regularly** (see below).\n7. **Polish**: README, help text, error messages, remove dead code.\n8. **Show someone.** Explaining your code is the final test of understanding it.\n\n### Use git\n```bash\ngit init\ngit add .\ngit commit -m \"First working version\"\n```\nCommit every time something works. It's an unlimited undo button, and a\nGitHub profile with real projects is worth more than any certificate.\n\n---\n\n## Self-review checklist\n\nBefore you call it done, read your code as if someone else wrote it:\n\n- [ ] Could a stranger run it using only the README?\n- [ ] Are names clear? Would you know what `process(d)` does in six months?\n- [ ] Is any function over ~30 lines? Can it be split?\n- [ ] Is anything copy-pasted 3+ times? Make it a function.\n- [ ] Does bad input give a helpful message instead of a traceback?\n- [ ] Do all the tests pass? Do they test the boundaries?\n\n---\n\n## 🎓 After the capstone\n\nYou're an intermediate Python programmer. Where next depends on your track:\n\n| Track | Next things to learn |\n|-------|----------------------|\n| Automation | `openpyxl`, `pandas`, `playwright` (browser automation), scheduling with cron / Task Scheduler |\n| Data | `pandas`, `matplotlib`/`seaborn`, Jupyter notebooks, SQL basics, `polars` |\n| Web | `FastAPI` or `Flask`, `SQLAlchemy`, HTML basics, deploying to a cloud host |\n| Games | `pygame`, `arcade`, basic vector maths |\n| Everyone | `git` & GitHub, SQL, reading open-source code, contributing a small fix to a project you use |\n\nKeep building. The fastest way to improve now is one small project every couple of weeks.\n"}, {"n": "ai", "track": "ai", "title": "AI Track Capstone: Customer-Feedback Insights Pipeline", "md": "# AI Track Capstone: Customer-Feedback Insights Pipeline\n\n**After:** Module A11 · **Time:** 15–25 hours over 2–4 weeks\n\nBuild the project that proves you can take AI from idea to measured business\nvalue: an AI pipeline that turns thousands of free-text comments into\ndecisions, evaluated properly and presented like an AI ambassador would.\n\nIt doubles as your strongest portfolio piece (Module A12) and as a template\nyou can reuse at work.\n\n---\n\n## The scenario\n\nYour organisation collects customer feedback (surveys, reviews, support\ntickets) but only reads a sample. Leadership wants to know **what customers\ncomplain about most, how that's changing, and what to fix first.**\n\n**Data:** use a public dataset of product reviews or support tickets, or\ngenerate a realistic synthetic set. If you use work data, follow your\ncompany's rules (A03) and anonymise it first.\n\n---\n\n## Deliverables\n\n### 1. Label design (A08)\n- [ ] Ask AI to propose themes from a random sample of ~200 comments\n- [ ] Finalise 5–10 labels with one-line definitions, one example each, and \"other\"\n- [ ] Note who would own each label in a real business\n\n### 2. Gold set (A08)\n- [ ] Hand-label 100–200 randomly sampled comments\n- [ ] Record your labelling rules for tricky cases\n\n### 3. Baseline (A08)\n- [ ] Keyword-rules classifier; measure accuracy, precision and recall on the gold set\n\n### 4. AI classifier (A07)\n- [ ] Prompt with label definitions and examples; JSON output with an enum of labels\n- [ ] Row loop with failure isolation, validation, retries and progress saving\n- [ ] Cost estimate before the full run, and actual cost after\n- [ ] Measure on the gold set; compare with the baseline; iterate at least twice on the prompt\n- [ ] Optional: compare two models on accuracy *and* cost\n\n### 5. Pipeline (A05–A06)\nPick one and justify your choice:\n- [ ] **Alteryx-first:** input → clean → Python tool (API call) → summarise → output\n- [ ] **Python-first:** a pandas script or notebook, with an Alteryx workflow for the\n      downstream reporting\n\nPrint or log row counts at every step and reconcile them.\n\n### 6. Insights (A04)\n- [ ] Label distribution overall, by month and by one segment\n- [ ] Top themes with three real example quotes each (selected by code)\n- [ ] AI-drafted executive summary from your computed tables, edited by you,\n      with no number that isn't in the tables\n\n### 7. Governance note (A03)\n- [ ] One page: data used, data classes, minimisation steps, approved tools,\n      verification, human review, known limitations\n\n### 8. Ambassador pack (A11)\n- [ ] Value estimate: hours saved and coverage gained (from sample to 100%), with assumptions\n- [ ] A 5-slide (or one-page) leadership update: headline, evidence, risks and controls, next step, ask\n- [ ] A 15-minute demo script for your team\n\n---\n\n## Stretch goals\n\n- **RAG add-on (A09):** let users ask questions of the comments (\"What do customers\n  say about the mobile app?\") with cited examples.\n- **Agent add-on (A10):** a read-only agent that answers trend questions by\n  calling your summary functions, with every tool call logged.\n- **Monitoring:** compare each month's label distribution with the last and flag big shifts.\n- **Segment fairness:** check accuracy by language, region or customer type.\n\n---\n\n## Self-review checklist\n\n- [ ] Could a colleague rerun it from your README?\n- [ ] Is every number traceable to code, not to AI prose?\n- [ ] Did you report accuracy on the gold set honestly, including where it fails?\n- [ ] Would your governance note satisfy your privacy or risk team?\n- [ ] Does the leadership update lead with a business outcome, not a model name?\n\nWhen you're done, add it to your portfolio with a short write-up: problem,\napproach, evaluation, result, next steps. Then present it to your team.\nThat's what an AI ambassador does.\n"}], "cheatsheet": "# Python Cheatsheet\n\nEverything from the course on one page. Keep it open while you work.\n\n## Basics\n```python\nx = 5   ...    # no error\nfinally: ...  # always\nraise ValueError(\"why\")\n```\n\n## Files\n```python\nfrom pathlib import Path\np = Path(__file__).parent / \"data\" / \"file.txt\"\np.read_text(encoding=\"utf-8\");  p.write_text(s, encoding=\"utf-8\")\nwith open(p, \"a\", encoding=\"utf-8\") as f: f.write(\"line\\n\")\nfor f in Path(\".\").glob(\"*.csv\"): ...\n\nimport csv\nwith open(p, newline=\"\", encoding=\"utf-8\") as f:\n    for row in csv.DictReader(f): ...\n\nimport json\njson.dump(obj, f, indent=2);  obj = json.load(f)\n```\n\n## Classes\n```python\nfrom dataclasses import dataclass, field\n\n@dataclass\nclass Item:\n    name: str\n    price: float = 0.0\n    tags: list = field(default_factory=list)\n\nclass Account:\n    def __init__(self, owner):\n        self.owner = owner\n    def __str__(self):\n        return self.owner\n    @property\n    def label(self): ...\n```\n\n## Power tools\n```python\ndef gen():  yield 1              # generator\n@functools.wraps(func)           # inside decorators\n@contextmanager                  # with-able function\ndef cm():\n    setup(); \n    try: yield\n    finally: cleanup()\n```\n\n## Environment & packages\n```bash\npython -m venv .venv\nsource .venv/bin/activate        # Windows: .venv\\Scripts\\activate\npip install requests pytest\npip freeze > requirements.txt\npytest -v\n```\n\n## Reading a traceback\n**Bottom line first** → that's *what* went wrong. The line above it → *where*.\n", "parts": [["Part 1 · Foundations", ["00", "01", "02", "03", "04", "05", "06"], "python"], ["Part 2 · Real programs", ["07", "08", "09", "10"], "python"], ["Part 3 · Intermediate", ["11", "12", "13", "14", "15"], "python"], ["Part 1 · AI foundations", ["A00", "A01", "A02", "A03"], "ai"], ["Part 2 · AI + Python for analytics", ["A04", "A05", "A06", "A07", "A08", "A09"], "ai"], ["Part 3 · Super user & ambassador", ["A10", "A11", "A12"], "ai"]], "tracks": [{"id": "python", "name": "Python", "long": "Python: zero to intermediate"}, {"id" (() => {

const MODS = C.modules;

const trackOf = id => (byId[id] && byId[id].track) || "python";
const modsIn = track => MODS.filter(m => m.track === track);
const partsIn = track => C.parts.filter(p => (p[2] || "python") === track);
function savedTrack() { try { return localStorage.getItem("python-foundry-track") || "python"; } catch (_) { return "python"; } }
function setTrack(t) { ui.track = t; try { localStorage.setItem("python-foundry-track", t); } catch (_) {} }
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const DAY = 86400000;
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / DAY);

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);

}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inlineMd = s => String(s).split(/(`[^`]+`)/).map(part => part.startsWith("`") && part.endsWith("`") && part.length > 1
  ? "<code>" + esc(part.slice(1, -1)) + "</code>"

const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const defaultState = () => ({

const Store = {
  key: "python-foundry-v1",
  state: defaultState(),
  doc: null, timer: null, writing: false, dirty: false,
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) this.state = Object.assign(defaultState(), JSON.parse(raw));

  },
  save() {
    this.state.updatedAt = Date.now();

  mod(id) {
    return (this.state.mods[id] ||= { pre: {}, step: 0, seen: 0, lessonDone: false, parsonsDone: false,
      exPassed: 0, exTotal: 0, exRuns: 0, quizBest: null, quizDone: false, reflectDone: false, preDone: false });
  },
  studied() {
    const d = today();
    if (!this.state.days.includes(d)) { this.state.days.push(d); this.state.days = this.state.days.slice(-180); }
  },
  async connect() {
    const use = window.claude && window.claude.use;
    if (!use) return false;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return true;
      const id = await user.id();
      if (!id) return true;
      this.doc = db.doc("data/users/" + id + "/progress");
      const snap = await Promise.race([this.doc.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
      if (snap.exists) {
        const body = snap.data();
        const remote = JSON.parse(body.state || "{}");
        if ((remote.updatedAt || 0) > (this.state.updatedAt || 0)) {
          this.state = Object.assign(defaultState(), remote);
          try { localStorage.setItem(this.key, JSON.stringify(this.state)); } catch (_) {}
          render();
          toast("Your saved progress is loaded");
        } else if (this.state.updatedAt) this.queueCloud();
      } else if (this.state.updatedAt) this.queueCloud();
    } catch (_) { this.doc = null; }
    return true;
  },
  queueCloud() {
    if (!this.doc) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), 2500);
  },
  async push(retried) {
    if (this.writing) { this.dirty = true; return; }
    this.writing = true;
    try {
      await this.doc.set({ state: JSON.stringify(this.state), updatedAt: this.state.updatedAt });
    } catch (e) {
      if (e && e.code === "unavailable" && !retried) setTimeout(() => this.push(true), 1500 + Math.random() * 1500);
      else if (e && e.code === "quota_exceeded") toast("Cloud save is full. Your progress is still saved in this browser.");
    } finally {
      this.writing = false;
      if (this.dirty) { this.dirty = false; this.queueCloud(); }
    }
  },
};

/* =====================================================================
   Spaced repetition
   ===================================================================== */
const INTERVALS = [0, 1, 3, 7, 16, 35, 90, 180];
function itemFor(id) {
  // ids: c-01-3 (card) or q-01-2 (quiz)
  const [kind, mid, idx] = id.split("-");
  const m = byId[mid]; if (!m || !m.learn) return null;
  if (kind === "c") { const c = m.learn.cards[+idx]; return c && { id, kind: "card", mid, front: c[0], back: c[1] }; }
  const q = m.learn.quiz[+idx]; return q && { id, kind: "quiz", mid, q };
}
function addToDeck(id, box = 0) {
  const s = Store.state.srs;
  if (s[id]) return false;
  s[id] = { box, due: today() + (box ? INTERVALS[box] : 1), last: today(), reps: 0, lapses: 0 };
  return true;
}
function grade(id, g) { // 0 again, 1 hard, 2 good, 3 easy
  const s = Store.state.srs[id] ||= { box: 0, due: today(), last: today(), reps: 0, lapses: 0 };
  if (g === 0) { s.box = 1; s.lapses++; s.due = today() + 1; }
  else if (g === 1) { s.box = Math.max(1, s.box); s.due = today() + Math.max(1, Math.round(INTERVALS[s.box] / 2)); }
  else { s.box = Math.min(INTERVALS.length - 1, s.box + (g === 3 ? 2 : 1)); s.due = today() + INTERVALS[s.box]; }
  s.last = today(); s.reps++;
}
function nextIntervalLabel(id, g) {
  const s = Store.state.srs[id] || { box: 0 };
  let days;
  if (g === 0) days = 1;
  else if (g === 1) days = Math.max(1, Math.round(INTERVALS[Math.max(1, s.box)] / 2));
  else days = INTERVALS[Math.min(INTERVALS.length - 1, s.box + (g === 3 ? 2 : 1))];
  return days === 1 ? "tomorrow" : `${days} days`;
}
const dueIds = () => Object.entries(Store.state.srs).filter(([id, s]) => s.due <= today() && itemFor(id)).map(([id]) => id);
function retention(s) {
  const stability = Math.max(1, INTERVALS[s.box] || 1) * 1.6;
  return Math.exp(-(today() - s.last) / stability);
}
function memoryStrength(mid) {
  const items = Object.entries(Store.state.srs).filter(([id]) => id.split("-")[1] === mid);
  if (!items.length) return null;
  return items.reduce((a, [, s]) => a + retention(s), 0) / items.length;
}
function interleave(ids) {
  // round-robin across modules so consecutive items come from different topics
  const groups = {};
  shuffle(ids).forEach(id => (groups[id.split("-")[1]] ||= []).push(id));
  const lists = shuffle(Object.values(groups)); const out = [];
  while (lists.some(l => l.length)) lists.forEach(l => l.length && out.push(l.shift()));
  return out;
}

}

function viewDoc(md, eyebrow) {
  return [h("div", { class: "eyebrow" }, eyebrow), h("section", { class: "panel" }, renderMd(md, { runnable: false }))];
}

/* =====================================================================
   Sidebar, router, boot
   ===================================================================== */
function trackSwitch() {
  return h("div", { class: "track-switch", role: "tablist", "aria-label": "Learning track" },
    ...TRACKS.map(t => h("button", {
      type: "button", role: "tab", "aria-selected": String(ui.track === t.id), class: ui.track === t.id ? "on" : "",
      onclick: () => { setTrack(t.id); const r = location.hash.slice(1); if (r.startsWith("m-") || r.startsWith("project-")) location.hash = "home"; else render(); },
    }, t.id === "ai" ? "AI for business" : "Python")));
}

function renderSidebar() {
  const nav = $("#nav"); nav.innerHTML = "";
  const cur = location.hash.slice(1) || "home";
  nav.append(trackSwitch());
  const link = (href, label, extra) => h("a", { class: "nav-link" + (cur === href ? " active" : ""), href: "#" + href }, h("span", { class: "ntitle" }, label), extra || null);
  const due = dueIds().length;
  nav.append(link("home", "Dashboard"), link("review", "Review", due ? h("span", { class: "nav-badge num" }, due) : null), link("play", "Playground"));
  partsIn(ui.track).forEach(([name, ids]) => {
    nav.append(h("div", { class: "nav-group" }, name));
    ids.forEach(id => nav.append(h("a", { class: "nav-link" + (cur === "m-" + id ? " active" : ""), href: "#m-" + id },
      h("span", { class: "nid" }, id), h("span", { class: "ntitle" }, byId[id].title), ring(modProgress(byId[id]), 18))));
  });
  nav.append(h("div", { class: "nav-group" }, "Projects"));
  C.projects.filter(p => (p.track || "python") === ui.track).forEach(p => nav.append(link("project-" + p.n,
    p.title.replace(/^AI Track Capstone:\s*/, "Capstone: ").replace(/^(Checkpoint Project \d|Capstone):\s*/, (m0) => m0.startsWith("Cap") ? "Capstone: " : `${p.n}. `))));
  nav.append(h("div", { class: "nav-group" }, "Reference"), link("cheatsheet", "Cheatsheet"), link("notebook", "My notebook"), link("science", "How it's designed"));
}

function render() {
  const route = location.hash.slice(1) || "home";
  if (route.startsWith("m-") && byId[route.slice(2)] && trackOf(route.slice(2)) !== ui.track) setTrack(trackOf(route.slice(2)));
  if (route.startsWith("project-")) { const pj = C.projects.find(x => "project-" + x.n === route); if (pj && (pj.track || "python") !== ui.track) setTrack(pj.track || "python"); }
  liveEditors = [];
  const view = $("#view"); view.innerHTML = "";
  let nodes, crumb;
  if (route.startsWith("m-") && byId[route.slice(2)]) { const m = byId[route.slice(2)]; nodes = viewModule(m.id); crumb = `<b>Module ${m.id}</b> · ${esc(m.title)}`; }
  else if (route === "review") { nodes = viewReview(); crumb = "<b>Review</b>"; }
  else if (route === "play") { nodes = viewPlay(); crumb = "<b>Playground</b>"; }
  else if (route === "notebook") { nodes = viewNotebook(); crumb = "<b>Notebook</b>"; }
  else if (route === "science") { nodes = viewScience(); crumb = "<b>How it's designed</b>"; }
  else if (route === "cheatsheet") { nodes = viewDoc(C.cheatsheet, "Reference"); crumb = "<b>Cheatsheet</b>"; }
  else if (route.startsWith("project-")) { const p = C.projects.find(x => "project-" + x.n === route); nodes = p ? viewDoc(p.md, "Project") : viewHome(); crumb = p ? `<b>${esc(p.title)}</b>` : ""; }
  else { nodes = viewHome(); crumb = "<b>Dashboard</b>"; }
  view.append(...nodes);
  $("#crumb").innerHTML = crumb;
  renderSidebar();
  requestAnimationFrame(() => { liveEditors.forEach(cm => cm.refresh()); applyHighlight(); });
  if (route !== "home" && Engine.status === "idle" && !Engine.starting) setTimeout(() => Engine.start().catch(() => {}), 800);
}

function applyTheme() {
  let t = null; try { t = localStorage.getItem("python-foundry-theme"); } catch (_) {}
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  $("#themeBtn").textContent = "Theme: " + (t || "system");
}

function boot() {
  Store.load();
  applyTheme();
  $("#predictToggle").checked = Store.state.predict;
  $("#predictToggle").addEventListener("change", e => { Store.state.predict = e.target.checked; Store.save(); toast(e.target.checked ? "You'll predict output before running examples" : "Examples run straight away"); });
  $("#themeBtn").addEventListener("click", () => {
    let t = null; try { t = localStorage.getItem("python-foundry-theme"); } catch (_) {}
    const next = { null: "light", light: "dark", dark: null }[t];
    try { next ? localStorage.setItem("python-foundry-theme", next) : localStorage.removeItem("python-foundry-theme"); } catch (_) {}
    if (next) document.documentElement.setAttribute("data-theme", next); else document.documentElement.removeAttribute("data-theme");
    $("#themeBtn").textContent = "Theme: " + (next || "system");
    liveEditors.forEach(cm => cm.refresh());
  });
  $("#menuBtn").addEventListener("click", () => $("#sidebar").classList.toggle("open"));
  $("#nav").addEventListener("click", e => { if (e.target.closest("a")) $("#sidebar").classList.remove("open"); });
  $("#searchOpen").addEventListener("click", () => Search.open());
  $("#searchClose").addEventListener("click", () => Search.close());
  $("#searchLayer").addEventListener("click", e => { if (e.target.id === "searchLayer") Search.close(); });
  let st; $("#searchInput").addEventListener("input", () => { clearTimeout(st); st = setTimeout(() => Search.draw(), 80); });
  $("#searchInput").addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); Search.move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); Search.move(-1); }
    else if (e.key === "Enter") { e.preventDefault(); Search.go(Search.sel); }
    else if (e.key === "Escape") Search.close();
  });
  document.addEventListener("keydown", e => {
    const typing = e.target.closest("input, textarea, .CodeMirror, [contenteditable]");
    if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !typing)) { e.preventDefault(); Search.open(); return; }
    if (e.key === "Escape" && !$("#searchLayer").hidden) Search.close();
    if (e.key === " " && !typing) { const r = $("#view .flash button.btn.primary"); if (r && r.textContent.startsWith("Reveal")) { e.preventDefault(); r.click(); } }
  });
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
  render();
  // Sync with private cloud storage when available (claude.ai, signed in)
  Store.connect().then(found => { if (!found) setTimeout(() => Store.connect(), 1500); });
}

boot();
})();

</script>

</body>
</html>
