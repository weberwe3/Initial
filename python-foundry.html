oal": "look things up by name, count things, and remove duplicates.", "time": "3–4 hours.", "intro": "", "sections": [{"title": "Dictionaries: labelled values", "md": "A list finds things by **position**. A dictionary (`dict`) finds things by\n**key**, like a real dictionary where you look up a word to get its meaning.\n\n```python\nperson = {\n    \"name\": \"Ada\",\n    \"age\": 36,\n    \"city\": \"London\",\n}\n\nperson[\"name\"]          # 'Ada'\nperson[\"age\"] = 37      # change a value\nperson[\"email\"] = \"ada@example.com\"   # add a new key\ndel person[\"city\"]      # remove a key\nlen(person)             # 3\n\"name\" in person        # True  (checks KEYS)\n```\n\nKeys are usually strings (they can be numbers or tuples too) and must be\nunique. Values can be anything, including lists or other dicts."}, {"title": "Safe lookups with `.get()`", "md": "```python\nperson[\"phone\"]              # KeyError! crashes if the key isn't there\nperson.get(\"phone\")          # None, no crash\nperson.get(\"phone\", \"n/a\")   # 'n/a', your chosen default\n```"}, {"title": "Looping over a dictionary", "md": "```python\nprices = {\"apple\": 0.5, \"bread\": 2.25, \"milk\": 1.10}\n\nfor item in prices:                  # loops over KEYS\n    print(item)\n\nfor price in prices.values():        # just the values\n    print(price)\n\nfor item, price in prices.items():   # both: the one you'll use most\n    print(f\"{item}: ${price:.2f}\")\n```\n\nDictionaries remember the order you inserted keys."}, {"title": "The counting pattern ⭐", "md": "Counting how often things appear is one of the most common tasks in programming:\n\n```python\nwords = \"the cat and the hat and the bat\".split()\ncounts = {}\nfor word in words:\n    counts[word] = counts.get(word, 0) + 1\nprint(counts)\n# {'the': 3, 'cat': 1, 'and': 2, 'hat': 1, 'bat': 1}\n```\n\nRead the key line as: \"look up the current count (or 0 if new), add one,\nstore it back.\""}, {"title": "The grouping pattern ⭐", "md": "```python\ntransactions = [(\"food\", 12.5), (\"rent\", 1200), (\"food\", 30), (\"fun\", 25)]\nby_category = {}\nfor category, amount in transactions:\n    if category not in by_category:\n        by_category[category] = []\n    by_category[category].append(amount)\n# {'food': [12.5, 30], 'rent': [1200], 'fun': [25]}\n```\n\nOr totals instead of lists:\n\n```python\ntotals = {}\nfor category, amount in transactions:\n    totals[category] = totals.get(category, 0) + amount\n```"}, {"title": "Lists of dictionaries: how real data looks", "md": "Data from spreadsheets, databases, and web APIs almost always arrives as a\nlist of dicts, one dict per row/record:\n\n```python\npeople = [\n    {\"name\": \"Ada\", \"dept\": \"Engineering\", \"salary\": 95000},\n    {\"name\": \"Grace\", \"dept\": \"Engineering\", \"salary\": 105000},\n    {\"name\": \"Linus\", \"dept\": \"Support\", \"salary\": 60000},\n]\n\nfor p in people:\n    print(f\"{p['name']} works in {p['dept']}\")\n\n# total salary per department\ndept_totals = {}\nfor p in people:\n    dept_totals[p[\"dept\"]] = dept_totals.get(p[\"dept\"], 0) + p[\"salary\"]\n```\n\n> Note: inside an f-string with double quotes, use single quotes for keys:\n> `f\"{p['name']}\"`."}, {"title": "Sets: unique values, fast membership", "md": "A set is an unordered collection with **no duplicates**:\n\n```python\ntags = {\"python\", \"beginner\", \"python\"}\nprint(tags)              # {'python', 'beginner'}  (order may vary)\ntags.add(\"tutorial\")\ntags.discard(\"beginner\")\n\"python\" in tags         # True, and very fast even for huge sets\n\nunique = set([3, 1, 3, 2, 1])   # {1, 2, 3}\nempty = set()                    # NOT {} (that's an empty dict)\n```\n\n### Set maths\n```python\nmine = {\"python\", \"sql\", \"excel\"}\njob = {\"python\", \"sql\", \"aws\"}\n\nmine & job    # {'python', 'sql'}           in both (intersection)\nmine | job    # all four skills             in either (union)\njob - mine    # {'aws'}                     in job but not mine (difference)\n```"}, {"title": "Which collection should I use?", "md": "| Need | Use |\n|------|-----|\n| Ordered items, may change | `list` |\n| Fixed group of related values | `tuple` |\n| Look up a value by a name/ID | `dict` |\n| Unique items / \"have I seen this?\" | `set` |"}, {"title": "Key takeaways", "md": "`dict` maps keys → values. Use `.get(key, default)` for safe lookups.\n- Loop with `.items()` to get keys and values together.\n- Counting: `counts[k] = counts.get(k, 0) + 1`.\n- Real data is usually a **list of dicts**.\n- `set` removes duplicates and answers \"is X in here?\" fast.\n\n**Continue reading:** [Dictionaries in Python](https://realpython.com/python-dicts/) (Real Python). A deep dive into creating, querying and transforming dictionaries.\n\n> **Checkpoint:** you've finished Part 1. Do\n[Project 1](#project-1) before moving on."}], "learn": {"big_idea": "Dicts look things up by key; sets hold unique items. Counting: counts[k] = counts.get(k, 0) + 1.", "pretest": [0, 3], "quiz": [{"type": "output", "q": "What does this print?", "code": "counts = {}\nfor w in \"a b a\".split():\n    counts[w] = counts.get(w, 0) + 1\nprint(counts)", "answer": "{'a': 2, 'b': 1}", "why": "The counting pattern: look up the current count (0 if new), add 1, store it back."}, {"q": "`d = {\"a\": 1}`. What happens with `d[\"z\"]`?", "options": ["KeyError", "Returns None", "Returns 0", "Adds z"], "answer": 0, "why": "Square brackets crash on a missing key. d.get(\"z\") returns None instead."}, {"type": "output", "q": "What does this print?", "code": "print(len({3, 1, 3, 2, 1}))", "answer": "3", "why": "Sets keep only unique values: {1, 2, 3}."}, {"q": "Which method gives you keys and values together in a loop?", "options": [".items()", ".keys()", ".values()", ".get()"], "answer": 0, "why": "`for k, v in d.items():`"}, {"type": "output", "q": "What does this print?", "code": "mine = {\"python\", \"sql\"}\njob = {\"python\", \"aws\"}\nprint(job - mine)", "answer": "{'aws'}", "why": "Set difference: in job but not in mine."}, {"q": "How do you create an EMPTY set?", "options": ["set()", "{}", "[]", "()"], "answer": 0, "why": "{} is an empty dict, not a set."}], "cards": [["Safe dict lookup with a default?", "`d.get(key, default)`"], ["The counting pattern?", "`counts[k] = counts.get(k, 0) + 1`"], ["What shape does real-world data (APIs, spreadsheets) usually have?", "A list of dicts, one dict per record."], ["Set operators for both / either / only-left?", "`a & b`, `a | b`, `a - b`"], ["When to use a set?", "For unique items, or fast 'have I seen this?' checks."], ["What does `\"name\" in person` check for a dict?", "Whether \"name\" is a KEY."]], "parsons": {"prompt": "Total the amounts spent in each category.", "lines": ["spending = [(\"food\", 12), (\"rent\", 900), (\"food\", 30)]", "totals = {}", "for category, amount in spending:", "    totals[category] = totals.get(category, 0) + amount", "print(totals)"]}, "explain": "When would you choose a dict over a list? Give one example of each from your own life."}, "read": {"title": "Dictionaries in Python", "url": "https://realpython.com/python-dicts/", "source": "Real Python", "why": "A deep dive into creating, querying and transforming dictionaries."}, "exercise": {"code": "\"\"\"\nModule 06 exercises: Dictionaries & sets.   Run:  python check.py 6\n\"\"\"\n\n\ndef word_counts(text):\n    # TODO: return a dict of how many times each word appears. Ignore case.\n    # word_counts(\"The cat the\") -> {\"the\": 2, \"cat\": 1}\n    raise NotImplementedError\n\n\ndef most_common_word(text):\n    # TODO: return the word that appears most often (ignore case).\n    # If there's a tie, return whichever reached that count first in the text.\n    raise NotImplementedError\n\n\ndef totals_by_category(transactions):\n    # TODO: transactions is a list of (category, amount) tuples.\n    # Return a dict of category -> total amount.\n    raise NotImplementedError\n\n\ndef invert(d):\n    # TODO: swap keys and values.  invert({\"a\": 1, \"b\": 2}) -> {1: \"a\", 2: \"b\"}\n    raise NotImplementedError\n\n\ndef lookup_price(prices, item):\n    # TODO: return the price of `item`, or 0 if it isn't in the prices dict.\n    raise NotImplementedError\n\n\ndef cart_total(prices, cart):\n    # TODO: prices is {item: price}; cart is {item: quantity}.\n    # Return the total cost, rounded to 2 decimals. Ignore items with no price.\n    raise NotImplementedError\n\n\ndef names_in_dept(people, dept):\n    # TODO: people is a list of dicts with \"name\" and \"dept\" keys.\n    # Return a list of names in the given department, in original order.\n    raise NotImplementedError\n\n\ndef average_salary_by_dept(people):\n    # TODO: people have \"dept\" and \"salary\" keys.\n    # Return {dept: average salary}.\n    raise NotImplementedError\n\n\ndef unique_count(items):\n    # TODO: return how many DIFFERENT items there are.  unique_count([1,1,2]) -> 2\n    raise NotImplementedError\n\n\ndef missing_skills(my_skills, job_skills):\n    # TODO: both are lists. Return a SORTED list of skills the job needs that\n    # you don't have.\n    raise NotImplementedError\n\n\ndef group_by_first_letter(words):\n    # TODO: return {letter: [words starting with it]} (lowercase letters,\n    # words kept in original order).\n    # group_by_first_letter([\"apple\", \"Avocado\", \"banana\"])\n    #   -> {\"a\": [\"apple\", \"Avocado\"], \"b\": [\"banana\"]}\n    raise NotImplementedError\n", "tests": "PEOPLE = [\n    {\"name\": \"Ada\", \"dept\": \"Eng\", \"salary\": 90000},\n    {\"name\": \"Grace\", \"dept\": \"Eng\", \"salary\": 110000},\n    {\"name\": \"Linus\", \"dept\": \"Support\", \"salary\": 60000},\n]\n\n\ndef test_word_counts(ex):\n    assert ex.word_counts(\"The cat the\") == {\"the\": 2, \"cat\": 1}\n    assert ex.word_counts(\"\") == {}\n\n\ndef test_most_common_word(ex):\n    assert ex.most_common_word(\"the cat and the hat\") == \"the\"\n    assert ex.most_common_word(\"b a a b\") == \"a\", \"on a tie, the word that reached the top count first wins ('a' hits 2 before 'b' does)\"\n\n\ndef test_totals_by_category(ex):\n    got = ex.totals_by_category([(\"food\", 12.5), (\"rent\", 1200), (\"food\", 30)])\n    assert got == {\"food\": 42.5, \"rent\": 1200}, f\"got {got!r}\"\n\n\ndef test_invert(ex):\n    assert ex.invert({\"a\": 1, \"b\": 2}) == {1: \"a\", 2: \"b\"}\n\n\ndef test_lookup_price(ex):\n    assert ex.lookup_price({\"milk\": 1.1}, \"milk\") == 1.1\n    assert ex.lookup_price({\"milk\": 1.1}, \"caviar\") == 0\n\n\ndef test_cart_total(ex):\n    prices = {\"apple\": 0.5, \"bread\": 2.25}\n    assert ex.cart_total(prices, {\"apple\": 4, \"bread\": 1}) == 4.25\n    assert ex.cart_total(prices, {\"apple\": 1, \"unicorn\": 3}) == 0.5\n\n\ndef test_names_in_dept(ex):\n    assert ex.names_in_dept(PEOPLE, \"Eng\") == [\"Ada\", \"Grace\"]\n    assert ex.names_in_dept(PEOPLE, \"Sales\") == []\n\n\ndef test_average_salary_by_dept(ex):\n    assert ex.average_salary_by_dept(PEOPLE) == {\"Eng\": 100000, \"Support\": 60000}\n\n\ndef test_unique_count(ex):\n    assert ex.unique_count([1, 1, 2]) == 2\n    assert ex.unique_count([\"a\", \"b\", \"a\", \"c\"]) == 3\n\n\ndef test_missing_skills(ex):\n    got = ex.missing_skills([\"python\", \"excel\"], [\"sql\", \"python\", \"aws\"])\n    assert got == [\"aws\", \"sql\"], f\"got {got!r} (should be sorted)\"\n\n\ndef test_group_by_first_letter(ex):\n    got = ex.group_by_first_letter([\"apple\", \"Avocado\", \"banana\"])\n    assert got == {\"a\": [\"apple\", \"Avocado\"], \"b\": [\"banana\"]}, f\"got {got!r}\"\n", "solution": "\"\"\"Module 06 solutions.\"\"\"\n\n\ndef word_counts(text):\n    counts = {}\n    for word in text.lower().split():\n        counts[word] = counts.get(word, 0) + 1\n    return counts\n\n\ndef most_common_word(text):\n    counts = {}\n    best_word, best_count = None, 0\n    for word in text.lower().split():\n        counts[word] = counts.get(word, 0) + 1\n        if counts[word] > best_count:\n            best_word, best_count = word, counts[word]\n    return best_word\n\n\ndef totals_by_category(transactions):\n    totals = {}\n    for category, amount in transactions:\n        totals[category] = totals.get(category, 0) + amount\n    return totals\n\n\ndef invert(d):\n    result = {}\n    for key, value in d.items():\n        result[value] = key\n    return result\n\n\ndef lookup_price(prices, item):\n    return prices.get(item, 0)\n\n\ndef cart_total(prices, cart):\n    total = 0\n    for item, qty in cart.items():\n        total += prices.get(item, 0) * qty\n    return round(total, 2)\n\n\ndef names_in_dept(people, dept):\n    names = []\n    for p in people:\n        if p[\"dept\"] == dept:\n            names.append(p[\"name\"])\n    return names\n\n\ndef average_salary_by_dept(people):\n    totals, counts = {}, {}\n    for p in people:\n        d = p[\"dept\"]\n        totals[d] = totals.get(d, 0) + p[\"salary\"]\n        counts[d] = counts.get(d, 0) + 1\n    averages = {}\n    for d in totals:\n        averages[d] = totals[d] / counts[d]\n    return averages\n\n\ndef unique_count(items):\n    return len(set(items))\n\n\ndef missing_skills(my_skills, job_skills):\n    return sorted(set(job_skills) - set(my_skills))\n\n\ndef group_by_first_letter(words):\n    groups = {}\n    for w in words:\n        letter = w[0].lower()\n        if letter not in groups:\n            groups[letter] = []\n        groups[letter].append(w)\n    return groups\n"}, "support": {}}, {"id": "07", "slug": "07_functions", "title": "Functions", "goal": "break problems into named, reusable pieces.", "time": "4 hours.", "intro": "You've been *writing* functions in every exercise. Now you'll learn properly\nwhat they are and how to design good ones. This is the single most important\nskill for writing programs bigger than 30 lines.", "sections": [{"title": "Defining and calling", "md": "```python\ndef greet(name):\n    message = f\"Hello, {name}!\"\n    return message\n\nresult = greet(\"Ada\")    # call the function\nprint(result)            # Hello, Ada!\n```\n\n- `def` starts a function definition. `greet` is its name.\n- `name` is a **parameter**, a variable that gets filled in when the function is called.\n- `\"Ada\"` is the **argument**, the actual value passed in.\n- `return` sends a value back to whoever called the function, and **ends the function**.\n\nDefining a function doesn't run it. It only runs when called."}, {"title": "`return` vs `print`", "md": "This confuses almost everyone at first:\n\n```python\ndef add_print(a, b):\n    print(a + b)      # shows it on screen, gives nothing back\n\ndef add_return(a, b):\n    return a + b      # gives the value back to use\n\nx = add_print(2, 3)   # prints 5, but x is None\ny = add_return(2, 3)  # prints nothing, but y is 5\ntotal = add_return(2, 3) * 10   # 50: you can keep using a returned value\n```\n\n**Rule of thumb:** functions that *compute* things should `return`. Keep\n`print` and `input` in a small number of functions that talk to the user.\nThis makes your code testable, which is exactly why every exercise asks for a return.\n\nA function without `return` gives back `None`."}, {"title": "Parameters in depth", "md": "### Default values\n```python\ndef greet(name, greeting=\"Hello\"):\n    return f\"{greeting}, {name}!\"\n\ngreet(\"Ada\")              # Hello, Ada!\ngreet(\"Ada\", \"Welcome\")   # Welcome, Ada!\n```\n\n### Keyword arguments\n```python\ndef make_profile(name, age, city):\n    return f\"{name} ({age}) from {city}\"\n\nmake_profile(age=36, city=\"London\", name=\"Ada\")   # order doesn't matter with names\n```\n\nKeyword arguments make calls readable: `send_email(to=..., subject=..., urgent=True)`\nbeats `send_email(..., ..., True)`.\n\n> ⚠️ Never use a mutable default like `def f(items=[])`: the same list is\n> reused between calls. Use `items=None` then `if items is None: items = []`.\n\n### Any number of arguments\n```python\ndef total(*numbers):         # numbers is a tuple of all positional args\n    return sum(numbers)\n\ntotal(1, 2, 3)   # 6\n\ndef describe(**details):     # details is a dict of all keyword args\n    for key, value in details.items():\n        print(f\"{key}: {value}\")\n\ndescribe(name=\"Ada\", job=\"Engineer\")\n```"}, {"title": "Scope: where variables live", "md": "Variables created inside a function exist only inside it:\n\n```python\ndef calc():\n    secret = 42\n    return secret\n\ncalc()\nprint(secret)   # NameError: secret only existed inside calc()\n```\n\nFunctions can *read* variables from outside, but you should pass in what a\nfunction needs as parameters instead. Functions that only depend on their\ninputs are easy to understand, test, and reuse."}, {"title": "Docstrings: documenting your functions", "md": "```python\ndef compound_interest(principal, rate, years):\n    \"\"\"Return the balance after `years` of annual compounding.\n\n    rate is a decimal, e.g. 0.05 for 5%.\n    \"\"\"\n    return principal * (1 + rate) ** years\n```\n\nThe string right after `def` is the docstring. VS Code shows it when you hover\nover the function, and `help(compound_interest)` prints it."}, {"title": "Functions calling functions: decomposition", "md": "Big problems become easy when you split them into small functions that each\ndo one thing:\n\n```python\ndef parse_line(line):\n    \"\"\"'rent,1200' -> ('rent', 1200.0)\"\"\"\n    name, amount = line.split(\",\")\n    return name.strip(), float(amount)\n\ndef parse_all(text):\n    return [parse_line(line) for line in text.strip().split(\"\\n\")]\n\ndef summarise(items):\n    total = sum(amount for _, amount in items)\n    return f\"{len(items)} expenses totalling ${total:,.2f}\"\n\ndata = \"\"\"rent, 1200\nfood, 350\ntransport, 90\"\"\"\nprint(summarise(parse_all(data)))   # 3 expenses totalling $1,640.00\n```\n\n(The `[... for ...]` syntax is a *list comprehension*. You'll meet it\nproperly in Module 11. Read it as \"make a list of parse_line(line) for each line\".)\n\n### Signs a function is well designed\n- Its name is a verb that says what it does: `calculate_total`, `load_expenses`.\n- It does **one** job. If you need \"and\" to describe it, split it.\n- It's short: ideally under ~20 lines.\n- Same inputs → same output, with no hidden surprises."}, {"title": "The `main()` pattern", "md": "Real scripts are organised like this:\n\n```python\ndef get_number(prompt):\n    return float(input(prompt))\n\ndef main():\n    price = get_number(\"Price: \")\n    qty = get_number(\"Quantity: \")\n    print(f\"Total: ${price * qty:.2f}\")\n\nif __name__ == \"__main__\":\n    main()\n```\n\nThe last two lines mean \"only run `main()` if this file is run directly, not\nwhen it's imported by another file\". You'll see why in Module 10."}, {"title": "Functions are values", "md": "You can pass a function to another function, without calling it (no parentheses):\n\n```python\ndef shout(text):\n    return text.upper() + \"!\"\n\ndef apply_to_all(func, items):\n    return [func(x) for x in items]\n\napply_to_all(shout, [\"hi\", \"bye\"])   # ['HI!', 'BYE!']\napply_to_all(len, [\"hi\", \"bye\"])     # [2, 3]\n```\n\nThis idea powers `sorted(..., key=...)` in Module 11 and decorators in Module 15."}, {"title": "Key takeaways", "md": "`def name(params):` defines; `name(args)` calls.\n- **Return** results; keep printing/asking separate.\n- Defaults and keyword arguments make functions flexible and readable.\n- Variables inside a function are local to it.\n- Split big problems into small single-purpose functions.\n\n**Continue reading:** [Defining Your Own Python Function](https://realpython.com/defining-your-own-python-function/) (Real Python). Arguments, defaults, *args/**kwargs, return values and docstrings in depth."}], "learn": {"big_idea": "Functions are named, reusable pieces. Return results; keep printing and input separate.", "pretest": [0, 1], "quiz": [{"type": "output", "q": "What does this print?", "code": "def add(a, b):\n    print(a + b)\n\nx = add(2, 3)\nprint(x)", "answer": "5\nNone", "why": "add() PRINTS 5 but returns nothing, so x is None."}, {"type": "output", "q": "What does this print?", "code": "def greet(name, greeting=\"Hello\"):\n    return f\"{greeting}, {name}!\"\n\nprint(greet(\"Ada\"))", "answer": "Hello, Ada!", "why": "greeting falls back to its default value."}, {"q": "What's wrong with `def add_item(item, items=[])`?", "options": ["The same list is reused across calls", "Lists can't be parameters", "Defaults must be numbers", "Nothing"], "answer": 0, "why": "Mutable defaults are created once. Use items=None and create a new list inside."}, {"type": "output", "q": "What does this print?", "code": "def total(*nums):\n    return sum(nums)\n\nprint(total(1, 2, 3))", "answer": "6", "why": "*nums collects all positional arguments into a tuple."}, {"q": "A variable created inside a function...", "options": ["exists only inside that function", "is available everywhere", "is deleted before the function ends", "must be returned"], "answer": 0, "why": "That's local scope. Pass data in as parameters and return results."}, {"type": "output", "q": "What does this print?", "code": "def shout(t):\n    return t.upper()\n\nprint([shout(w) for w in ['hi', 'yo']])", "answer": "['HI', 'YO']", "why": "A function can be called for each item. Comprehensions are covered in Module 11."}], "cards": [["Parameter vs argument?", "The parameter is the name in the def; the argument is the value you pass in."], ["What does a function return if it has no return statement?", "`None`"], ["Why should computing functions return rather than print?", "So the result can be reused and tested."], ["What does `if __name__ == \"__main__\":` do?", "Runs code only when the file is executed directly, not when it's imported."], ["Signs of a well-designed function?", "A verb name, one job, short, and the same inputs always give the same output."], ["How do you pass a function without calling it?", "Use its name with no parentheses: `apply(len, items)`."]], "parsons": {"prompt": "Write a function that parses \"rent, 1200\" into a (name, amount) tuple.", "lines": ["def parse_expense(line):", "    name, amount = line.split(\",\")", "    return name.strip(), float(amount)", "", "print(parse_expense(\"rent, 1200\"))"]}, "explain": "Explain the difference between return and print, and why every exercise in this course asks you to return."}, "read": {"title": "Defining Your Own Python Function", "url": "https://realpython.com/defining-your-own-python-function/", "source": "Real Python", "why": "Arguments, defaults, *args/**kwargs, return values and docstrings in depth."}, "exercise": {"code": "\"\"\"\nModule 07 exercises: Functions.   Run:  python check.py 7\n\nThis time YOU write some of the function definitions (the `def` lines).\nRead each TODO carefully; the checker expects the exact names given.\n\"\"\"\n\n\ndef greet(name, greeting=\"Hello\"):\n    # TODO: return \"<greeting>, <name>!\"  greet(\"Ada\") -> \"Hello, Ada!\"\n    raise NotImplementedError\n\n\ndef compound_interest(principal, rate, years=1):\n    # TODO: return principal * (1 + rate) ** years, rounded to 2 decimals.\n    raise NotImplementedError\n\n\n# TODO: write a function called `total` that accepts ANY number of numbers\n# and returns their sum.  total(1, 2, 3) -> 6 ; total() -> 0\n# Hint: def total(*numbers):\n\n\n# TODO: write a function called `parse_expense` that takes a string like\n# \"rent, 1200\" and returns a tuple (\"rent\", 1200.0): name stripped of\n# spaces, amount as a float.\n\n\n# TODO: write `parse_expenses(text)` that takes several lines like\n# \"rent, 1200\\nfood, 350\" and returns a list of tuples by CALLING\n# parse_expense on each non-empty line.\n\n\n# TODO: write `apply_to_all(func, items)` that returns a new list with func\n# applied to each item.  apply_to_all(len, [\"hi\", \"bye\"]) -> [2, 3]\n\n\ndef make_multiplier(factor):\n    # TODO (stretch): return a FUNCTION that multiplies its argument by factor.\n    # double = make_multiplier(2); double(5) -> 10\n    # Hint: define a function inside this one and return it (no parentheses).\n    raise NotImplementedError\n\n\ndef add_item(item, items=None):\n    # TODO: append item to the list `items` and return the list.\n    # If items is not given, start with a NEW empty list every time.\n    # add_item(\"a\") -> [\"a\"] ; add_item(\"b\") -> [\"b\"]  (not [\"a\", \"b\"]!)\n    raise NotImplementedError\n", "tests": "def _need(ex, name):\n    if not hasattr(ex, name):\n        raise NotImplementedError\n    return getattr(ex, name)\n\n\ndef test_greet(ex):\n    assert ex.greet(\"Ada\") == \"Hello, Ada!\"\n    assert ex.greet(\"Ada\", \"Welcome\") == \"Welcome, Ada!\"\n    assert ex.greet(greeting=\"Hi\", name=\"Bo\") == \"Hi, Bo!\"\n\n\ndef test_compound_interest(ex):\n    assert ex.compound_interest(1000, 0.05) == 1050.0\n    assert ex.compound_interest(1000, 0.05, 10) == 1628.89\n\n\ndef test_total(ex):\n    total = _need(ex, \"total\")\n    assert total(1, 2, 3) == 6\n    assert total() == 0\n    assert total(5) == 5\n\n\ndef test_parse_expense(ex):\n    parse_expense = _need(ex, \"parse_expense\")\n    assert parse_expense(\"rent, 1200\") == (\"rent\", 1200.0)\n    assert parse_expense(\"  coffee ,3.5 \") == (\"coffee\", 3.5)\n\n\ndef test_parse_expenses(ex):\n    parse_expenses = _need(ex, \"parse_expenses\")\n    got = parse_expenses(\"rent, 1200\\nfood, 350\\n\")\n    assert got == [(\"rent\", 1200.0), (\"food\", 350.0)], f\"got {got!r} (skip empty lines!)\"\n\n\ndef test_apply_to_all(ex):\n    apply_to_all = _need(ex, \"apply_to_all\")\n    assert apply_to_all(len, [\"hi\", \"bye\"]) == [2, 3]\n    assert apply_to_all(str.upper, [\"a\", \"b\"]) == [\"A\", \"B\"]\n\n\ndef test_make_multiplier(ex):\n    double = ex.make_multiplier(2)\n    assert callable(double), \"make_multiplier should return a function\"\n    assert double(5) == 10\n    assert ex.make_multiplier(3)(4) == 12\n\n\ndef test_add_item(ex):\n    assert ex.add_item(\"a\") == [\"a\"]\n    assert ex.add_item(\"b\") == [\"b\"], \"the default list is being reused between calls - see the ⚠️ in section 3\"\n    assert ex.add_item(\"c\", [\"x\"]) == [\"x\", \"c\"]\n", "solution": "\"\"\"Module 07 solutions.\"\"\"\n\n\ndef greet(name, greeting=\"Hello\"):\n    return f\"{greeting}, {name}!\"\n\n\ndef compound_interest(principal, rate, years=1):\n    return round(principal * (1 + rate) ** years, 2)\n\n\ndef total(*numbers):\n    return sum(numbers)\n\n\ndef parse_expense(line):\n    name, amount = line.split(\",\")\n    return name.strip(), float(amount)\n\n\ndef parse_expenses(text):\n    result = []\n    for line in text.split(\"\\n\"):\n        if line.strip():\n            result.append(parse_expense(line))\n    return result\n\n\ndef apply_to_all(func, items):\n    result = []\n    for item in items:\n        result.append(func(item))\n    return result\n\n\ndef make_multiplier(factor):\n    def multiply(x):\n        return x * factor\n    return multiply\n\n\ndef add_item(item, items=None):\n    if items is None:\n        items = []\n    items.append(item)\n    return items\n"}, "support": {}}, {"id": "08", "slug": "08_errors_debugging", "title": "Errors & Debugging", "goal": "read error messages calmly, find bugs systematically, and handle errors so your programs don't crash.", "time": "3–4 hours.", "intro": "Professional programmers aren't people who don't make mistakes. They're people\nwho are **fast at finding** their mistakes. This module teaches that skill.", "sections": [{"title": "Reading a traceback", "md": "```\nTraceback (most recent call last):\n  File \"budget.py\", line 12, in <module>\n    print(average(expenses))\n  File \"budget.py\", line 4, in average\n    return total / len(items)\nZeroDivisionError: division by zero\n```\n\n**Read from the bottom up:**\n1. **Last line** = what went wrong: `ZeroDivisionError: division by zero`.\n2. **Line above it** = exactly where: `budget.py`, line 4, inside `average`.\n3. **Further up** = how the program got there: line 12 called `average`.\n\nSo: `items` was empty when `average` was called. Now you know what to look at."}, {"title": "The errors you'll meet most", "md": "| Error | Usually means | Example |\n|-------|---------------|---------|\n| `SyntaxError` | Python can't parse it: missing `:`, bracket, or quote | `if x > 3` |\n| `IndentationError` | Inconsistent spaces | mixing tabs and spaces |\n| `NameError` | Using a name that doesn't exist (often a typo) | `pritn(\"hi\")` |\n| `TypeError` | Wrong type for the operation | `\"Age: \" + 36` |\n| `ValueError` | Right type, bad value | `int(\"hello\")` |\n| `IndexError` | List position doesn't exist | `[1, 2][5]` |\n| `KeyError` | Dict key doesn't exist | `{\"a\": 1}[\"b\"]` |\n| `AttributeError` | That type doesn't have that method | `[1, 2].upper()` |\n| `ZeroDivisionError` | Dividing by zero | `10 / 0` |\n| `FileNotFoundError` | Wrong path or file name | `open(\"nope.txt\")` |\n\n> Tip: paste the **last line** of an error into a search engine. Someone has\n> had it before."}, {"title": "A debugging method that always works", "md": "1. **Reproduce it.** Find the exact input that causes the bug.\n2. **Read the error** (bottom up).\n3. **Form a guess:** \"I think `total` is a string, not a number.\"\n4. **Test the guess:** add a `print` right before the failing line:\n   ```python\n   print(f\"DEBUG total={total!r} type={type(total)}\")\n   ```\n   `!r` shows the *exact* value. `'5'` with quotes means it's a string!\n5. **Fix one thing**, run again.\n6. **Remove the debug prints.**\n\n### Rubber-duck debugging\nExplain your code line by line, out loud, to a rubber duck (or a patient\nfriend). You'll often find the bug halfway through the explanation. It works\nbecause explaining forces you to check each assumption.\n\n### Using the VS Code debugger\n1. Click in the margin left of a line number to set a red **breakpoint**.\n2. Press **F5** → \"Python File\".\n3. The program pauses at the breakpoint. Hover over variables to see their values.\n4. **F10** runs the next line; **F11** steps into a function call.\n\nLearn this. It's a superpower.\n\n### `breakpoint()`\nPut `breakpoint()` in your code and run it in the terminal. You get a prompt\n(`(Pdb)`) where you can type variable names to see them, `n` for next line,\n`c` to continue, `q` to quit."}, {"title": "Logic bugs: no error, wrong answer", "md": "The hardest bugs don't crash. Common ones:\n\n```python\n# Off-by-one: range stops BEFORE the end\nfor i in range(1, 10):     # 1..9, not 1..10!\n\n# = vs ==\nif x = 5:                  # SyntaxError (luckily)\n\n# Forgetting to store a string method's result\nname.strip()               # does nothing on its own\n\n# Return inside the loop: returns after the first item!\ndef total(nums):\n    t = 0\n    for n in nums:\n        t += n\n        return t           # ← should be un-indented one level\n\n# Integer vs string comparison\n\"10\" > \"9\"                 # False! strings compare character by character\n```"}, {"title": "Handling errors: `try` / `except`", "md": "Some errors aren't bugs. They're things that *can* go wrong: users typing\nnonsense, missing files, network failures. Handle them:\n\n```python\ntry:\n    age = int(input(\"Age: \"))\nexcept ValueError:\n    print(\"That's not a number!\")\n    age = None\n```\n\nPython runs the `try` block. If a `ValueError` happens, it jumps to the\n`except` block instead of crashing.\n\n### The full form\n```python\ntry:\n    f = open(\"data.txt\")\n    data = f.read()\nexcept FileNotFoundError:\n    print(\"No data file yet; starting fresh.\")\n    data = \"\"\nexcept PermissionError as e:\n    print(f\"Can't read the file: {e}\")\n    data = \"\"\nelse:\n    print(\"Loaded successfully\")   # runs only if no exception happened\nfinally:\n    print(\"Done trying\")           # ALWAYS runs\n```\n\n### Keep asking until valid\n```python\ndef ask_int(prompt):\n    while True:\n        try:\n            return int(input(prompt))\n        except ValueError:\n            print(\"Please enter a whole number.\")\n```\n\n### ⚠️ Don't swallow everything\n```python\ntry:\n    do_something()\nexcept:            # ❌ catches EVERYTHING, even typos and Ctrl+C\n    pass\n```\nCatch the **specific** error you expect. Hiding errors hides bugs."}, {"title": "Raising your own errors", "md": "When a function gets input it can't sensibly handle, **raise** an error\nrather than returning something wrong:\n\n```python\ndef withdraw(balance, amount):\n    if amount <= 0:\n        raise ValueError(\"Amount must be positive\")\n    if amount > balance:\n        raise ValueError(f\"Insufficient funds: balance is {balance}\")\n    return balance - amount\n```\n\nWhoever calls it can decide what to do:\n\n```python\ntry:\n    balance = withdraw(balance, 500)\nexcept ValueError as e:\n    print(f\"Sorry: {e}\")\n```\n\nThis is a key design principle: **functions that detect problems raise;\ncode that talks to the user catches and explains.**"}, {"title": "Key takeaways", "md": "Read tracebacks **bottom up**: what, where, how we got there.\n- Debug by guessing and testing with `print(f\"{x!r}\")` or the debugger.\n- `try` / `except SpecificError` handles expected problems.\n- `raise ValueError(\"why\")` when a function gets bad input.\n\n**Continue reading:** [Errors and Exceptions](https://docs.python.org/3/tutorial/errors.html) (the official Python tutorial). The complete picture of try/except/else/finally, raising, and custom exceptions."}], "learn": {"big_idea": "Read tracebacks bottom-up. Catch specific errors you expect; raise errors when input is bad.", "pretest": [0, 2], "quiz": [{"q": "Which line of a traceback tells you WHAT went wrong?", "options": ["The last line", "The first line", "The line with 'Traceback'", "None of them"], "answer": 0, "why": "Read from the bottom up: what, then where, then how the program got there."}, {"q": "`int(\"hello\")` raises which error?", "options": ["ValueError", "TypeError", "NameError", "KeyError"], "answer": 0, "why": "The type (str) is fine for int(), but the value can't be converted."}, {"q": "`\"Age: \" + 36` raises which error?", "options": ["TypeError", "ValueError", "SyntaxError", "IndexError"], "answer": 0, "why": "You can't + a str and an int. Use f\"Age: {36}\" or str(36)."}, {"type": "output", "q": "What does this print?", "code": "try:\n    x = 1 / 0\nexcept ZeroDivisionError:\n    x = None\nfinally:\n    print(\"done\")\nprint(x)", "answer": "done\nNone", "why": "The except block handles the error and finally always runs."}, {"q": "Why is a bare `except:` a bad idea?", "options": ["It hides every error, including bugs and Ctrl+C", "It's a SyntaxError", "It only catches ValueError", "It makes code slower"], "answer": 0, "why": "Catch the specific error you expect. Hiding errors hides bugs."}, {"type": "output", "q": "What does this print? (Spot the bug.)", "code": "def total(nums):\n    t = 0\n    for n in nums:\n        t += n\n        return t\n\nprint(total([1, 2, 3]))", "answer": "1", "why": "The return is inside the loop, so the function exits after the first item."}], "cards": [["Order to read a traceback?", "Bottom up: the last line says what, the line above says where."], ["Best debug print?", "`print(f\"DEBUG x={x!r} type={type(x)}\")`. !r shows quotes on strings."], ["NameError usually means...", "A typo, or using a name before it's defined."], ["try / except / else / finally: when does each run?", "try first; except on an error; else if no error; finally always."], ["Who should raise and who should catch?", "Functions that detect a problem raise; code that talks to the user catches and explains."], ["What is rubber-duck debugging?", "Explaining your code line by line out loud, which forces you to check each assumption."]], "parsons": {"prompt": "Keep asking until the user types a valid whole number.", "lines": ["def ask_int(prompt):", "    while True:", "        try:", "            return int(input(prompt))", "        except ValueError:", "            print(\"Please enter a whole number.\")"]}, "explain": "Describe the 6-step debugging method in your own words. Which step do you usually skip?"}, "read": {"title": "Errors and Exceptions", "url": "https://docs.python.org/3/tutorial/errors.html", "source": "the official Python tutorial", "why": "The complete picture of try/except/else/finally, raising, and custom exceptions."}, "exercise": {"code": "\"\"\"\nModule 08 exercises: Errors & debugging.   Run:  python check.py 8\n\nPart A: handle and raise errors.\nPart B: each `buggy_` function has ONE bug. Find it and fix it.\n         (The docstring says what it SHOULD do.)\n\"\"\"\n\n# ---------------------------------------------------------------- Part A\n\n\ndef safe_int(text, default=0):\n    # TODO: return int(text), or `default` if text isn't a valid whole number.\n    raise NotImplementedError\n\n\ndef safe_divide(a, b):\n    # TODO: return a / b, or None if b is zero. Use try/except.\n    raise NotImplementedError\n\n\ndef get_setting(settings, key, default=None):\n    # TODO: return settings[key]; if the key is missing return default.\n    # Use try/except KeyError (yes, .get() would also work - practise try!).\n    raise NotImplementedError\n\n\ndef withdraw(balance, amount):\n    # TODO: raise ValueError if amount <= 0, raise ValueError if amount > balance,\n    # otherwise return the new balance.\n    raise NotImplementedError\n\n\ndef parse_age(text):\n    # TODO: convert text to an int age and return it.\n    # Raise ValueError if it's not a number OR if it's outside 0-130.\n    raise NotImplementedError\n\n\ndef sum_valid_numbers(items):\n    # TODO: items is a list of strings. Add up the ones that are valid numbers\n    # (they may be decimals like \"2.5\"), skip the rest.\n    # sum_valid_numbers([\"1\", \"two\", \"2.5\", \"\"]) -> 3.5\n    raise NotImplementedError\n\n\n# ---------------------------------------------------------------- Part B\n\n\ndef buggy_total(numbers):\n    \"\"\"Return the sum of all numbers.\"\"\"\n    total = 0\n    for n in numbers:\n        total += n\n        return total\n\n\ndef buggy_count_to(n):\n    \"\"\"Return a list [1, 2, ..., n].\"\"\"\n    result = []\n    for i in range(1, n):\n        result.append(i)\n    return result\n\n\ndef buggy_shout(text):\n    \"\"\"Return text in uppercase with surrounding spaces removed.\"\"\"\n    text.strip()\n    return text.upper()\n\n\ndef buggy_largest(numbers):\n    \"\"\"Return the largest number. Numbers may all be negative.\"\"\"\n    largest = 0\n    for n in numbers:\n        if n > largest:\n            largest = n\n    return largest\n\n\ndef buggy_describe(name, age):\n    \"\"\"Return e.g. 'Ada is 36 years old'.\"\"\"\n    return name + \" is \" + age + \" years old\"\n", "tests": "def _raises(fn, *args):\n    try:\n        fn(*args)\n    except ValueError:\n        return True\n    except NotImplementedError:\n        raise\n    return False\n\n\ndef test_safe_int(ex):\n    assert ex.safe_int(\"42\") == 42\n    assert ex.safe_int(\"hello\") == 0\n    assert ex.safe_int(\"3.5\", -1) == -1\n\n\ndef test_safe_divide(ex):\n    assert ex.safe_divide(10, 4) == 2.5\n    assert ex.safe_divide(1, 0) is None\n\n\ndef test_get_setting(ex):\n    s = {\"theme\": \"dark\"}\n    assert ex.get_setting(s, \"theme\") == \"dark\"\n    assert ex.get_setting(s, \"font\") is None\n    assert ex.get_setting(s, \"font\", \"Arial\") == \"Arial\"\n\n\ndef test_withdraw(ex):\n    assert ex.withdraw(100, 30) == 70\n    assert _raises(ex.withdraw, 100, 0), \"withdrawing 0 should raise ValueError\"\n    assert _raises(ex.withdraw, 100, -5), \"withdrawing a negative should raise ValueError\"\n    assert _raises(ex.withdraw, 100, 500), \"overdrawing should raise ValueError\"\n\n\ndef test_parse_age(ex):\n    assert ex.parse_age(\"36\") == 36\n    assert _raises(ex.parse_age, \"old\"), \"'old' should raise ValueError\"\n    assert _raises(ex.parse_age, \"200\"), \"200 is out of range - raise ValueError\"\n    assert _raises(ex.parse_age, \"-1\"), \"-1 is out of range - raise ValueError\"\n\n\ndef test_sum_valid_numbers(ex):\n    assert ex.sum_valid_numbers([\"1\", \"two\", \"2.5\", \"\"]) == 3.5\n\n\ndef test_buggy_total(ex):\n    assert ex.buggy_total([1, 2, 3]) == 6, \"look at the indentation of the return\"\n\n\ndef test_buggy_count_to(ex):\n    assert ex.buggy_count_to(3) == [1, 2, 3], \"classic off-by-one: where does range stop?\"\n\n\ndef test_buggy_shout(ex):\n    assert ex.buggy_shout(\"  hi  \") == \"HI\", \"strings are immutable - store the result\"\n\n\ndef test_buggy_largest(ex):\n    assert ex.buggy_largest([3, 7, 2]) == 7\n    assert ex.buggy_largest([-5, -2, -9]) == -2, \"what's wrong with starting at 0?\"\n\n\ndef test_buggy_describe(ex):\n    assert ex.buggy_describe(\"Ada\", 36) == \"Ada is 36 years old\", \"TypeError: you can't + a str and an int\"\n", "solution": "\"\"\"Module 08 solutions.\"\"\"\n\n\ndef safe_int(text, default=0):\n    try:\n        return int(text)\n    except ValueError:\n        return default\n\n\ndef safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\n\ndef get_setting(settings, key, default=None):\n    try:\n        return settings[key]\n    except KeyError:\n        return default\n\n\ndef withdraw(balance, amount):\n    if amount <= 0:\n        raise ValueError(\"Amount must be positive\")\n    if amount > balance:\n        raise ValueError(f\"Insufficient funds: balance is {balance}\")\n    return balance - amount\n\n\ndef parse_age(text):\n    age = int(text)          # raises ValueError by itself for non-numbers\n    if not 0 <= age <= 130:\n        raise ValueError(f\"Age out of range: {age}\")\n    return age\n\n\ndef sum_valid_numbers(items):\n    total = 0\n    for item in items:\n        try:\n            total += float(item)\n        except ValueError:\n            continue\n    return total\n\n\ndef buggy_total(numbers):\n    total = 0\n    for n in numbers:\n        total += n\n    return total            # fixed: return after the loop, not inside it\n\n\ndef buggy_count_to(n):\n    result = []\n    for i in range(1, n + 1):   # fixed: range stops before its end value\n        result.append(i)\n    return result\n\n\ndef buggy_shout(text):\n    text = text.strip()      # fixed: store the new string\n    return text.upper()\n\n\ndef buggy_largest(numbers):\n    largest = numbers[0]     # fixed: start from a real value, not 0\n    for n in numbers:\n        if n > largest:\n            largest = n\n    return largest\n\n\ndef buggy_describe(name, age):\n    return name + \" is \" + str(age) + \" years old\"   # or an f-string\n"}, "support": {}}, {"id": "09", "slug": "09_files_data", "title": "Files & Data", "goal": "read and write text, CSV and JSON files, and work with folders.", "time": "4 hours.", "intro": "This is where Python becomes *useful in your actual life*. Spreadsheets,\nexports, logs, and folders full of files are all now things you can automate.\n\nSample files for this module are in `data/`.", "sections": [{"title": "Paths with `pathlib`", "md": "```python\nfrom pathlib import Path\n\ndata_dir = Path(\"data\")\nfile = data_dir / \"notes.txt\"      # join paths with /  (works on Windows too)\n\nfile.name        # 'notes.txt'\nfile.stem        # 'notes'\nfile.suffix      # '.txt'\nfile.parent      # Path('data')\nfile.exists()    # True / False\nPath.home()      # your home folder\nPath.cwd()       # the folder you ran Python from\n```\n\n> ⚠️ Relative paths like `\"data/notes.txt\"` are relative to where you **ran**\n> the program from, not where the `.py` file lives. To be safe in scripts:\n> ```python\n> HERE = Path(__file__).parent\n> file = HERE / \"data\" / \"notes.txt\"\n> ```"}, {"title": "Reading and writing text", "md": "### The quick way\n```python\ntext = Path(\"data/notes.txt\").read_text(encoding=\"utf-8\")\nPath(\"output.txt\").write_text(\"Hello file!\\n\", encoding=\"utf-8\")\n```\n\n### The `with open(...)` way (more control)\n```python\nwith open(\"data/notes.txt\", encoding=\"utf-8\") as f:\n    for line in f:                  # reads one line at a time, so it's memory-friendly\n        print(line.rstrip(\"\\n\"))\n\nwith open(\"log.txt\", \"a\", encoding=\"utf-8\") as f:   # \"a\" = append\n    f.write(\"Another line\\n\")\n```\n\n| Mode | Meaning |\n|------|---------|\n| `\"r\"` | read (default) |\n| `\"w\"` | write: **erases** the file first! |\n| `\"a\"` | append to the end |\n\n`with` automatically closes the file when the block ends, even if an error\nhappens. Always use it with `open`.\n\nAlways pass `encoding=\"utf-8\"`. Otherwise accented characters and emoji can\nbreak on Windows."}, {"title": "CSV files (spreadsheet data)", "md": "CSV = \"comma-separated values\". Every spreadsheet program can export it.\n\n`data/expenses.csv`:\n```\ndate,category,description,amount\n2026-10-01,rent,October rent,1200.00\n2026-10-02,food,Groceries,84.20\n...\n```\n\n### Reading as dictionaries (recommended)\n```python\nimport csv\n\nwith open(\"data/expenses.csv\", newline=\"\", encoding=\"utf-8\") as f:\n    reader = csv.DictReader(f)\n    for row in reader:\n        print(row[\"category\"], float(row[\"amount\"]))\n```\n\nEach row is a dict keyed by the header row. **Every value is a string**, so\nconvert numbers with `float()` / `int()`.\n\n### Writing\n```python\nrows = [\n    {\"name\": \"Ada\", \"score\": 95},\n    {\"name\": \"Grace\", \"score\": 98},\n]\nwith open(\"scores.csv\", \"w\", newline=\"\", encoding=\"utf-8\") as f:\n    writer = csv.DictWriter(f, fieldnames=[\"name\", \"score\"])\n    writer.writeheader()\n    writer.writerows(rows)\n```\n\n(`newline=\"\"` stops blank lines appearing between rows on Windows.)\n\nWhy not just `line.split(\",\")`? Because real CSVs contain commas inside quoted\nfields: `\"Smith, John\",42`. The `csv` module handles that correctly."}, {"title": "JSON (structured data)", "md": "JSON looks almost exactly like Python dicts and lists. It's the language of\nweb APIs and config files.\n\n```python\nimport json\n\nsettings = {\"theme\": \"dark\", \"font_size\": 14, \"recent\": [\"a.txt\", \"b.txt\"]}\n\n# Python → JSON file\nwith open(\"settings.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(settings, f, indent=2)\n\n# JSON file → Python\nwith open(\"settings.json\", encoding=\"utf-8\") as f:\n    loaded = json.load(f)\n\n# To/from strings\ntext = json.dumps(settings)\nback = json.loads(text)\n```\n\nJSON is perfect for **saving your program's state** between runs (you'll do\nexactly that in Project 2)."}, {"title": "Working with folders", "md": "```python\nfrom pathlib import Path\n\nfolder = Path(\"data\")\n\nfor p in folder.iterdir():             # everything in the folder\n    print(p.name, \"folder\" if p.is_dir() else \"file\")\n\nfor p in folder.glob(\"*.csv\"):         # matching a pattern\n    print(p)\n\nfor p in folder.rglob(\"*.txt\"):        # recursive: includes subfolders\n    print(p)\n\nPath(\"output/reports\").mkdir(parents=True, exist_ok=True)   # create folders\n```\n\nRenaming / moving / copying:\n\n```python\nimport shutil\n\nsrc = Path(\"report.txt\")\nsrc.rename(\"archive/report.txt\")       # move / rename\nshutil.copy(\"a.txt\", \"backup/a.txt\")   # copy\n```\n\n> ⚠️ Scripts that move or delete files should **print what they would do\n> first** (a \"dry run\") before you let them actually do it."}, {"title": "Real-world example: a monthly spending report", "md": "```python\nimport csv\nfrom pathlib import Path\n\nHERE = Path(__file__).parent\n\ndef load_expenses(path):\n    with open(path, newline=\"\", encoding=\"utf-8\") as f:\n        return [\n            {**row, \"amount\": float(row[\"amount\"])}\n            for row in csv.DictReader(f)\n        ]\n\ndef totals_by_category(expenses):\n    totals = {}\n    for e in expenses:\n        totals[e[\"category\"]] = totals.get(e[\"category\"], 0) + e[\"amount\"]\n    return totals\n\nexpenses = load_expenses(HERE / \"data\" / \"expenses.csv\")\nfor category, total in totals_by_category(expenses).items():\n    print(f\"{category:<12} ${total:>9,.2f}\")\n```\n\n(`{**row, \"amount\": ...}` means \"copy all of row's keys, then override\n`amount`\". It's a neat trick for dicts.)"}, {"title": "Key takeaways", "md": "Use `pathlib.Path` for paths; `Path(__file__).parent` for files next to your script.\n- `with open(path, encoding=\"utf-8\") as f:`. `\"w\"` erases, `\"a\"` appends.\n- `csv.DictReader` / `DictWriter` for spreadsheets; values come back as strings.\n- `json.load` / `json.dump` to save and load Python data.\n- `glob` / `rglob` to find files; dry-run before moving anything.\n\n**Continue reading:** [Reading and Writing Files](https://automatetheboringstuff.com/3e/chapter10.html) (Automate the Boring Stuff with Python, 3rd ed., chapter 10). Paths, files and saving data, from the classic free book on practical automation."}], "learn": {"big_idea": "Use pathlib for paths, `with open(..., encoding='utf-8')` for files, csv.DictReader for spreadsheets, json for data.", "pretest": [0, 1], "quiz": [{"q": "Which file mode ERASES the file before writing?", "options": ["\"w\"", "\"a\"", "\"r\"", "\"x+\""], "answer": 0, "why": "\"w\" truncates. Use \"a\" to append."}, {"q": "csv.DictReader gives you each `amount` as...", "options": ["a string", "a float", "an int", "it depends"], "answer": 0, "why": "Every CSV value is text. Convert with float()."}, {"type": "output", "q": "What does this print?", "code": "from pathlib import Path\np = Path(\"data\") / \"report.final.pdf\"\nprint(p.name, p.suffix, p.stem)", "answer": "report.final.pdf .pdf report.final", "why": "suffix is the last extension; stem is the name without it."}, {"q": "Why use `with open(...) as f:`?", "options": ["It closes the file automatically, even on errors", "It makes reading faster", "It's required for CSV", "It encrypts the file"], "answer": 0, "why": "with guarantees cleanup."}, {"type": "output", "q": "What does this print?", "code": "import json\nprint(json.loads('{\"a\": [1, 2]}')[\"a\"][1])", "answer": "2", "why": "JSON turns into Python dicts and lists."}, {"q": "Your script opens \"data/notes.txt\" but gets FileNotFoundError, even though the file exists. Likely cause?", "options": ["Relative paths are relative to where you RAN the script", "The file is too big", "You need the csv module", "UTF-8 is missing"], "answer": 0, "why": "Use Path(__file__).parent / 'data' / 'notes.txt'."}], "cards": [["Join paths safely?", "`Path(\"data\") / \"file.txt\"`"], ["Path to a file next to your script?", "`Path(__file__).parent / \"file.txt\"`"], ["Read a CSV as dicts?", "`csv.DictReader(f)` with `open(path, newline=\"\", encoding=\"utf-8\")`"], ["Save Python data to a file and load it back?", "`json.dump(obj, f, indent=2)` / `json.load(f)`"], ["Find all CSVs in a folder, including subfolders?", "`Path(folder).rglob(\"*.csv\")`"], ["Before a script moves or deletes files, it should...", "Do a dry run that prints what it would do."]], "parsons": {"prompt": "Total the amounts in an expenses CSV file.", "lines": ["import csv", "", "total = 0", "with open(\"expenses.csv\", newline=\"\", encoding=\"utf-8\") as f:", "    for row in csv.DictReader(f):", "        total += float(row[\"amount\"])", "print(f\"${total:,.2f}\")"]}, "explain": "Pick one boring file-related task from your life (or work). Describe how you would automate it with this module's tools."}, "read": {"title": "Reading and Writing Files", "url": "https://automatetheboringstuff.com/3e/chapter10.html", "source": "Automate the Boring Stuff with Python, 3rd ed., chapter 10", "why": "Paths, files and saving data, from the classic free book on practical automation."}, "exercise": {"code": "\"\"\"\nModule 09 exercises: Files & data.   Run:  python check.py 9\n\nEvery function receives paths as arguments. The checker creates temporary\nfiles to test with, so don't hard-code file names.\n\"\"\"\n\nimport csv\nimport json\nfrom pathlib import Path\n\n\ndef count_lines(path):\n    # TODO: return the number of lines in the text file at `path`.\n    raise NotImplementedError\n\n\ndef longest_line(path):\n    # TODO: return the longest line in the file, without its trailing newline.\n    raise NotImplementedError\n\n\ndef write_lines(path, lines):\n    # TODO: write each string in `lines` to the file, one per line\n    # (each followed by \"\\n\"). Overwrite the file if it exists.\n    raise NotImplementedError\n\n\ndef append_log(path, message):\n    # TODO: add `message` followed by \"\\n\" to the END of the file,\n    # creating it if it doesn't exist.\n    raise NotImplementedError\n\n\ndef load_expenses(path):\n    # TODO: read a CSV with columns date,category,description,amount.\n    # Return a list of dicts, with \"amount\" converted to a float.\n    raise NotImplementedError\n\n\ndef category_totals_from_csv(path):\n    # TODO: return {category: total amount} for the CSV at path,\n    # each total rounded to 2 decimals. (Reuse load_expenses!)\n    raise NotImplementedError\n\n\ndef write_summary_csv(path, totals):\n    # TODO: totals is {category: amount}. Write a CSV with header\n    # \"category,total\" and one row per category.\n    raise NotImplementedError\n\n\ndef save_json(path, data):\n    # TODO: save `data` (dicts/lists) to path as JSON with indent=2.\n    raise NotImplementedError\n\n\ndef load_json(path, default=None):\n    # TODO: return the data from the JSON file, or `default` if the file\n    # doesn't exist.\n    raise NotImplementedError\n\n\ndef files_by_extension(folder):\n    # TODO: return {extension: count} for every FILE (not sub-folder) directly\n    # inside `folder`. Extensions lowercase without the dot; files with no\n    # extension use \"\".   e.g. {\"txt\": 2, \"csv\": 1}\n    raise NotImplementedError\n", "tests": "import json\nimport tempfile\nfrom pathlib import Path\n\nCSV_TEXT = \"\"\"date,category,description,amount\n2026-10-01,rent,October rent,1200.00\n2026-10-02,food,Groceries,84.20\n2026-10-05,food,\"Dinner out, birthday\",56.75\n\"\"\"\n\n\ndef _tmp():\n    return Path(tempfile.mkdtemp())\n\n\ndef test_count_lines(ex):\n    p = _tmp() / \"a.txt\"\n    p.write_text(\"one\\ntwo\\nthree\\n\", encoding=\"utf-8\")\n    assert ex.count_lines(p) == 3\n\n\ndef test_longest_line(ex):\n    p = _tmp() / \"a.txt\"\n    p.write_text(\"short\\nthe longest one\\nmid size\\n\", encoding=\"utf-8\")\n    assert ex.longest_line(p) == \"the longest one\"\n\n\ndef test_write_lines(ex):\n    p = _tmp() / \"out.txt\"\n    p.write_text(\"OLD CONTENT\\n\", encoding=\"utf-8\")\n    ex.write_lines(p, [\"a\", \"b\"])\n    assert p.read_text(encoding=\"utf-8\") == \"a\\nb\\n\", \"should overwrite, one item per line\"\n\n\ndef test_append_log(ex):\n    p = _tmp() / \"log.txt\"\n    ex.append_log(p, \"first\")\n    ex.append_log(p, \"second\")\n    assert p.read_text(encoding=\"utf-8\") == \"first\\nsecond\\n\"\n\n\ndef test_load_expenses(ex):\n    p = _tmp() / \"e.csv\"\n    p.write_text(CSV_TEXT, encoding=\"utf-8\")\n    rows = ex.load_expenses(p)\n    assert len(rows) == 3\n    assert rows[0][\"amount\"] == 1200.0, \"amount should be a float\"\n    assert rows[2][\"description\"] == \"Dinner out, birthday\", \"use the csv module - it handles quoted commas\"\n\n\ndef test_category_totals_from_csv(ex):\n    p = _tmp() / \"e.csv\"\n    p.write_text(CSV_TEXT, encoding=\"utf-8\")\n    assert ex.category_totals_from_csv(p) == {\"rent\": 1200.0, \"food\": 140.95}\n\n\ndef test_write_summary_csv(ex):\n    p = _tmp() / \"s.csv\"\n    ex.write_summary_csv(p, {\"rent\": 1200.0, \"food\": 140.95})\n    lines = p.read_text(encoding=\"utf-8\").strip().splitlines()\n    assert lines[0] == \"category,total\", f\"header was {lines[0]!r}\"\n    assert \"rent,1200.0\" in lines and \"food,140.95\" in lines\n\n\ndef test_save_and_load_json(ex):\n    p = _tmp() / \"d.json\"\n    data = {\"name\": \"Ada\", \"skills\": [\"python\", \"maths\"]}\n    ex.save_json(p, data)\n    assert json.loads(p.read_text(encoding=\"utf-8\")) == data\n    assert ex.load_json(p) == data\n\n\ndef test_load_json_missing(ex):\n    assert ex.load_json(_tmp() / \"nope.json\", {\"empty\": True}) == {\"empty\": True}\n\n\ndef test_files_by_extension(ex):\n    d = _tmp()\n    for name in [\"a.txt\", \"b.TXT\", \"c.csv\", \"README\"]:\n        (d / name).write_text(\"x\")\n    (d / \"sub.folder\").mkdir()\n    assert ex.files_by_extension(d) == {\"txt\": 2, \"csv\": 1, \"\": 1}\n", "solution": "\"\"\"Module 09 solutions.\"\"\"\n\nimport csv\nimport json\nfrom pathlib import Path\n\n\ndef count_lines(path):\n    with open(path, encoding=\"utf-8\") as f:\n        return sum(1 for _ in f)\n\n\ndef longest_line(path):\n    longest = \"\"\n    with open(path, encoding=\"utf-8\") as f:\n        for line in f:\n            line = line.rstrip(\"\\n\")\n            if len(line) > len(longest):\n                longest = line\n    return longest\n\n\ndef write_lines(path, lines):\n    with open(path, \"w\", encoding=\"utf-8\") as f:\n        for line in lines:\n            f.write(line + \"\\n\")\n\n\ndef append_log(path, message):\n    with open(path, \"a\", encoding=\"utf-8\") as f:\n        f.write(message + \"\\n\")\n\n\ndef load_expenses(path):\n    rows = []\n    with open(path, newline=\"\", encoding=\"utf-8\") as f:\n        for row in csv.DictReader(f):\n            row[\"amount\"] = float(row[\"amount\"])\n            rows.append(row)\n    return rows\n\n\ndef category_totals_from_csv(path):\n    totals = {}\n    for e in load_expenses(path):\n        totals[e[\"category\"]] = totals.get(e[\"category\"], 0) + e[\"amount\"]\n    return {cat: round(total, 2) for cat, total in totals.items()}\n\n\ndef write_summary_csv(path, totals):\n    with open(path, \"w\", newline=\"\", encoding=\"utf-8\") as f:\n        writer = csv.writer(f)\n        writer.writerow([\"category\", \"total\"])\n        for category, total in totals.items():\n            writer.writerow([category, total])\n\n\ndef save_json(path, data):\n    with open(path, \"w\", encoding=\"utf-8\") as f:\n        json.dump(data, f, indent=2)\n\n\ndef load_json(path, default=None):\n    try:\n        with open(path, encoding=\"utf-8\") as f:\n            return json.load(f)\n    except FileNotFoundError:\n        return default\n\n\ndef files_by_extension(folder):\n    counts = {}\n    for p in Path(folder).iterdir():\n        if p.is_file():\n            ext = p.suffix.lower().lstrip(\".\")\n            counts[ext] = counts.get(ext, 0) + 1\n    return counts\n"}, "support": {"data/settings.json": "{\n  \"theme\": \"dark\",\n  \"font_size\": 14,\n  \"recent_files\": [\"budget.csv\", \"notes.txt\"]\n}\n", "data/notes.txt": "Python is fun.\nFiles are just text.\nAutomate the boring stuff!\n", "data/expenses.csv": "date,category,description,amount\n2026-10-01,rent,October rent,1200.00\n2026-10-02,food,Groceries,84.20\n2026-10-03,transport,Monthly bus pass,65.00\n2026-10-05,food,\"Dinner out, birthday\",56.75\n2026-10-08,fun,Cinema,24.00\n2026-10-11,food,Groceries,91.10\n2026-10-15,utilities,Electricity,72.40\n2026-10-18,fun,Concert tickets,110.00\n2026-10-22,food,Groceries,77.35\n2026-10-27,utilities,Internet,45.00\n"}}, {"id": "10", "slug": "10_modules_packages", "title": "Modules, Packages & pip", "goal": "split code across files, use Python's huge standard library, and install third-party packages safely with virtual environments.", "time": "3–4 hours.", "intro": "", "sections": [{"title": "Importing", "md": "A **module** is just a `.py` file. `import` lets you use code from another one.\n\n```python\nimport math\nmath.sqrt(16)        # 4.0\nmath.pi              # 3.14159...\n\nfrom math import sqrt, pi   # import specific names\nsqrt(16)\n\nimport datetime as dt       # give it a shorter name\ndt.date.today()\n```\n\nPrefer `import module` or `from module import name`. Avoid `from module import *`:\nit dumps unknown names into your file and makes it unclear where things come from."}, {"title": "Your own modules", "md": "Make `money.py`:\n\n```python\n# money.py\ndef format_money(amount):\n    return f\"${amount:,.2f}\"\n\nTAX_RATE = 0.2\n```\n\nThen in `main.py`, in the **same folder**:\n\n```python\nfrom money import format_money, TAX_RATE\nprint(format_money(100 * (1 + TAX_RATE)))\n```\n\n### Why `if __name__ == \"__main__\":`\nWhen Python imports `money.py`, it runs the whole file. Anything at the top\nlevel, like a test `print` or `input()`, would run too. Code under\n`if __name__ == \"__main__\":` only runs when the file is executed directly:\n\n```python\n# money.py\ndef format_money(amount):\n    return f\"${amount:,.2f}\"\n\nif __name__ == \"__main__\":\n    print(format_money(1234.5))   # quick manual test; doesn't run on import\n```\n\n### Packages\nA **package** is a folder of modules:\n\n```\nbudget_app/\n    main.py\n    budget/\n        __init__.py      # can be empty; marks the folder as a package\n        storage.py\n        reports.py\n```\n\n```python\n# in main.py\nfrom budget.storage import load_expenses\nfrom budget.reports import monthly_summary\n```\n\nProject 2 is structured this way."}, {"title": "The standard library: batteries included", "md": "Python ships with hundreds of modules. The ones worth knowing now:\n\n```python\n# Dates and times\nfrom datetime import date, datetime, timedelta\ntoday = date.today()\ndeadline = today + timedelta(days=30)\n(deadline - today).days                      # 30\ndatetime.now().strftime(\"%Y-%m-%d %H:%M\")    # '2026-11-06 14:05'\ndatetime.strptime(\"06/11/2026\", \"%d/%m/%Y\")  # parse text into a datetime\n\n# Random\nimport random\nrandom.randint(1, 6)            # dice roll\nrandom.choice([\"a\", \"b\", \"c\"])  # pick one\nrandom.shuffle(my_list)         # shuffle in place\n\n# Counting made easy\nfrom collections import Counter, defaultdict\nCounter(\"mississippi\").most_common(2)   # [('i', 4), ('s', 4)]\ngroups = defaultdict(list)               # missing keys start as []\ngroups[\"food\"].append(12.5)\n\n# Statistics\nimport statistics\nstatistics.mean([1, 2, 3, 4])     # 2.5\nstatistics.median([3, 1, 2])      # 2\n\n# Talking to the operating system\nimport os, sys, shutil\nos.environ.get(\"HOME\")\nsys.argv                 # command-line arguments\n\n# Command-line tools\nimport argparse          # proper command-line options (see below)\n```\n\nBrowse the full list: <https://docs.python.org/3/library/>. Before writing\nsomething general-purpose, check whether the standard library already has it.\n\n### Command-line arguments with `argparse`\n```python\nimport argparse\n\nparser = argparse.ArgumentParser(description=\"Convert temperatures\")\nparser.add_argument(\"celsius\", type=float)\nparser.add_argument(\"--round\", type=int, default=1)\nargs = parser.parse_args()\nprint(round(args.celsius * 9 / 5 + 32, args.round))\n```\n```bash\npython convert.py 21.5 --round 0\npython convert.py --help         # free help text!\n```"}, {"title": "Third-party packages and `pip`", "md": "Beyond the standard library, there are 500,000+ packages on\n[PyPI](https://pypi.org). You install them with `pip`.\n\n### Always use a virtual environment (\"venv\")\nA venv is a private folder of packages for one project, so projects don't\nfight over versions.\n\n```bash\n# create it once, inside your project folder\npython -m venv .venv\n\n# activate it (every time you open a new terminal)\n# Windows:\n.venv\\Scripts\\activate\n# macOS / Linux:\nsource .venv/bin/activate\n\n# your prompt now starts with (.venv)\npip install requests\npip list\npip freeze > requirements.txt     # record exact versions\n\n# later / on another computer:\npip install -r requirements.txt\n```\n\nVS Code: *Ctrl+Shift+P → \"Python: Select Interpreter\"* and pick `.venv`.\n\n### Packages worth knowing exist\n| Package | For |\n|---------|-----|\n| `requests` / `httpx` | Calling web APIs (Module 14) |\n| `pytest` | Testing (Module 13) |\n| `pandas` | Data analysis, Excel/CSV wrangling |\n| `openpyxl` | Reading/writing Excel files |\n| `matplotlib` | Charts |\n| `rich` | Beautiful terminal output |\n| `flask` / `fastapi` | Web apps and APIs |\n| `pygame` | Games |\n\n### ⚠️ Safety\nInstalling a package runs code from the internet on your computer. Check the\nspelling (typo-squatting is a real attack), prefer well-known packages with\nmany downloads, and look at the project's homepage before installing."}, {"title": "Key takeaways", "md": "`import module` / `from module import name`. Your own `.py` files are modules.\n- Guard script code with `if __name__ == \"__main__\":`.\n- Learn `datetime`, `random`, `collections`, `pathlib`, `csv`, `json`, `argparse`.\n- One **venv** per project; `pip install` inside it; `requirements.txt` to record it.\n\n**Continue reading:** [Virtual Environments and Packages](https://docs.python.org/3/tutorial/venv.html) (the official Python tutorial). venv and pip explained by the Python docs themselves.\n\n> **Checkpoint:** you've finished Part 2. Build\n[Project 2: Expense tracker](#project-2)."}], "learn": {"big_idea": "Every .py file is a module. Use the standard library first, and install extra packages inside a venv.", "pretest": [0, 3], "quiz": [{"q": "What is a virtual environment for?", "options": ["A private set of packages per project", "Running Python faster", "Hiding your code", "Testing on Linux"], "answer": 0, "why": "It stops projects fighting over package versions."}, {"type": "output", "q": "What does this print?", "code": "from collections import Counter\nprint(Counter(\"hello\").most_common(1))", "answer": "[('l', 2)]", "why": "Counter counts items; most_common(n) gives the top n as (item, count) pairs."}, {"type": "output", "q": "What does this print?", "code": "from datetime import date\nprint((date(2026, 12, 25) - date(2026, 12, 1)).days)", "answer": "24", "why": "Subtracting dates gives a timedelta, and .days is its length in days."}, {"q": "Which command records your project's exact package versions?", "options": ["pip freeze > requirements.txt", "pip list", "python -m venv", "pip install -r"], "answer": 0, "why": "Later, `pip install -r requirements.txt` recreates them."}, {"q": "Why avoid `from module import *`?", "options": ["It's unclear where names come from", "It's slower", "It's a SyntaxError", "It installs packages"], "answer": 0, "why": "Explicit imports make code readable."}, {"type": "output", "q": "What does this print?", "code": "import math\nprint(math.sqrt(81), math.floor(3.7))", "answer": "9.0 3", "why": "sqrt returns a float and floor rounds down to an int."}], "cards": [["Create and activate a venv (Mac/Linux)?", "`python -m venv .venv` then `source .venv/bin/activate`"], ["Activate a venv on Windows?", "`.venv\\Scripts\\activate`"], ["What makes a folder a package?", "An `__init__.py` file inside it."], ["A dict where missing keys start as an empty list?", "`collections.defaultdict(list)`"], ["Parse \"06/11/2026\" as a date?", "`datetime.strptime(text, \"%d/%m/%Y\")`"], ["Proper command-line options?", "The `argparse` module (and you get --help for free)."]], "parsons": {"prompt": "Set up a fresh project environment (terminal commands).", "lines": ["python -m venv .venv", "source .venv/bin/activate", "pip install requests", "pip freeze > requirements.txt"]}, "explain": "Explain what problem virtual environments solve, as if to a colleague who keeps installing everything globally."}, "read": {"title": "Virtual Environments and Packages", "url": "https://docs.python.org/3/tutorial/venv.html", "source": "the official Python tutorial", "why": "venv and pip explained by the Python docs themselves."}, "exercise": {"code": "\"\"\"\nModule 10 exercises: The standard library.   Run:  python check.py 10\n\nUse the standard library for each of these. Add the imports you need at the\ntop of this file. Part of the exercise is finding the right tool!\n\"\"\"\n\n# TODO: add your imports here, e.g.\n# from datetime import date, timedelta\n\n\ndef days_until(start_iso, end_iso):\n    # TODO: both are strings like \"2026-11-06\". Return the number of days\n    # from start to end.  days_until(\"2026-11-06\", \"2026-12-25\") -> 49\n    # Hint: date.fromisoformat()\n    raise NotImplementedError\n\n\ndef add_business_days(start_iso, n):\n    # TODO: return the ISO date string that is n WORKING days (Mon-Fri) after\n    # start. add_business_days(\"2026-11-06\", 1) -> \"2026-11-09\" (Fri -> Mon)\n    # Hint: date.weekday() is 0 for Monday ... 6 for Sunday.\n    raise NotImplementedError\n\n\ndef reformat_date(text):\n    # TODO: convert \"06/11/2026\" (day/month/year) to \"6 November 2026\".\n    # Hint: datetime.strptime and strftime. \"%B\" is the full month name.\n    # Watch out: \"%d\" gives \"06\" - you need \"6\".\n    raise NotImplementedError\n\n\ndef top_n_words(text, n):\n    # TODO: return a list of the n most common words (lowercase) as\n    # (word, count) tuples, most common first.\n    # Hint: collections.Counter has a method for exactly this.\n    raise NotImplementedError\n\n\ndef median_and_mean(numbers):\n    # TODO: return (median, mean) using the statistics module.\n    raise NotImplementedError\n\n\ndef roll_dice(n, seed):\n    # TODO: return a list of n dice rolls (1-6). Call random.seed(seed) first\n    # so the results are repeatable, then use random.randint for each roll.\n    raise NotImplementedError\n\n\ndef group_words_by_length(words):\n    # TODO: return a dict {length: [words]} using collections.defaultdict(list).\n    # Return it as a normal dict: dict(your_defaultdict).\n    raise NotImplementedError\n\n\ndef hypotenuse(a, b):\n    # TODO: length of the long side of a right-angled triangle, using math.\n    # hypotenuse(3, 4) -> 5.0\n    raise NotImplementedError\n", "tests": "import random as _random\n\n\ndef test_days_until(ex):\n    assert ex.days_until(\"2026-11-06\", \"2026-12-25\") == 49\n    assert ex.days_until(\"2026-01-01\", \"2026-01-01\") == 0\n\n\ndef test_add_business_days(ex):\n    assert ex.add_business_days(\"2026-11-06\", 1) == \"2026-11-09\", \"Friday + 1 working day is Monday\"\n    assert ex.add_business_days(\"2026-11-02\", 4) == \"2026-11-06\"\n    assert ex.add_business_days(\"2026-11-02\", 5) == \"2026-11-09\"\n\n\ndef test_reformat_date(ex):\n    assert ex.reformat_date(\"06/11/2026\") == \"6 November 2026\", f\"got {ex.reformat_date('06/11/2026')!r}\"\n    assert ex.reformat_date(\"25/12/2026\") == \"25 December 2026\"\n\n\ndef test_top_n_words(ex):\n    got = ex.top_n_words(\"the cat and the hat and the bat\", 2)\n    assert got == [(\"the\", 3), (\"and\", 2)], f\"got {got!r}\"\n\n\ndef test_median_and_mean(ex):\n    assert tuple(ex.median_and_mean([1, 2, 3, 10])) == (2.5, 4)\n\n\ndef test_roll_dice(ex):\n    rolls = ex.roll_dice(10, 42)\n    _random.seed(42)\n    expected = [_random.randint(1, 6) for _ in range(10)]\n    assert rolls == expected, \"seed first, then call random.randint(1, 6) once per roll\"\n\n\ndef test_group_words_by_length(ex):\n    got = ex.group_words_by_length([\"hi\", \"yo\", \"cat\"])\n    assert got == {2: [\"hi\", \"yo\"], 3: [\"cat\"]}\n    assert type(got) is dict, \"convert to a plain dict before returning\"\n\n\ndef test_hypotenuse(ex):\n    assert ex.hypotenuse(3, 4) == 5.0\n", "solution": "\"\"\"Module 10 solutions.\"\"\"\n\nimport math\nimport random\nimport statistics\nfrom collections import Counter, defaultdict\nfrom datetime import date, datetime, timedelta\n\n\ndef days_until(start_iso, end_iso):\n    return (date.fromisoformat(end_iso) - date.fromisoformat(start_iso)).days\n\n\ndef add_business_days(start_iso, n):\n    d = date.fromisoformat(start_iso)\n    added = 0\n    while added < n:\n        d += timedelta(days=1)\n        if d.weekday() < 5:      # Monday-Friday\n            added += 1\n    return d.isoformat()\n\n\ndef reformat_date(text):\n    d = datetime.strptime(text, \"%d/%m/%Y\")\n    return f\"{d.day} {d.strftime('%B %Y')}\"\n\n\ndef top_n_words(text, n):\n    return Counter(text.lower().split()).most_common(n)\n\n\ndef median_and_mean(numbers):\n    return statistics.median(numbers), statistics.mean(numbers)\n\n\ndef roll_dice(n, seed):\n    random.seed(seed)\n    return [random.randint(1, 6) for _ in range(n)]\n\n\ndef group_words_by_length(words):\n    groups = defaultdict(list)\n    for w in words:\n        groups[len(w)].append(w)\n    return dict(groups)\n\n\ndef hypotenuse(a, b):\n    return math.hypot(a, b)   # or math.sqrt(a**2 + b**2)\n"}, "support": {}}, {"id": "11", "slug": "11_pythonic_code", "title": "Pythonic Code", "goal": "write shorter, clearer Python with comprehensions, smart sorting, and the built-ins experienced Python programmers use every day.", "time": "3–4 hours.", "intro": "\"Pythonic\" means using the language's features the way they're meant to be\nused. Everything here does what you could already do with loops, just more\nclearly.", "sections": [{"title": "List comprehensions", "md": "The loop-and-append pattern:\n\n```python\nsquares = []\nfor n in range(10):\n    squares.append(n * n)\n```\n\nas a **comprehension**:\n\n```python\nsquares = [n * n for n in range(10)]\n```\n\nRead it as: \"a list of `n * n` for each `n` in `range(10)`\".\n\n### With a filter\n```python\nevens = [n for n in range(20) if n % 2 == 0]\npassed = [s for s in scores if s >= 60]\nclean = [w.strip().lower() for w in raw_words if w.strip()]\n```\n\n### With if/else (transform every item)\n```python\nlabels = [\"pass\" if s >= 60 else \"fail\" for s in scores]\n```\n(Note the position: a *filter* `if` goes at the end; an *if/else* choice goes at the front.)\n\n### Dict and set comprehensions\n```python\nprices = {\"apple\": 0.5, \"bread\": 2.25}\nwith_tax = {item: round(p * 1.2, 2) for item, p in prices.items()}\nlengths = {word: len(word) for word in [\"hi\", \"hello\"]}\nunique_domains = {email.split(\"@\")[1] for email in emails}\n```\n\n> **When not to:** if a comprehension needs nested loops *and* conditions, or\n> doesn't fit comfortably on one or two lines, use a regular loop. Clarity wins."}, {"title": "Generator expressions", "md": "Drop the brackets inside a function call and you get a *generator*. It produces\nvalues one at a time without building a whole list:\n\n```python\ntotal = sum(p * q for p, q in items)\nany(s < 0 for s in balances)       # True if ANY is negative\nall(f.endswith(\".csv\") for f in files)   # True if ALL match\n```"}, {"title": "`enumerate` and `zip`", "md": "```python\nfor i, name in enumerate(names, start=1):\n    print(f\"{i}. {name}\")\n\nnames = [\"Ada\", \"Grace\", \"Linus\"]\nscores = [95, 98, 80]\nfor name, score in zip(names, scores):\n    print(f\"{name}: {score}\")\n\nlookup = dict(zip(names, scores))   # {'Ada': 95, 'Grace': 98, 'Linus': 80}\n```"}, {"title": "Sorting like a pro: `key=`", "md": "```python\nwords = [\"banana\", \"Apple\", \"cherry\"]\nsorted(words)                       # ['Apple', 'banana', 'cherry'] (capitals first!)\nsorted(words, key=str.lower)        # case-insensitive\nsorted(words, key=len)              # by length\nsorted(words, reverse=True)         # descending\n```\n\n`key` is a **function** that's called on each item; items are sorted by what it returns.\n\n### `lambda`: tiny unnamed functions\n```python\npeople = [\n    {\"name\": \"Ada\", \"age\": 36},\n    {\"name\": \"Grace\", \"age\": 45},\n    {\"name\": \"Linus\", \"age\": 28},\n]\nsorted(people, key=lambda p: p[\"age\"])             # youngest first\nmax(people, key=lambda p: p[\"age\"])[\"name\"]        # 'Grace'\n\nexpenses = [(\"rent\", 1200), (\"food\", 350)]\nsorted(expenses, key=lambda e: e[1], reverse=True) # biggest first\n```\n\n`lambda p: p[\"age\"]` is shorthand for:\n```python\ndef get_age(p):\n    return p[\"age\"]\n```\nUse lambdas only for short one-off functions like these.\n\n### Sorting by several things\nReturn a tuple. Python compares tuples element by element:\n```python\nsorted(people, key=lambda p: (p[\"dept\"], -p[\"salary\"]))   # by dept, then highest salary\n```"}, {"title": "More useful built-ins", "md": "```python\nmin(prices.items(), key=lambda kv: kv[1])   # cheapest (item, price)\nsum(row[\"amount\"] for row in rows)\nround(x, 2), abs(-5), divmod(17, 5)         # divmod → (3, 2)\nreversed(items)                              # iterate backwards\nisinstance(x, (int, float))                  # type check\n```\n\n### Unpacking tricks\n```python\nfirst, *middle, last = [1, 2, 3, 4, 5]\nprint(*names, sep=\", \")        # Ada, Grace, Linus\nmerged = {**defaults, **user_settings}   # merge dicts (right side wins)\ncombined = [*list_a, *list_b]\n```\n\n### The walrus `:=` (assign inside an expression)\n```python\nwhile (line := input(\"> \")) != \"quit\":\n    print(\"You said\", line)\n```"}, {"title": "Before and after", "md": "```python\n# Before\nresult = []\nfor row in rows:\n    if row[\"category\"] == \"food\":\n        result.append(row[\"amount\"])\ntotal = 0\nfor a in result:\n    total = total + a\n\n# After\ntotal = sum(row[\"amount\"] for row in rows if row[\"category\"] == \"food\")\n```"}, {"title": "Key takeaways", "md": "`[expr for x in items if cond]` replaces loop-and-append.\n- `sum(...)`, `any(...)`, `all(...)` with generator expressions.\n- `enumerate` for positions, `zip` to walk lists side-by-side.\n- `sorted(items, key=lambda x: ...)` sorts by anything.\n- Readability beats cleverness, every time.\n\n**Continue reading:** [Python List Comprehension: Tutorial With Examples](https://realpython.com/list-comprehension-python/) (Real Python). When comprehensions help, when they hurt, and the set/dict/generator variants."}], "learn": {"big_idea": "Comprehensions, generator expressions, zip/enumerate and sorted(key=...) replace most loop boilerplate.", "pretest": [0, 3], "quiz": [{"type": "output", "q": "What does this print?", "code": "print([n * n for n in range(5) if n % 2 == 0])", "answer": "[0, 4, 16]", "why": "Keep only the even n (0, 2, 4) and square each."}, {"type": "output", "q": "What does this print?", "code": "print(sorted([\"banana\", \"Apple\", \"cherry\"]))", "answer": "['Apple', 'banana', 'cherry']", "why": "Capital letters sort before lowercase. Use key=str.lower to ignore case."}, {"type": "output", "q": "What does this print?", "code": "print(dict(zip([\"a\", \"b\"], [1, 2])))", "answer": "{'a': 1, 'b': 2}", "why": "zip pairs up items and dict() turns the pairs into key/value entries."}, {"type": "output", "q": "What does this print?", "code": "people = [{\"n\": \"Ada\", \"age\": 36}, {\"n\": \"Bo\", \"age\": 45}]\nprint(max(people, key=lambda p: p[\"age\"])[\"n\"])", "answer": "Bo", "why": "key tells max what to compare, here each person's age."}, {"q": "Where does the `if` go when transforming EVERY item with if/else?", "options": ["Before the for: [a if c else b for x in xs]", "After the for", "Either place", "You can't"], "answer": 0, "why": "A filter if goes at the end; an if/else choice goes at the front."}, {"type": "output", "q": "What does this print?", "code": "print(any(x < 0 for x in [3, -1, 4]), all(x > 0 for x in [3, -1]))", "answer": "True False", "why": "any: at least one is True; all: every one is True."}], "cards": [["Comprehension shape with a filter?", "`[expr for x in items if condition]`"], ["Sort people by age?", "`sorted(people, key=lambda p: p[\"age\"])`"], ["Sort by department, then highest salary?", "`key=lambda p: (p[\"dept\"], -p[\"salary\"])`"], ["Merge two dicts (right side wins)?", "`{**defaults, **overrides}`"], ["Flatten a list of lists?", "`[x for row in grid for x in row]`"], ["When NOT to use a comprehension?", "When it needs nested loops and conditions, or doesn't fit on 1-2 lines."]], "parsons": {"prompt": "Find the names of the three biggest expenses, biggest first.", "lin
