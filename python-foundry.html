tly\"\n    assert ex.fits_in_context([doc, doc, doc], 3000) is False\n    assert ex.fits_in_context([doc], 1500, reserve_for_answer=600) is False\n\n\ndef test_request_cost(ex):\n    assert ex.request_cost(1000, 500, 3.0, 15.0) == 0.0105\n    assert ex.request_cost(1_000_000, 0, 2.0, 10.0) == 2.0\n\n\ndef test_monthly_cost(ex):\n    got = ex.monthly_cost(200, 1500, 400, 3.0, 15.0)\n    assert got == 46.2, f\"200/day x 22 days x $0.0105 = $46.20, got {got!r}\"\n    assert ex.monthly_cost(10, 1000, 500, 3.0, 15.0, working_days=30) == 3.15\n\n\ndef test_cheapest_option(ex):\n    options = {\"large\": (4.0, 20.0), \"medium\": (2.0, 10.0), \"small\": (0.1, 0.5)}\n    assert ex.cheapest_option(options, 2000, 500) == \"small\"\n    assert ex.cheapest_option({\"a\": (1.0, 50.0), \"b\": (5.0, 5.0)}, 100, 1000) == \"b\", \"output tokens can dominate the cost\"\n", "solution": "\"\"\"Module A00 solutions.\"\"\"\n\nimport math\n\n\ndef estimate_tokens(text):\n    return math.ceil(len(text) / 4)\n\n\ndef words_to_tokens(word_count):\n    return math.ceil(word_count / 0.75)\n\n\ndef fits_in_context(texts, context_limit, reserve_for_answer=1000):\n    total = sum(estimate_tokens(t) for t in texts)\n    return total + reserve_for_answer <= context_limit\n\n\ndef request_cost(input_tokens, output_tokens, input_price_per_million, output_price_per_million):\n    cost = input_tokens / 1_000_000 * input_price_per_million + output_tokens / 1_000_000 * output_price_per_million\n    return round(cost, 6)\n\n\ndef monthly_cost(requests_per_day, input_tokens, output_tokens,\n                 input_price_per_million, output_price_per_million, working_days=22):\n    one = request_cost(input_tokens, output_tokens, input_price_per_million, output_price_per_million)\n    return round(one * requests_per_day * working_days, 2)\n\n\ndef cheapest_option(options, input_tokens, output_tokens):\n    return min(options, key=lambda name: request_cost(input_tokens, output_tokens, *options[name]))\n"}, "support": {}}, {"id": "A01", "slug": "A01_prompting", "track": "ai", "title": "Prompting Fundamentals", "goal": "write prompts that get useful, consistent, checkable results the first time, and know how to fix them when they don't.", "time": "3 hours.", "intro": "Prompting is the most valuable AI skill you can teach your team, and the one\nmost people never learn properly. It isn't about magic phrases. It's about\n**giving a capable newcomer everything they need to do the job well.**", "sections": [{"title": "The newcomer test", "md": "Before sending a prompt, ask: *if I handed this to a smart new hire on their\nfirst day, could they do a great job with only this text?*\n\nWeak:\n```text\nSummarize this data.\n```\n\nStrong:\n```text\nYou're helping a retail operations team prepare for their Monday meeting.\n\nBelow is last week's store-level sales extract (CSV). Summarize it for the\nregional director in 5 bullet points:\n- overall trend vs. the prior week\n- the 2 best and 2 worst stores, with the % change\n- anything unusual that needs follow-up\n\nKeep it under 120 words. Use plain language, no jargon. If the data has\nproblems (missing stores, odd values), say so instead of guessing.\n\n<data>\n...\n<\/data>\n```\n\nThe second prompt says **who it's for, what to do, what good looks like, and\nwhat to do when unsure.** That's the whole game."}, {"title": "The five building blocks", "md": "| Block | Question it answers | Example |\n|-------|---------------------|---------|\n| **Role / context** | Who is this for, and what's the situation? | \"You're supporting a finance team closing the month…\" |\n| **Task** | What exactly should be produced? | \"Write 3 user stories with acceptance criteria\" |\n| **Inputs** | What material should it use? | The data, document, notes: clearly marked |\n| **Format** | What shape should the answer take? | \"A table with columns X, Y, Z\" / \"JSON\" / \"≤5 bullets\" |\n| **Examples** | What does a great answer look like? | One or two worked examples |\n\nAdd **constraints** (length, tone, what not to do) and an **escape hatch**\n(\"if you're not sure, say so\"). The escape hatch is the single cheapest way\nto reduce made-up answers."}, {"title": "Separate instructions from data", "md": "When you paste data or documents, wrap them in clear markers so the model\nnever confuses *your instructions* with *the content*:\n\n```text\nClassify each customer comment below as Praise, Complaint, or Question.\n\n<comments>\n1. The new dashboard is so much faster!\n2. Why can't I export to Excel anymore?\n3. Third time this month the report failed.\n<\/comments>\n```\n\nXML-style tags (`<data>`, `<comments>`, `<document>`) work well with modern\nmodels and make prompts easy to template. This matters even more when you\nlater send *thousands* of rows through code (Module A07)."}, {"title": "Examples beat adjectives (\"few-shot\" prompting)", "md": "\"Write it in a concise, professional style\" means different things to\ndifferent people, and models. Showing beats telling:\n\n```text\nTurn each raw note into a one-line action item.\n\nExample:\nNote: \"Sam to check w/ finance re Q3 accruals before Fri??\"\nAction: Sam — confirm Q3 accruals with Finance — due Friday\n\nNow do these:\n...\n```\n\nOne to three examples usually do it. Make them **varied** (so it doesn't copy\none too literally) and **representative** of the tricky cases."}, {"title": "Ask for structure you can use", "md": "If the output is going into Excel, Alteryx or code, ask for a format a\nmachine can read:\n\n```text\nReturn ONLY a JSON array, one object per comment, with keys\n\"id\" (number), \"label\" (Praise|Complaint|Question), \"reason\" (≤12 words).\n```\n\nTables (Markdown or CSV) are great for humans; JSON is best for code. In\nA07 you'll see APIs that *guarantee* valid JSON."}, {"title": "Let it think, then answer", "md": "For analysis, ask the model to work through the problem before concluding:\n\n```text\nFirst, list the factors that could explain the drop in conversion.\nThen rank them by how well the data supports each one.\nFinally, give your single most likely explanation and what data would confirm it.\n```\n\nBreaking a task into explicit steps improves reasoning on harder problems and\nmakes the answer easier to check. Many current models also \"think\" internally\nbefore answering; you still get better results when you spell out the steps\nthat matter to *you*."}, {"title": "Iterate like an analyst", "md": "Prompting is iterative. When output is off, diagnose before rewriting:\n\n| Symptom | Likely fix |\n|---------|-----------|\n| Generic, bland answer | Add context: audience, purpose, constraints |\n| Wrong format | Show the exact format, or give an example |\n| Invents facts or numbers | Provide the source material; add \"only use the data provided; say if it's missing\" |\n| Inconsistent across runs | Tighter instructions, examples, fixed labels |\n| Too long | Give a hard limit (\"max 5 bullets, ≤15 words each\") |\n| Misses the point | State what *good* looks like and *why* you need it |\n\nKeep a **prompt library**: prompts that worked, saved with a note on when to\nuse them. As an ambassador, a shared team library is one of the highest-value\nthings you can create (Module A11)."}, {"title": "Templates: prompts as reusable assets", "md": "A prompt you use weekly should be a template with placeholders:\n\n```python\ntemplate = \"\"\"You're preparing a {audience} update.\nSummarize the {metric} results below in {n} bullets.\n<data>\n{data}\n<\/data>\"\"\"\n\nprompt = template.format(audience=\"leadership\", metric=\"churn\", n=3, data=\"...\")\nprint(prompt)\n```\n\nTemplates make results consistent across the team and let you run the same\nprompt over many inputs, the bridge from \"chatting with AI\" to \"AI in a\nworkflow\"."}, {"title": "Key takeaways", "md": "Pass the newcomer test: role, task, inputs, format, examples, plus an \"if unsure, say so\".\n- Wrap pasted data in tags; keep instructions separate.\n- Show examples instead of piling on adjectives.\n- Ask for structured output when it's going into a tool.\n- Iterate by diagnosing the symptom; save winners in a prompt library.\n\n**Continue reading:** [Prompt engineering overview](https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview) (Anthropic's Claude documentation). Clear, practical guidance on clarity, examples, XML tags, step-by-step reasoning and more, written by a model vendor and applicable to any assistant."}], "learn": {"big_idea": "Prompt like you're briefing a smart newcomer: role, task, inputs, format, examples, and 'if unsure, say so'.", "pretest": [0, 3], "quiz": [{"q": "Which addition most reduces made-up answers?", "options": ["'If the information is missing or you're unsure, say so.'", "'Be very accurate.'", "'You are the world's best analyst.'", "Using ALL CAPS"], "answer": 0, "why": "An explicit escape hatch gives the model permission not to guess."}, {"q": "Why wrap pasted data in tags like <data>…<\/data>?", "options": ["So the model doesn't confuse your instructions with the content", "Tags make the model faster", "It's required syntax", "To hide the data from the model"], "answer": 0, "why": "Clear separation prevents instructions and data from blurring, which is vital when templating."}, {"type": "output", "q": "What does this template produce?", "code": "t = 'Summarize {metric} for {audience}.'\nprint(t.format(metric='churn', audience='the CFO'))", "answer": "Summarize churn for the CFO.", "why": "str.format fills each {placeholder} by name, the basis of reusable prompt templates."}, {"q": "'Write it concisely and professionally' keeps giving inconsistent results. Best fix?", "options": ["Show one or two examples of the output you want", "Add more adjectives", "Repeat the instruction three times", "Use a bigger font"], "answer": 0, "why": "Examples beat adjectives. Few-shot examples define 'concise' far better than words do."}, {"q": "The output is going into Alteryx. What format should you ask for?", "options": ["Structured: CSV/table or JSON with named fields", "A friendly paragraph", "Bullet points with emojis", "Whatever the model prefers"], "answer": 0, "why": "Ask for machine-readable structure when a tool will consume it."}, {"q": "The model invents numbers in your summary. First thing to try?", "options": ["Provide the source data and say 'only use figures in the data; say if something is missing'", "Ask it to be more confident", "Shorten the prompt", "Switch off examples"], "answer": 0, "why": "Ground it in the data and forbid outside figures."}], "cards": [["The five building blocks of a strong prompt?", "Role/context, task, inputs, format, examples (+ constraints and an escape hatch)."], ["What is the 'newcomer test'?", "Could a smart new hire do a great job with only this prompt? If not, add what's missing."], ["What is few-shot prompting?", "Including a few worked examples of input → desired output in the prompt."], ["Why keep a team prompt library?", "Reuse what works, make results consistent, and onboard colleagues faster."], ["How do you turn a prompt into a reusable asset?", "Make it a template with {placeholders} for the parts that change."], ["Output too long: fix?", "Give a hard limit: 'max 5 bullets, ≤15 words each'."]], "parsons": {"prompt": "Assemble a grounded, structured prompt.", "lines": ["role = \"You're preparing a weekly update for the sales director.\"", "task = \"Summarize the data in 3 bullets, max 15 words each.\"", "guard = \"Only use figures in the data. If something is missing, say so.\"", "prompt = f\"{role}\\n\\n{task}\\n{guard}\\n\\n<data>\\n{csv_text}\\n<\/data>\""]}, "explain": "Take a prompt you used recently at work. Rewrite it using the five building blocks and explain what each addition fixes."}, "read": {"title": "Prompt engineering overview", "url": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview", "source": "Anthropic's Claude documentation", "why": "Clear, practical guidance on clarity, examples, XML tags, step-by-step reasoning and more, written by a model vendor and applicable to any assistant."}, "exercise": {"code": "\"\"\"\nModule A01 exercises: Prompts as code.   Run:  python check.py A1\n\nGood prompts become templates your whole team can reuse. Here you'll build the\nsmall toolkit that assembles them reliably.\n\"\"\"\n\n\ndef wrap_in_tags(tag, text):\n    # TODO: return \"<tag>\\n\" + text + \"\\n<\/tag>\"\n    # wrap_in_tags(\"data\", \"a,b\") -> \"<data>\\na,b\\n<\/data>\"\n    raise NotImplementedError\n\n\ndef few_shot_block(examples):\n    # TODO: examples is a list of (input, output) tuples. Return them as text:\n    # \"Example 1:\\nInput: <input>\\nOutput: <output>\\n\\nExample 2:\\n...\"\n    # Blocks are separated by ONE blank line; no trailing newline.\n    # Return \"\" for an empty list.\n    raise NotImplementedError\n\n\ndef build_prompt(role, task, data=None, output_format=None, examples=None, allow_unsure=True):\n    # TODO: assemble a prompt from parts, in this order, separated by blank lines\n    # (\"\\n\\n\"), skipping any part that is None or empty:\n    #   1. role\n    #   2. task\n    #   3. few_shot_block(examples)                     (if examples)\n    #   4. \"Format: \" + output_format                   (if output_format)\n    #   5. \"If the information needed is missing or you are unsure, say so instead of guessing.\"\n    #                                                   (if allow_unsure)\n    #   6. wrap_in_tags(\"data\", data)                   (if data)\n    raise NotImplementedError\n\n\ndef fill_template(template, values):\n    # TODO: replace {placeholders} in template with values from the dict.\n    # If a placeholder is missing from values, raise KeyError whose message\n    # names the missing placeholder.\n    # fill_template(\"Hi {name}\", {\"name\": \"Ada\"}) -> \"Hi Ada\"\n    # Hint: str.format(**values) already raises KeyError('name') - you can just use it.\n    raise NotImplementedError\n\n\ndef placeholders(template):\n    # TODO: return a SORTED list of unique placeholder names in a template.\n    # placeholders(\"{b} and {a} and {b}\") -> [\"a\", \"b\"]\n    # Hint: string.Formatter().parse(template) yields (text, field_name, spec, conversion).\n    raise NotImplementedError\n\n\ndef prompt_checklist(prompt):\n    # TODO: a quick \"newcomer test\". Return a list of missing elements, in this\n    # order, from these checks (case-insensitive):\n    #   \"audience\"  - none of: \"you're\", \"you are\", \"audience\", \" for \"\n    #   \"format\"    - none of: \"format\", \"bullet\", \"table\", \"json\", \"words\"\n    #   \"escape hatch\" - none of: \"unsure\", \"not sure\", \"say so\", \"don't know\"\n    # Return [] if nothing is missing.\n    raise NotImplementedError\n", "tests": "def test_wrap_in_tags(ex):\n    assert ex.wrap_in_tags(\"data\", \"a,b\") == \"<data>\\na,b\\n<\/data>\"\n\n\ndef test_few_shot_block(ex):\n    got = ex.few_shot_block([(\"hi\", \"Praise\"), (\"why??\", \"Question\")])\n    assert got == \"Example 1:\\nInput: hi\\nOutput: Praise\\n\\nExample 2:\\nInput: why??\\nOutput: Question\", f\"got {got!r}\"\n    assert ex.few_shot_block([]) == \"\"\n\n\ndef test_build_prompt_full(ex):\n    got = ex.build_prompt(\"You help finance.\", \"Summarize.\", data=\"x,y\", output_format=\"3 bullets\",\n                          examples=[(\"a\", \"b\")])\n    expected = (\"You help finance.\\n\\nSummarize.\\n\\nExample 1:\\nInput: a\\nOutput: b\\n\\nFormat: 3 bullets\\n\\n\"\n                \"If the information needed is missing or you are unsure, say so instead of guessing.\\n\\n<data>\\nx,y\\n<\/data>\")\n    assert got == expected, f\"got:\\n{got}\"\n\n\ndef test_build_prompt_minimal(ex):\n    assert ex.build_prompt(\"Role.\", \"Task.\", allow_unsure=False) == \"Role.\\n\\nTask.\", \"skip parts that are None/empty\"\n\n\ndef test_fill_template(ex):\n    assert ex.fill_template(\"Hi {name}, your {metric} is up\", {\"name\": \"Ada\", \"metric\": \"NPS\"}) == \"Hi Ada, your NPS is up\"\n    try:\n        ex.fill_template(\"Hi {name}\", {})\n    except KeyError as e:\n        assert \"name\" in str(e)\n    else:\n        raise AssertionError(\"a missing placeholder should raise KeyError\")\n\n\ndef test_placeholders(ex):\n    assert ex.placeholders(\"{b} and {a} and {b}\") == [\"a\", \"b\"]\n    assert ex.placeholders(\"no fields\") == []\n\n\ndef test_prompt_checklist(ex):\n    assert ex.prompt_checklist(\"Summarize this.\") == [\"audience\", \"format\", \"escape hatch\"]\n    good = \"You're helping sales. Give 3 bullets. If unsure, say so.\"\n    assert ex.prompt_checklist(good) == []\n    assert ex.prompt_checklist(\"Write a table for the CFO.\") == [\"escape hatch\"]\n", "solution": "\"\"\"Module A01 solutions.\"\"\"\n\nimport string\n\n\ndef wrap_in_tags(tag, text):\n    return f\"<{tag}>\\n{text}\\n<\/{tag}>\"\n\n\ndef few_shot_block(examples):\n    blocks = [f\"Example {i}:\\nInput: {inp}\\nOutput: {out}\" for i, (inp, out) in enumerate(examples, start=1)]\n    return \"\\n\\n\".join(blocks)\n\n\ndef build_prompt(role, task, data=None, output_format=None, examples=None, allow_unsure=True):\n    parts = [role, task]\n    if examples:\n        parts.append(few_shot_block(examples))\n    if output_format:\n        parts.append(\"Format: \" + output_format)\n    if allow_unsure:\n        parts.append(\"If the information needed is missing or you are unsure, say so instead of guessing.\")\n    if data:\n        parts.append(wrap_in_tags(\"data\", data))\n    return \"\\n\\n\".join(p for p in parts if p)\n\n\ndef fill_template(template, values):\n    return template.format(**values)\n\n\ndef placeholders(template):\n    names = {field for _, field, _, _ in string.Formatter().parse(template) if field}\n    return sorted(names)\n\n\ndef prompt_checklist(prompt):\n    p = prompt.lower()\n    checks = [\n        (\"audience\", [\"you're\", \"you are\", \"audience\", \" for \"]),\n        (\"format\", [\"format\", \"bullet\", \"table\", \"json\", \"words\"]),\n        (\"escape hatch\", [\"unsure\", \"not sure\", \"say so\", \"don't know\"]),\n    ]\n    return [name for name, cues in checks if not any(c in p for c in cues)]\n"}, "support": {}}, {"id": "A02", "slug": "A02_ai_tools_at_work", "track": "ai", "title": "AI Tools at Work", "goal": "know the landscape of AI tools, choose the right one for a task, and build a repeatable set of AI-assisted workflows for business analysis.", "time": "2–3 hours, plus a week of deliberately using AI for real tasks.", "intro": "The fastest way to become the person your team asks about AI is to be the\nperson who uses it well, every day, on real work. This module maps the tools\nand gives you workflows to start with tomorrow.", "sections": [{"title": "The tool landscape (by job, not by brand)", "md": "Products change every few months; the *categories* are stable.\n\n| Category | What it's for | Examples |\n|----------|---------------|----------|\n| **General chat assistants** | Thinking partner, writing, analysis of pasted or uploaded material | Claude, ChatGPT, Gemini, Microsoft Copilot |\n| **Copilots inside your apps** | AI where you already work: email, docs, spreadsheets, BI | Microsoft 365 Copilot, Google Workspace AI, AI features in Tableau/Power BI |\n| **AI in your analytics platform** | Explaining, documenting and building workflows | Alteryx's AI features (e.g. workflow summaries and an AI assistant; names and availability vary by version and licence) |\n| **Coding assistants** | Writing, explaining and fixing code; running code for you | Claude Code, GitHub Copilot, assistants with a code-execution / \"analysis\" mode |\n| **APIs** | Putting a model inside your own workflows and tools at scale | Anthropic, OpenAI, Google, Azure APIs (Module A07) |\n| **Agents** | Multi-step work where the AI uses tools: search, files, apps | Agent features in assistants; custom agents (Module A10) |\n\n**Your company's approved tools come first.** Before anything else, find out\nwhich tools are licensed and approved for which data (Module A03). Using an\nunapproved tool with company data is the fastest way to lose the trust an\nambassador needs."}, {"title": "Features that matter more than the brand", "md": "When comparing tools, look for:\n\n- **File uploads:** analyse a CSV, PDF, or slide deck directly.\n- **Code execution / data analysis:** the assistant writes *and runs* Python\n  on your file, so the maths is done by code, not guessed.\n- **Projects / custom instructions:** save context (team glossary, report\n  standards) so you don't repeat it in every chat.\n- **Connectors:** search your company's documents, email, tickets, or drive.\n- **Web search:** for recent information, with sources.\n- **Enterprise controls:** data retention, no training on your data, admin\n  settings, audit logs. This is what makes a tool safe for work data."}, {"title": "Ten workflows for a business analyst", "md": "Start with these. Each one saves real time within a week.\n\n| # | Workflow | Prompt starter |\n|---|----------|----------------|\n| 1 | **Requirements from notes** | \"Turn these stakeholder interview notes into user stories with acceptance criteria. Flag contradictions and open questions.\" |\n| 2 | **Meeting → actions** | \"From this transcript, list decisions, action items (owner, due date), and unresolved questions.\" |\n| 3 | **SQL / formula help** | \"Write a SQL query for [goal]. Tables: [schema]. Explain each step, and list assumptions.\" |\n| 4 | **Explain a workflow** | \"Here is the XML / tool list of an Alteryx workflow. Explain what it does, step by step, for a non-technical reader.\" |\n| 5 | **Data dictionary** | \"From these column names and sample rows, draft a data dictionary: name, description, type, example, caveats.\" |\n| 6 | **Exploratory analysis** | Upload a CSV to a code-execution tool: \"Profile this dataset: missing values, outliers, distributions, notable patterns. Show the code you ran.\" |\n| 7 | **Stakeholder writing** | \"Rewrite this analysis for a VP: 5 sentences, lead with the decision needed, no jargon.\" |\n| 8 | **Test cases** | \"List edge cases and test cases for this business rule: [rule].\" |\n| 9 | **Regex and text cleanup** | \"Write a regex that extracts order IDs like ORD-2024-00123 from free text. Give examples that should and shouldn't match.\" |\n| 10 | **Rubber-duck reviewer** | \"Here is my analysis plan. Act as a sceptical senior analyst: what's missing, what could mislead, what would you check first?\" |\n\nNotice the pattern: **context, task, format, and an invitation to flag problems.**\nThat's Module A01 in action."}, {"title": "Choosing the right tool for the task", "md": "```text\nIs the data confidential or regulated?\n├─ Yes → only approved enterprise tools; minimise and anonymise first (A03)\n└─ No / approved\n   ├─ Needs maths over a dataset? → code-execution / analysis mode, or Python/Alteryx\n   ├─ Lives in your email/docs/sheets? → the in-app copilot\n   ├─ Needs current information? → assistant with web search, check the sources\n   ├─ Same task, hundreds of rows? → API in a workflow (A07)\n   └─ Thinking, writing, explaining? → general assistant\n```"}, {"title": "Habits of AI super users", "md": "1. **Default to trying AI first** for any language-heavy task, then judge the result.\n2. **Give context once:** keep a reusable \"about my team\" note (glossary,\n   audience, standards) in a project or custom instructions.\n3. **Ask for its reasoning or code** when numbers are involved, and check it.\n4. **Iterate in the same conversation:** \"shorter\", \"more formal\", \"now as a table\".\n5. **Start fresh for a new task.** Long, wandering chats get worse; context matters.\n6. **Save what works** in your prompt library.\n7. **Track time saved.** You'll need numbers to make the case for AI (A11)."}, {"title": "Your one-week challenge", "md": "For five working days, use AI on at least **three real tasks a day**. For each, note:\n\n- the task and the tool,\n- minutes it would have taken vs. minutes it took,\n- quality (better / same / worse) and what you had to fix.\n\nAt the end of the week you'll have your first evidence log, your first\nprompt-library entries, and real stories to share with your team."}, {"title": "Key takeaways", "md": "Learn tools by category; brands change, jobs don't.\n- Approved enterprise tools and data rules come before anything else.\n- Code execution for maths, copilots for in-app work, APIs for scale.\n- Build daily habits and an evidence log of time saved.\n\n**Continue reading:** [One Useful Thing](https://www.oneusefulthing.org/) (Ethan Mollick, Wharton). The most practical, research-informed writing on using AI at work, with regular, concrete advice on what AI changes for knowledge workers and how organisations adopt it."}], "learn": {"big_idea": "Learn AI tools by the job they do. Use only approved tools, and build daily habits with evidence of time saved.", "pretest": [0, 2], "quiz": [{"q": "You need exact totals from a CSV using a chat assistant. Which feature matters most?", "options": ["Code execution / data analysis mode", "Image generation", "Voice mode", "A longer context window"], "answer": 0, "why": "With code execution the assistant computes with real code instead of guessing numbers."}, {"q": "What should you check before using an AI tool with company data?", "options": ["Whether it's approved for that data class (enterprise terms)", "Whether it's the most popular", "Whether it has dark mode", "Whether it's free"], "answer": 0, "why": "Approved tools and data rules come first. Consumer and enterprise terms can differ a lot."}, {"q": "You need to apply the same AI task to 3,000 rows. Best fit?", "options": ["An API call inside a workflow", "Pasting rows into a chat 50 at a time", "A coding agent", "An image model"], "answer": 0, "why": "Repeatable tasks at scale belong in a workflow calling the API (A07)."}, {"q": "A long chat is giving worse and worse answers. What should you do?", "options": ["Start a fresh conversation with a clean, complete prompt", "Keep going, it will recover", "Type in capitals", "Switch to a different language"], "answer": 0, "why": "Long wandering contexts degrade results. Start fresh for a new task."}, {"q": "Why log time saved during your first weeks of AI use?", "options": ["It becomes evidence for the business case and your ambassador stories", "AI tools require it", "To slow yourself down", "It improves the model"], "answer": 0, "why": "Measured savings persuade leaders; you'll need them in A11."}, {"q": "What are 'projects' or 'custom instructions' in assistants best used for?", "options": ["Saving reusable context like a team glossary and report standards", "Storing passwords", "Making answers longer", "Sharing customer data"], "answer": 0, "why": "They save you re-explaining context every time. Never store secrets there."}], "cards": [["Six categories of AI tools?", "Chat assistants, in-app copilots, analytics-platform AI, coding assistants, APIs, agents."], ["What do enterprise AI plans usually add?", "No training on your data, retention controls, SSO, admin and audit logs."], ["Tool for maths over a dataset?", "Code execution / analysis mode, or Python/Alteryx, not a plain chat answer."], ["Prompt starter: explain an Alteryx workflow", "'Here's the tool list and config. Explain step by step what it does for a non-technical reader.'"], ["The one-week challenge?", "Use AI on 3 real tasks a day for 5 days; log time before/after, quality, and fixes."], ["When should you start a new chat?", "For each new task, or when a long conversation drifts and degrades."]], "parsons": {"prompt": "Order the decision for choosing an AI tool.", "lines": ["1. Check the data class and approved tools", "2. Needs maths? Use code execution or Python/Alteryx", "3. Lives in email/docs? Use the in-app copilot", "4. Hundreds of rows? Use the API in a workflow", "5. Otherwise: general assistant, then verify"]}, "explain": "Describe three tasks from your own week that AI could speed up, the tool category you'd use for each, and how you'd check the result."}, "read": {"title": "One Useful Thing", "url": "https://www.oneusefulthing.org/", "source": "Ethan Mollick, Wharton", "why": "The most practical, research-informed writing on using AI at work, with regular, concrete advice on what AI changes for knowledge workers and how organisations adopt it."}, "support": {}}, {"id": "A03", "slug": "A03_responsible_ai", "track": "ai", "title": "Responsible AI & Data Governance", "goal": "use AI safely with company data, recognise the main risks, and set guardrails your team can follow.", "time": "3 hours.", "intro": "As an AI ambassador you're not just the person who knows the tricks. You're\nthe person people trust to tell them **what's safe**. This module makes you\nthat person.", "sections": [{"title": "The four risks to manage", "md": "| Risk | What goes wrong | Example |\n|------|-----------------|---------|\n| **Data exposure** | Confidential or personal data goes somewhere it shouldn't | Pasting a customer list into an unapproved chatbot |\n| **Inaccuracy** | Wrong output is trusted and acted on | A hallucinated figure ends up in a board deck |\n| **Bias & fairness** | Output treats groups unfairly | AI-screened CVs or credit decisions skewed by patterns in historic data |\n| **Accountability gaps** | Nobody owns the decision or can explain it | \"The AI decided\" with no human review or record |\n\nEach has a standard control: **approved tools and data minimisation**,\n**verification**, **testing for bias plus human review**, and **clear ownership\nand documentation**."}, {"title": "Know your data classes", "md": "Most companies classify data, something like:\n\n| Class | Examples | Typical AI rule |\n|-------|----------|-----------------|\n| Public | Published reports, marketing copy | Any tool |\n| Internal | Process docs, non-sensitive metrics | Approved tools |\n| Confidential | Financials, strategy, contracts | Approved enterprise tools only |\n| Restricted / personal | Customer PII, health, payment, HR data | Only specifically approved systems, often anonymised first |\n\nFind your company's actual policy and the list of approved tools. If there isn't\none, helping create it is a high-value ambassador project.\n\n### What \"enterprise\" plans usually add\nContractual commitments not to train on your data, retention controls, admin\nmanagement, single sign-on and audit logs. **Consumer and enterprise versions of\nthe same assistant can have very different data terms.** Check which one you're using."}, {"title": "Data minimisation: send less, get the same answer", "md": "You rarely need real personal data for AI to help. Before sharing:\n\n1. **Remove columns you don't need.** Asking about a formula? Send headers and 3 fake rows.\n2. **Redact identifiers:** names, emails, phone numbers, account numbers.\n3. **Pseudonymise consistently:** replace each customer with `CUST_001`,\n   `CUST_002`… so patterns survive but identities don't.\n4. **Aggregate:** send monthly totals by region, not transaction-level rows.\n5. **Describe instead of send:** a data profile (column names, types, ranges)\n   is often enough for AI to write the analysis code you then run locally.\n\nYou'll build a redaction and pseudonymisation toolkit in the exercises.\nRegex-based redaction is a helpful safety net, **not a guarantee**: it misses\nthings like names in free text. Combine it with judgement and approved tools.\n\n```python\nimport re\ntext = \"Contact jane.doe@example.com or 555-123-4567 about invoice 8812.\"\nprint(re.sub(r\"[\\w.+-]+@[\\w-]+\\.[\\w.]+\", \"[EMAIL]\", text))\n```"}, {"title": "Verification: trust, but verify", "md": "A simple rule your team can remember:\n\n> **The more it matters, the more you check.**\n\n| Stakes | Example | Check |\n|--------|---------|-------|\n| Low | Brainstorm, first draft of an email | Read it |\n| Medium | Internal analysis, documentation | Spot-check facts, test the code |\n| High | Numbers for leadership, customer-facing, legal, financial | Recompute independently; second reviewer; cite sources |\n\nPractical techniques:\n- Ask for **sources or the exact rows** behind a claim.\n- Have AI **write code** that computes the number, then run it yourself.\n- **Recompute key figures** in Alteryx or Python (Module A04 exercises).\n- Ask a second, fresh chat to **critique** the first answer."}, {"title": "Bias and fairness", "md": "LLMs learn from human text and historic data, which contain biases. Risk is\nhighest when AI influences decisions about **people**: hiring, lending,\npricing, performance, eligibility.\n\n- Don't use general assistants to make or rank decisions about individuals.\n- When classifying text at scale, **check error rates by segment** (region,\n  language, customer type). A model that's 95% accurate overall can be much\n  worse for one group.\n- Keep a human accountable for decisions, with the ability to override."}, {"title": "Regulation in one minute", "md": "Rules are evolving and vary by country and industry. Know that they exist:\n\n- **Privacy laws** (e.g. GDPR in the EU, state laws in the US) apply to personal\n  data whether or not AI is involved.\n- **The EU AI Act** sorts AI uses into risk tiers, with the strictest duties for\n  \"high-risk\" uses such as employment and credit decisions.\n- **Industry rules** (finance, healthcare, insurance) often add model-risk and\n  documentation requirements.\n- Frameworks like the **NIST AI Risk Management Framework** give organisations a\n  common structure: govern, map, measure, manage.\n\nYou don't need to be a lawyer. You need to know **when to involve** legal,\nprivacy and risk colleagues: early, whenever personal data or decisions about\npeople are involved."}, {"title": "A team guardrail card", "md": "A one-page card is one of the most useful things an ambassador can publish:\n\n```text\n✅ DO\n- Use approved tools: [list]\n- Remove or mask personal and confidential data before sharing\n- Verify numbers and facts before they leave the team\n- Say when content is AI-assisted where it matters\n- Save good prompts to the team library\n\n❌ DON'T\n- Paste customer, employee, or financial details into unapproved tools\n- Let AI make decisions about people\n- Present AI output as verified without checking it\n- Share credentials, API keys, or passwords with any AI tool\n\n❓ ASK [ambassador / privacy contact] when unsure\n```"}, {"title": "Key takeaways", "md": "Four risks: data exposure, inaccuracy, bias, accountability gaps, each with a control.\n- Know your data classes and approved tools; consumer and enterprise terms differ.\n- Minimise data: drop, redact, pseudonymise, aggregate, or just describe it.\n- The more it matters, the more you check. Keep humans accountable.\n\n**Continue reading:** [AI Risk Management Framework](https://www.nist.gov/itl/ai-risk-management-framework) (NIST). The widely used, vendor-neutral framework for governing AI risk, useful for structuring your team's guardrails and for speaking the same language as risk and compliance colleagues."}], "learn": {"big_idea": "Send less data, verify more as stakes rise, keep a human accountable, and use only approved tools.", "pretest": [0, 3], "quiz": [{"q": "You want help writing a formula on a customer table. What should you share?", "options": ["Column headers and a few fake rows", "The full table", "A screenshot of everything", "Nothing; never ask AI"], "answer": 0, "why": "Data minimisation: AI rarely needs the real data to help with structure or logic."}, {"q": "What does pseudonymisation do?", "options": ["Replaces identifiers with consistent codes so patterns survive but identities don't", "Deletes all data", "Encrypts the file", "Translates the data"], "answer": 0, "why": "CUST_001 stays CUST_001 everywhere, so analysis still works."}, {"type": "output", "q": "What does this print?", "code": "import re\nt = 'Email ann@x.com today'\nprint(re.sub(r'[\\w.+-]+@[\\w-]+\\.[\\w.]+', '[EMAIL]', t))", "answer": "Email [EMAIL] today", "why": "re.sub replaces every match of the email pattern."}, {"q": "Which use of AI carries the highest fairness risk?", "options": ["Ranking job applicants", "Drafting meeting notes", "Explaining a SQL query", "Formatting a table"], "answer": 0, "why": "Decisions about people are where bias does the most harm. Keep humans accountable."}, {"q": "'The more it matters, the more you check.' What check suits numbers in a board deck?", "options": ["Recompute independently and have a second reviewer", "Read it once", "Ask the AI if it's sure", "No check needed"], "answer": 0, "why": "High stakes mean independent recomputation and review."}, {"q": "What is regex-based redaction?", "options": ["A useful safety net that can miss things like names in free text", "A guarantee that all PII is removed", "Encryption", "A legal requirement"], "answer": 0, "why": "Combine it with judgement and approved tools; it's not a guarantee."}], "cards": [["The four AI risks?", "Data exposure, inaccuracy, bias/fairness, accountability gaps."], ["Five ways to minimise data before using AI?", "Drop columns, redact identifiers, pseudonymise, aggregate, or describe instead of send."], ["Verification rule of thumb?", "The more it matters, the more you check."], ["What is the NIST AI RMF?", "A vendor-neutral framework for managing AI risk: govern, map, measure, manage."], ["When to involve legal/privacy early?", "Whenever personal data or decisions about people are involved."], ["What goes on a team guardrail card?", "Approved tools, data rules, verification expectations, what not to do, who to ask."]], "parsons": {"prompt": "Minimise data before sharing a sample.", "lines": ["rows = drop_columns(rows, [\"name\", \"email\", \"phone\"])", "rows = pseudonymise(rows, \"customer_id\")", "sample = rows[:5]", "text = redact_pii(str(sample))", "assert safe_to_share(text, banned_terms)"]}, "explain": "Write the three rules you'd put on your team's AI guardrail card, and explain the risk each one prevents."}, "read": {"title": "AI Risk Management Framework", "url": "https://www.nist.gov/itl/ai-risk-management-framework", "source": "NIST", "why": "The widely used, vendor-neutral framework for governing AI risk, useful for structuring your team's guardrails and for speaking the same language as risk and compliance colleagues."}, "exercise": {"code": "\"\"\"\nModule A03 exercises: A data-minimisation toolkit.   Run:  python check.py A3\n\nBefore data goes anywhere near an AI tool, these functions strip or mask what\nthe AI doesn't need. (A safety net, not a guarantee: names in free text,\nfor example, need human judgement or specialised tools.)\n\"\"\"\n\nimport re\n\nEMAIL_RE = r\"[\\w.+-]+@[\\w-]+\\.[\\w.]+\"\nPHONE_RE = r\"\\(?\\b\\d{3}\\)?[-. ]?\\d{3}[-. ]\\d{4}\\b\"   # 555-123-4567, (555) 123-4567, 555.123.4567\n\n\ndef redact_emails(text):\n    # TODO: replace every email address with \"[EMAIL]\". Use EMAIL_RE and re.sub.\n    raise NotImplementedError\n\n\ndef redact_phones(text):\n    # TODO: replace every phone number with \"[PHONE]\". Use PHONE_RE.\n    raise NotImplementedError\n\n\ndef redact_pii(text, extra_terms=()):\n    # TODO: redact emails and phones, then replace each term in extra_terms\n    # (e.g. client names) with \"[REDACTED]\", case-insensitively.\n    # Hint: re.sub(re.escape(term), \"[REDACTED]\", text, flags=re.IGNORECASE)\n    raise NotImplementedError\n\n\ndef find_pii(text):\n    # TODO: return {\"emails\": <count>, \"phones\": <count>} found in text.\n    raise NotImplementedError\n\n\ndef pseudonymise(rows, column, prefix=\"CUST\"):\n    # TODO: rows is a list of dicts. Return a NEW list of NEW dicts where the\n    # value in `column` is replaced by a stable code: the first distinct value\n    # becomes f\"{prefix}_001\", the second f\"{prefix}_002\", and so on.\n    # The same original value must always get the same code.\n    # Don't modify the input rows.\n    raise NotImplementedError\n\n\ndef drop_columns(rows, columns):\n    # TODO: return new dicts without the listed columns (data minimisation).\n    raise NotImplementedError\n\n\ndef safe_to_share(text, banned_terms):\n    # TODO: return True only if the text contains no emails, no phones, and\n    # none of banned_terms (case-insensitive).\n    raise NotImplementedError\n", "tests": "TEXT = \"Contact jane.doe@example.com or (555) 123-4567; cc bob@corp.co.uk, 555.987.6543.\"\n\n\ndef test_redact_emails(ex):\n    assert ex.redact_emails(TEXT) == \"Contact [EMAIL] or (555) 123-4567; cc [EMAIL], 555.987.6543.\"\n\n\ndef test_redact_phones(ex):\n    got = ex.redact_phones(\"Call 555-123-4567 or (555) 123-4567 or 555.987.6543 re order 12345.\")\n    assert got == \"Call [PHONE] or [PHONE] or [PHONE] re order 12345.\", f\"got {got!r}\"\n\n\ndef test_redact_pii(ex):\n    got = ex.redact_pii(\"Acme Corp emailed a@b.com; ACME CORP wants a call at 555-111-2222.\", [\"acme corp\"])\n    assert got == \"[REDACTED] emailed [EMAIL]; [REDACTED] wants a call at [PHONE].\", f\"got {got!r}\"\n\n\ndef test_find_pii(ex):\n    assert ex.find_pii(TEXT) == {\"emails\": 2, \"phones\": 2}\n    assert ex.find_pii(\"nothing here\") == {\"emails\": 0, \"phones\": 0}\n\n\ndef test_pseudonymise(ex):\n    rows = [{\"customer\": \"Ann\", \"spend\": 10}, {\"customer\": \"Bo\", \"spend\": 5}, {\"customer\": \"Ann\", \"spend\": 7}]\n    got = ex.pseudonymise(rows, \"customer\")\n    assert [r[\"customer\"] for r in got] == [\"CUST_001\", \"CUST_002\", \"CUST_001\"]\n    assert [r[\"spend\"] for r in got] == [10, 5, 7]\n    assert rows[0][\"customer\"] == \"Ann\", \"don't modify the original rows\"\n    assert ex.pseudonymise(rows, \"customer\", prefix=\"C\")[1][\"customer\"] == \"C_002\"\n\n\ndef test_drop_columns(ex):\n    rows = [{\"name\": \"Ann\", \"email\": \"a@b.com\", \"spend\": 10}]\n    assert ex.drop_columns(rows, [\"name\", \"email\"]) == [{\"spend\": 10}]\n    assert \"email\" in rows[0], \"don't modify the original rows\"\n\n\ndef test_safe_to_share(ex):\n    assert ex.safe_to_share(\"Revenue up 4% in Q3\", [\"Project Falcon\"]) is True\n    assert ex.safe_to_share(\"Update on project falcon\", [\"Project Falcon\"]) is False\n    assert ex.safe_to_share(\"ping a@b.com\", []) is False\n", "solution": "\"\"\"Module A03 solutions.\"\"\"\n\nimport re\n\nEMAIL_RE = r\"[\\w.+-]+@[\\w-]+\\.[\\w.]+\"\nPHONE_RE = r\"\\(?\\b\\d{3}\\)?[-. ]?\\d{3}[-. ]\\d{4}\\b\"\n\n\ndef redact_emails(text):\n    return re.sub(EMAIL_RE, \"[EMAIL]\", text)\n\n\ndef redact_phones(text):\n    return re.sub(PHONE_RE, \"[PHONE]\", text)\n\n\ndef redact_pii(text, extra_terms=()):\n    text = redact_phones(redact_emails(text))\n    for term in extra_terms:\n        text = re.sub(re.escape(term), \"[REDACTED]\", text, flags=re.IGNORECASE)\n    return text\n\n\ndef find_pii(text):\n    return {\"emails\": len(re.findall(EMAIL_RE, text)), \"phones\": len(re.findall(PHONE_RE, text))}\n\n\ndef pseudonymise(rows, column, prefix=\"CUST\"):\n    codes = {}\n    out = []\n    for row in rows:\n        value = row[column]\n        if value not in codes:\n            codes[value] = f\"{prefix}_{len(codes) + 1:03d}\"\n        out.append({**row, column: codes[value]})\n    return out\n\n\ndef drop_columns(rows, columns):\n    return [{k: v for k, v in row.items() if k not in columns} for row in rows]\n\n\ndef safe_to_share(text, banned_terms):\n    found = find_pii(text)\n    if found[\"emails\"] or found[\"phones\"]:\n        return False\n    lower = text.lower()\n    return not any(term.lower() in lower for term in banned_terms)\n"}, "support": {}}, {"id": "A04", "slug": "A04_ai_assisted_analysis", "track": "ai", "title": "AI-Assisted Data Analysis", "goal": "use AI to speed up every stage of an analysis (framing, exploring, coding, explaining) while keeping the numbers trustworthy.", "time": "3–4 hours.", "intro": "AI doesn't replace analysis. It removes the slow parts: blank-page framing,\nsyntax lookups, first-pass exploration, and write-ups. The skill is knowing\n**which parts to hand over and how to check them.**", "sections": [{"title": "The analyst-in-the-loop pattern", "md": "```text\n  You                         AI                          Code (Python/Alteryx)\n  ─────────────────────────────────────────────────────────────────────────────\n  Frame the question   ──►  Suggest hypotheses, metrics, pitfalls\n  Describe the data    ──►  Propose an analysis plan + write the code\n                                                     ──►  Run on the real data\n  Check results        ◄──────────────────────────────────  Numbers you can trust\n  Interpret            ──►  Draft the narrative, charts, exec summary\n  Decide & sign off\n```\n\nThe key move: **AI writes the analysis; code computes the numbers; you\nverify and decide.** LLMs are unreliable calculators but excellent\nprogrammers. Let each do what it's good at."}, {"title": "Stage by stage", "md": "### Framing\n```text\nI'm analysing why repeat-purchase rate fell from 34% to 29% this quarter\nfor our online store. Suggest 8 hypotheses across product, pricing,\ncustomer mix, operations and measurement. For each: the data that would\ntest it and how I'd know it's the cause, not a coincidence.\n```\nAsking for \"measurement\" hypotheses catches the classic trap: the metric\nchanged because the *definition or tracking* changed.\n\n### Describing data without sending it\nYou often don't need to share the rows. Send a **profile**:\n\n```text\nColumns: order_id (str), customer_id (str), order_date (date, 2024-01..2024-12),\nregion (4 values: North/South/East/West), channel (web/app/store),\nrevenue (float, 0–4,800, 2% missing), discount_pct (0–40).\n~120k rows. One row per order.\n```\n\nWith that, AI can write a complete analysis script you run locally on the real\ndata, so nothing sensitive leaves your machine. You'll build a profiler in the\nexercises.\n\n### Exploring\nUpload non-sensitive data to an assistant with **code execution**, or ask for\ncode to run yourself:\n```text\nWrite Python (pandas) to: check missing values and duplicates, summarise\nrevenue by region and channel, and flag outliers using the IQR method.\nComment each step so a new analyst could follow it.\n```\n\n### Explaining results\n```text\nHere are the summary tables. Write a 150-word summary for the\noperations director: lead with the answer, give two supporting numbers,\none caveat, and a recommended next step. Don't add any number that isn't\nin the tables.\n```\nThat last sentence matters: it forbids inventing figures."}, {"title": "Verification techniques", "md": "| Technique | How |\n|-----------|-----|\n| **Recompute key numbers** | Totals, averages and growth rates in Python or Alteryx, never from the AI's prose |\n| **Reconcile to a source of truth** | Does the total match the finance report / dashboard? |\n| **Check row counts at each step** | Joins and filters silently drop or duplicate rows |\n| **Read the code** | Ask \"explain this line by line\"; watch for wrong filters, joins and date ranges |\n| **Sanity bounds** | Percentages between 0 and 100? Growth plausible? Units right? |\n| **Second opinion** | A fresh chat critiques the analysis: \"what could make this wrong?\" |\n\nIn the exercises you'll write `verify_claim`, which checks an AI's stated\ntotal against the real data within a tolerance: a tiny function with a big\nhabit behind it."}, {"title": "Common AI analysis mistakes to watch for", "md": "**Averaging averages** (e.g. averaging regional conversion rates instead of\n  recomputing from totals).\n- **Simpson's paradox:** a trend that reverses when you split by segment.\n- **Correlation stated as causation.**\n- **Wrong date windows** or time zones.\n- **Silently dropped rows** from missing values or join mismatches.\n- **Confident precision:** \"revenue grew 12.37%\" from a rough eyeball.\n\nWhen you spot one, add a line to your prompt template to prevent it next time."}, {"title": "Working with plain Python data (preview of A05)", "md": "Before pandas, it helps to see analysis as simple operations on rows. Each row\nis a dict, like a record in an Alteryx stream:\n\n```python\nrows = [\n    {\"region\": \"North\", \"revenue\": 120.0},\n    {\"region\": \"South\", \"revenue\": 80.0},\n    {\"region\": \"North\", \"revenue\": 50.0},\n]\ntotals = {}\nfor r in rows:\n    totals[r[\"region\"]] = totals.get(r[\"region\"], 0) + r[\"revenue\"]\nprint(totals)   # {'North': 170.0, 'South': 80.0}\n```\n\nThat's a Summarize tool, grouped by region, summing revenue: three lines of\nPython."}, {"title": "Key takeaways", "md": "AI writes and explains; code computes; you verify and decide.\n- Share a data profile instead of the data whenever you can.\n- Forbid invented numbers (\"only use figures in the tables\").\n- Recompute, reconcile, and check row counts: every time it matters.\n\n**Continue reading:** [Reduce hallucinations](https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations) (Anthropic's Claude documentation). Concrete techniques for keeping AI answers grounded: letting the model say \"I don't know\", requiring quotes from source material, and verifying claims."}], "learn": {"big_idea": "AI writes and explains, code computes, you verify and decide. Never take a number from AI prose.", "pretest": [0, 2], "quiz": [{"type": "output", "q": "Average-of-averages trap: what's the TRUE combined conversion rate (%)?", "code": "visits = [100, 300]\norders = [10, 6]\nprint(round(sum(orders) / sum(visits) * 100, 1))", "answer": "4.0", "why": "16 orders / 400 visits = 4.0%. Averaging the 10% and 2% rates would wrongly give 6%."}, {"q": "How can you get AI to write analysis code without sending the data?", "options": ["Share a data profile: columns, types, ranges, row count", "Send a random 50% of rows", "Describe the result you want to see", "It's impossible"], "answer": 0, "why": "A profile is usually enough for correct code, which you then run locally."}, {"q": "Which sentence belongs in a prompt asking AI to write an executive summary from your tables?", "options": ["'Don't add any number that isn't in the tables.'", "'Feel free to estimate missing figures.'", "'Round everything to the nearest million.'", "'Be creative with the numbers.'"], "answer": 0, "why": "It forbids invented figures."}, {"q": "After a join, revenue doubled unexpectedly. Most likely cause?", "options": ["Duplicate keys multiplied rows", "The AI was optimistic", "Rounding", "A slow computer"], "answer": 0, "why": "Always check row counts after joins."}, {"type": "output", "q": "What does this print?", "code": "old, new = 80, 100\nprint(round((new - old) / old * 100, 1))", "answer": "25.0", "why": "Percent change = (new − old) / old × 100."}, {"q": "A trend reverses when you split by segment. What's this called?", "options": ["Simpson's paradox", "Hallucination", "Overfitting", "Regression to the mean"], "answer": 0, "why": "Always check whether an aggregate trend holds within segments."}], "cards": [["The analyst-in-the-loop pattern?", "You frame → AI proposes plan and code → code computes → you verify → AI drafts narrative → you decide."], ["Name four verification techniques.", "Recompute, reconcile to a source of truth, check row counts, read the code (plus sanity bounds, second opinion)."], ["What is a data profile?", "A description of a dataset (columns, types, ranges, missing values) without the actual rows."], ["Average of averages: why wrong?", "Groups have different sizes; recompute rates from summed totals."], ["Prompt add-on for self-checking code?", "'Print the row count and total after every step.'"], ["Correlation vs causation reminder?", "Ask AI for hypotheses AND the data that would confirm a causal link."]], "parsons": {"prompt": "Verify an AI's claimed total before using it.", "lines": ["actual = sum(r[\"revenue\"] for r in rows if r[\"revenue\"] is not None)", "claimed = 260.0", "diff_pct = abs(claimed - actual) / actual * 100", "if diff_pct > 0.5:", "    print(f\"Reject: AI is off by {diff_pct:.1f}%\")"]}, "explain": "Describe an analysis you did recently. Where could AI have helped, and how would you have verified each AI contribution?"}, "read": {"title": "Reduce hallucinations", "url": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations", "source": "Anthropic's Claude documentation", "why": "Concrete techniques for keeping AI answers grounded: letting the model say \"I don't know\", requiring quotes from source material, and verifying claims."}, "exercise": {"code": "\"\"\"\nModule A04 exercises: Analysis you can verify.   Run:  python check.py A4\n\nData arrives as a list of dicts (one dict per row), the plain-Python version\nof a table. These helpers compute the numbers AI must never be trusted to\ncalculate in its head, and profile data so you can describe it instead of\nsending it.\n\"\"\"\n\n\ndef column(rows, name):\n    # TODO: return a list of the values in column `name`, skipping None.\n    raise NotImplementedError\n\n\ndef summarize(rows, name):\n    # TODO: return {\"count\", \"sum\", \"mean\", \"min\", \"max\"} for the numeric column\n    # (ignoring None). Round sum and mean to 2 decimals.\n    # For an empty column return {\"count\": 0, \"sum\": 0, \"mean\": None, \"min\": None, \"max\": None}\n    raise NotImplementedError\n\n\ndef group_sum(rows, by, value):\n    # TODO: return {group: total of value}, rounded to 2 decimals, groups in\n    # first-seen order. Skip rows where value is None.\n    raise NotImplementedError\n\n\ndef percent_change(old, new):\n    # TODO: return the % change from old to new, rounded to 1 decimal.\n    # percent_change(80, 100) -> 25.0 ; return None if old is 0.\n    raise NotImplementedError\n\n\ndef verify_claim(rows, value, claimed_total, tolerance_pct=0.5):\n    # TODO: an AI says the total of `value` is claimed_total. Return True if\n    # the real total is within tolerance_pct percent of the claim.\n    # (If the real total is 0, the claim must be exactly 0.)\n    raise NotImplementedError\n\n\ndef conversion_rate(rows, group, visits=\"visits\", orders=\"orders\"):\n    # TODO: return {group: orders / visits * 100, rounded to 1 decimal},\n    # computed from the SUMMED visits and orders of each group, NOT by averaging\n    # each row's rate (the classic \"average of averages\" mistake).\n    raise NotImplementedError\n\n\ndef profile(rows):\n    # TODO: describe a dataset WITHOUT revealing it. Return one line per column,\n    # in the order columns appear in the first row, joined with \"\\n\":\n    #   \"<name> (<type>): <n_distinct> distinct, <n_missing> missing\"\n    # <type> is \"number\" if every non-None value is an int or float, else \"text\".\n    # (bool counts as text here, keep it simple.)\n    raise NotImplementedError\n", "tests": "ROWS = [\n    {\"region\": \"North\", \"revenue\": 120.0, \"visits\": 100, \"orders\": 10},\n    {\"region\": \"South\", \"revenue\": 80.5, \"visits\": 50, \"orders\": 10},\n    {\"region\": \"North\", \"revenue\": None, \"visits\": 300, \"orders\": 6},\n    {\"region\": \"East\", \"revenue\": 50.0, \"visits\": 10, \"orders\": 5},\n]\n\n\ndef test_column(ex):\n    assert ex.column(ROWS, \"revenue\") == [120.0, 80.5, 50.0]\n    assert ex.column(ROWS, \"region\") == [\"North\", \"South\", \"North\", \"East\"]\n\n\ndef test_summarize(ex):\n    got = ex.summarize(ROWS, \"revenue\")\n    assert got == {\"count\": 3, \"sum\": 250.5, \"mean\": 83.5, \"min\": 50.0, \"max\": 120.0}, f\"got {got!r}\"\n    assert ex.summarize([], \"revenue\") == {\"count\": 0, \"sum\": 0, \"mean\": None, \"min\": None, \"max\": None}\n\n\ndef test_group_sum(ex):\n    assert ex.group_sum(ROWS, \"region\", \"revenue\") == {\"North\": 120.0, \"South\": 80.5, \"East\": 50.0}\n    assert list(ex.group_sum(ROWS, \"region\", \"visits\")) == [\"North\", \"South\", \"East\"], \"keep first-seen order\"\n\n\ndef test_percent_change(ex):\n    assert ex.percent_change(80, 100) == 25.0\n    assert ex.percent_change(200, 150) == -25.0\n    assert ex.percent_change(0, 10) is None\n\n\ndef test_verify_claim(ex):\n    assert ex.verify_claim(ROWS, \"revenue\", 250.5) is True\n    assert ex.verify_claim(ROWS, \"revenue\", 251.0) is True, \"0.2% off is inside the default 0.5% tolerance\"\n    assert ex.verify_claim(ROWS, \"revenue\", 260.0) is False, \"an AI's 260 is ~3.8% off: reject it\"\n    assert ex.verify_claim([{\"revenue\": 0}], \"revenue\", 0) is True\n\n\ndef test_conversion_rate(ex):\n    got = ex.conversion_rate(ROWS, \"region\")\n    assert got == {\"North\": 4.0, \"South\": 20.0, \"East\": 50.0}, (\n        f\"got {got!r}. North is (10+6)/(100+300) = 4.0%, not the average of 10% and 2% (6%)\")\n\n\ndef test_profile(ex):\n    got = ex.profile(ROWS).split(\"\\n\")\n    assert got[0] == \"region (text): 3 distinct, 0 missing\", got[0]\n    assert got[1] == \"revenue (number): 3 distinct, 1 missing\", got[1]\n    assert len(got) == 4\n", "solution": "\"\"\"Module A04 solutions.\"\"\"\n\n\ndef column(rows, name):\n    return [r[name] for r in rows if r.get(name) is not None]\n\n\ndef summarize(rows, name):\n    values = column(rows, name)\n    if not values:\n        return {\"count\": 0, \"sum\": 0, \"mean\": None, \"min\": None, \"max\": None}\n    total = sum(values)\n    return {\"count\": len(values), \"sum\": round(total, 2), \"mean\": round(total / len(values), 2),\n            \"min\": min(values), \"max\": max(values)}\n\n\ndef group_sum(rows, by, value):\n    totals = {}\n    for r in rows:\n        if r.get(value) is None:\n            continue\n        totals[r[by]] = totals.get(r[by], 0) + r[value]\n    return {k: round(v, 2) for k, v in totals.items()}\n\n\ndef percent_change(old, new):\n    if old == 0:\n        return None\n    return round((new - old) / old * 100, 1)\n\n\ndef verify_claim(rows, value, claimed_total, tolerance_pct=0.5):\n    actual = sum(column(rows, value))\n    if actual == 0:\n        return claimed_total == 0\n    return abs(claimed_total - actual) / abs(actual) * 100 <= tolerance_pct\n\n\ndef conversion_rate(rows, group, visits=\"visits\", orders=\"orders\"):\n    v, o = {}, {}\n    for r in rows:\n        g = r[group]\n        v[g] = v.get(g, 0) + r[visits]\n        o[g] = o.get(g, 0) + r[orders]\n    return {g: round(o[g] / v[g] * 100, 1) for g in v}\n\n\ndef profile(rows):\n    lines = []\n    for name in rows[0]:\n        values = [r.get(name) for r in rows]\n        present = [x for x in values if x is not None]\n        is_number = bool(present) and all(isinstance(x, (int, float)) and not isinstance(x, bool) for x in present)\n        lines.append(f\"{name} ({'number' if is_number else 'text'}): \"\n                     f\"{len(set(present))} distinct, {len(values) - len(present)} missing\")\n    return \"\\n\".join(lines)\n"}, "support": {}}, {"id": "A05", "slug": "A05_alteryx_to_python", "track": "ai", "title": "From Alteryx to Python", "goal": "translate the Alteryx tools you use every day into Python, so you can read, write and AI-generate Python with confidence, and combine both in one workflow.", "time": "4 hours.", "intro": "You already think like a programmer. Every Alteryx workflow is a program:\ndata flows through tools that select, filter, compute, join and summarise.\nPython does the same things with text instead of icons. This module is the\ntranslation dictionary.", "sections": [{"title": "Why a BA who knows Alteryx should learn Python", "md": "**AI writes Python fluently.** Ask an assistant for an Alteryx workflow and\n  it can only describe one. Ask for Python and you get something you can run.\n- **The Python tool** inside Alteryx Designer lets you drop Python into an\n  existing workflow, so you don't have to choose.\n- **Calling AI APIs** (A07), text analytics (A08) and document search (A09) are\n  natural in Python.\n- **Career range:** \"Alteryx + Python + AI\" is a much rarer and more valuable\n  combination than any one alone.\n\nAlteryx stays great for visual, auditable, shareable workflows. Python adds\nreach. The best analysts use both."}, {"title": "The mental model: rows and fields", "md": "In Alteryx, records flow through tools. In plain Python, a table is a\n**list of dicts**: one dict per record, one key per field:\n\n```python\norders = [\n    {\"order_id\": 1, \"region\": \"North\", \"amount\": 120.0},\n    {\"order_id\": 2, \"region\": \"South\", \"amount\": 80.0},\n    {\"order_id\": 3, \"region\": \"North\", \"amount\": 45.5},\n]\n```\n\nIn real projects you'll use **pandas DataFrames** (Module A06), which do all of\nthis in one line each. Writing the tools by hand first (in this module's\nexercises) means you'll understand exactly what pandas and AI-generated code\nare doing, and be able to check them."}, {"title": "The translation dictionary", "md": "| Alteryx tool | What it does | Plain Python | pandas (Module A06) |\n|--------------|--------------|--------------|---------------------|\n| **Input Data** | Read a file | `csv.DictReader` | `pd.read_csv(\"f.csv\")` |\n| **Select** | Keep / rename / drop fields | dict comprehension | `df[[\"a\",\"b\"]].rename(columns={...})` |\n| **Filter** (T/F) | Split rows by a condition | two list comprehensions | `df[df.amount > 100]` |\n| **Formula** | New or updated field | `row[\"x\"] = ...` in a loop | `df[\"x\"] = df.a * df.b` |\n| **Sort** | Order rows | `sorted(rows, key=...)` | `df.sort_values(\"a\")` |\n| **Unique** (U/D) | First of each key / duplicates | track seen keys in a set | `df.drop_duplicates(\"key\")` |\n| **Join** (J/L/R) | Match two inputs on a key | dict lookup | `pd.merge(a, b, on=\"key\", how=...)` |\n| **Union** | Stack inputs | `a + b` | `pd.concat([a, b])` |\n| **Summarize** | Group by + aggregate | dict accumulators | `df.groupby(\"g\").agg(...)` |\n| **Cross Tab** | Rows → columns (pivot) | nested dicts | `df.pivot_table(...)` |\n| **Transpose** | Columns → rows | loop over keys | `df.melt(...)` |\n| **Multi-Row Formula** | Use the previous row | loop that remembers the previous row | `df[\"prev\"] = df.a.shift(1)` |\n| **Sample** | First N / random N | slicing, `random.sample` | `df.head(n)`, `df.sample(n)` |\n| **Output Data** | Write a file | `csv.DictWriter` | `df.to_csv(\"out.csv\", index=False)` |"}, {"title": "Alteryx's multiple outputs, in Python", "md": "Some Alteryx tools have several output anchors. In Python, a function can\n**return several values**:\n\n```python\ndef filter_rows(rows, condition):\n    true_rows = [r for r in rows if condition(r)]\n    false_rows = [r for r in rows if not condition(r)]\n    return true_rows, false_rows          # T and F anchors\n\nbig, small = filter_rows(orders, lambda r: r[\"amount\"] > 100)\nprint(len(big), len(small))\n```\n\nThe Join tool's **J, L, R** anchors (matched, left-only, right-only) work the\nsame way; you'll build it in the exercises. Checking the L and R outputs is\nas important in Python as in Alteryx: unmatched rows are where data-quality\nproblems hide."}, {"title": "Formula and Multi-Row Formula", "md": "```python\n# Formula: margin = (price - cost) / price\nfor row in products:\n    row[\"margin\"] = round((row[\"price\"] - row[\"cost\"]) / row[\"price\"], 3)\n\n# Multi-Row Formula: running total, and change vs previous row\nrunning = 0\nprevious = None\nfor row in monthly:\n    running += row[\"sales\"]\n    row[\"running_total\"] = running\n    row[\"change\"] = None if previous is None else row[\"sales\"] - previous[\"sales\"]\n    previous = row\n```\n\n`lambda r: ...` (Module 11 of the Python track) is the Python version of the\nexpression box in a Formula or Filter tool."}, {"title": "Summarize and Cross Tab", "md": "```python\n# Summarize: group by region, Sum(amount), Count\nsummary = {}\nfor r in orders:\n    s = summary.setdefault(r[\"region\"], {\"region\": r[\"region\"], \"Sum_amount\": 0, \"Count\": 0})\n    s[\"Sum_amount\"] += r[\"amount\"]\n    s[\"Count\"] += 1\nprint(list(summary.values()))\n```\n\nCross Tab is \"group by two things and spread one of them across columns\".\nYou'll write it in the exercises, then see the one-line pandas version in A06."}, {"title": "Python inside Alteryx: the Python tool", "md": "The Python tool (Developer category) runs Python as a step in your workflow.\nData comes in from the input anchor as a **pandas DataFrame**, and you send\nDataFrames to output anchors:\n\n```python\nfrom ayx import Alteryx\n\ndf = Alteryx.read(\"#1\")                          # input anchor 1 → DataFrame\ndf[\"is_large\"] = df[\"amount\"] > 1000             # any Python / pandas logic\nAlteryx.write(df, 1)                             # → output anchor 1\n```\n\nGood uses: an API call per row (AI classification!), advanced text processing,\na statistics or ML library Alteryx doesn't have, or reusing a script a\ncolleague wrote. Check your Designer version's documentation for setup details\nand package management."}, {"title": "Using AI to translate workflows", "md": "A powerful ambassador demo:\n\n```text\nHere's the list of tools in my Alteryx workflow, in order, with their\nconfiguration:\n1. Input: sales.csv\n2. Filter: [Region] != \"Test\"\n3. Formula: Margin = ([Price]-[Cost])/[Price]\n4. Join to products.csv on ProductID (keep J and L outputs)\n5. Summarize: group by Category, Sum(Revenue), Avg(Margin)\n6. Output: summary.xlsx\n\nWrite equivalent Python using pandas. Comment each block with the\nAlteryx tool it replaces. Print row counts after each step so I can\ncompare them with the Alteryx results.\n```\n\nThen **run both and compare row counts and totals**. That's how you build\ntrust in the translation, and in AI-generated code generally."}, {"title": "Key takeaways", "md": "An Alteryx workflow is a program; a table is a list of dicts (or a DataFrame).\n- Multiple output anchors → functions that return several values.\n- Formula ≈ a computed key; Multi-Row ≈ a loop that remembers the previous row; Summarize ≈ dict accumulators.\n- The Python tool (`Alteryx.read` / `Alteryx.write`) lets you mix both worlds.\n\n**Continue reading:** [Python Tool](https://help.alteryx.com/current/en/designer/tools/developer/python-tool.html) (Alteryx Designer documentation). How to use Python inside your workflows, including reading and writing data with the `ayx` package and managing packages."}], "learn": {"big_idea": "An Alteryx workflow is a program: tables are lists of dicts (or DataFrames), and every tool has a Python equivalent.", "pretest": [0, 1], "quiz": [{"q": "The Alteryx Join tool's L output corresponds to…", "options": ["Left rows with no match in the right input", "All left rows", "Rows that matched", "Right rows with no match"], "answer": 0, "why": "J = matched, L = left-only, R = right-only. Unmatched rows are where data issues hide."}, {"type": "output", "q": "A Filter tool in Python: how many rows go to the T anchor?", "code": "rows = [{'amt': 120}, {'amt': 80}, {'amt': 300}]\ntrue_rows = [r for r in rows if r['amt'] > 100]\nprint(len(true_rows))", "answer": "2", "why": "120 and 300 are > 100."}, {"type": "output", "q": "A Summarize tool (group by region, sum amount): what prints?", "code": "rows = [('N', 10), ('S', 5), ('N', 7)]\ntotals = {}\nfor region, amt in rows:\n    totals[region] = totals.get(region, 0) + amt\nprint(totals)", "answer": "{'N': 17, 'S': 5}", "why": "The accumulator pattern is a Summarize tool in three lines."}, {"q": "Which Python idea matches Alteryx's Multi-Row Formula?", "options": ["A loop that remembers the previous row", "A dict lookup", "A set", "An if statement"], "answer": 0, "why": "Multi-Row needs the previous record, so you carry it forward in the loop."}, {"q": "In the Alteryx Python tool, how does data come in?", "options": ["Alteryx.read(\"#1\") returns a pandas DataFrame", "As a CSV string", "Through input()", "It can't"], "answer": 0, "why": "from ayx import Alteryx; df = Alteryx.read('#1'); … Alteryx.write(df, 1)."}, {"q": "How do you build trust in an AI's Alteryx-to-Python translation?", "options": ["Run both and compare row counts and totals at each step", "Trust it if it looks tidy", "Ask the AI if it's correct", "Count the lines of code"], "answer": 0, "why": "Reconciliation is the analyst's proof."}], "cards": [["Alteryx Filter in Python?", "Two list comprehensions → (true_rows, false_rows), i.e. the T and F anchors."], ["Alteryx Formula in Python?", "Set a computed key on each row: {**row, 'margin': ...}"], ["Alteryx Join anchors J/L/R?", "J = matched rows merged; L = left-only; R = right-only."], ["Alteryx Unique in Python?", "Track seen keys in a set; first occurrence → U, repeats → D."], ["Alteryx Union in Python?", "Concatenate lists: a + b (pandas: pd.concat)."], ["Python tool read/write?", "df = Alteryx.read('#1'); Alteryx.write(df, 1)"]], "parsons": {"prompt": "A Python tool step inside an Alteryx workflow.", "lines": ["from ayx import Alteryx", "df = Alteryx.read(\"#1\")", "df[\"margin\"] = (df[\"price\"] - df[\"cost\"]) / df[\"price\"]", "df[\"is_large\"] = df[\"amount\"] > 1000", "Alteryx.write(df, 1)"]}, "explain": "Pick an Alteryx workflow you use often. Describe, tool by tool, what the Python version would look like."}, "read": {"title": "Python Tool", "url": "https://help.alteryx.com/current/en/designer/tools/developer/python-tool.html", "source": "Alteryx Designer documentation", "why": "How to use Python inside your workflows, including reading and writing data with the `ayx` package and managing packages."}, "exercise": {"code": "\"\"\"\nModule A05 exercises: Build the Alteryx toolbox in Python.   Run:  python check.py A5\n\nEach function is one Alteryx tool. Tables are lists of dicts. Every tool must\nreturn NEW rows and never modify its input (just like Alteryx never changes\nthe upstream data). Tip: {**row} copies a dict.\n\"\"\"\n\n\ndef select(rows, fields, rename=None):\n    # SELECT tool: keep only `fields` (in that order), optionally renaming some.\n    # rename is a dict {old_name: new_name}.\n    # select([{\"a\":1,\"b\":2,\"c\":3}], [\"c\",\"a\"], {\"a\":\"A\"}) -> [{\"c\":3, \"A\":1}]\n    raise NotImplementedError\n\n\ndef filter_rows(rows, condition):\n    # FILTER tool: return (true_rows, false_rows) - the T and F anchors.\n    # condition is a function: row -> bool\n    raise NotImplementedError\n\n\ndef formula(rows, field, expression):\n    # FORMULA tool: return new rows with `field` set to expression(row).\n    raise NotImplementedError\n\n\ndef unique(rows, keys):\n    # UNIQUE tool: return (unique_rows, duplicate_rows). A row is a duplicate if\n    # the combination of values in `keys` (a list of field names) was already seen.\n    # The first occurrence goes to unique_rows.\n    raise NotImplementedError\n\n\ndef join(left, right, key):\n    # JOIN tool: return (J, L, R)\n    #   J: for each left row with a matching right row, a merged dict\n    #      (right's fields are added; if a field name exists in both, prefix the\n    #      right one with \"Right_\", except the key itself which appears once).\n    #      If several right rows match, produce one J row per match.\n    #   L: left rows with no match.   R: right rows with no match.\n    raise NotImplementedError\n\n\ndef union(*tables):\n    # UNION tool: stack all tables into one new list (copies of the rows).\n    raise NotImplementedError\n\n\ndef summarize(rows, group_by, field, action):\n    # SUMMARIZE tool: group by one field and aggregate `field`.\n    # action is one of \"sum\", \"count\", \"avg\", \"min\", \"max\".\n    # Return a list of dicts like {group_by: <group>, \"<Action>_<field>\": value}\n    # e.g. {\"region\": \"North\", \"Sum_amount\": 165.5}. Action is capitalised.\n    # Groups in first-seen order. Round avg to 2 decimals.\n    raise NotImplementedError\n\n\ndef multi_row(rows, field, expression):\n    # MULTI-ROW FORMULA tool: new rows with field = expression(previous_row, row),\n    # where previous_row is the previous NEW row (already holding its computed\n    # field), or None for the first row.\n    # Running total: multi_row(rows, \"rt\", lambda prev, r: r[\"x\"] + (prev[\"rt\"] if prev else 0))\n    raise NotImplementedError\n\n\ndef cross_tab(rows, group_field, header_field, value_field):\n    # CROSS TAB tool (sum): one output row per group_field value, with one column\n    # per distinct header_field value holding the summed value_field.\n    # Missing combinations get 0. Groups and headers in first-seen order.\n    # cross_tab(sales, \"region\", \"quarter\", \"amount\") ->\n    #   [{\"region\": \"North\", \"Q1\": 100, \"Q2\": 50}, {\"region\": \"South\", \"Q1\": 0, \"Q2\": 70}]\n    raise NotImplementedError\n", "tests": "ORDERS = [\n    {\"order_id\": 1, \"region\": \"North\", \"amount\": 120.0, \"product_id\": \"P1\"},\n    {\"order_id\": 2, \"region\": \"South\", \"amount\": 80.0, \"product_id\": \"P2\"},\n    {\"order_id\": 3, \"region\": \"North\", \"amount\": 45.5, \"product_id\": \"P9\"},\n]\nPRODUCTS = [\n    {\"product_id\": \"P1\", \"name\": \"Widget\", \"region\": \"Global\"},\n    {\"product_id\": \"P2\", \"name\": \"Gadget\", \"region\": \"Global\"},\n    {\"product_id\": \"P3\", \"name\": \"Doohickey\", \"region\": \"Global\"},\n]\n\n\ndef _snapshot(rows):\n    return [dict(r) for r in rows]\n\n\ndef test_select(ex):\n    got = ex.select([{\"a\": 1, \"b\": 2, \"c\": 3}], [\"c\", \"a\"], {\"a\": \"A\"})\n    assert got == [{\"c\": 3, \"A\": 1}] and list(got[0]) == [\"c\", \"A\"], f\"got {got!r}\"\n    assert ex.select([{\"a\": 1, \"b\": 2}], [\"b\"]) == [{\"b\": 2}]\n\n\ndef test_filter_rows(ex):\n    before = _snapshot(ORDERS)\n    t, f = ex.filter_rows(ORDERS, lambda r: r[\"amount\"] > 100)\n    assert [r[\"order_id\"] for r in t] == [1] and [r[\"order_id\"] for r in f] == [2, 3]\n    assert ORDERS == before\n\n\ndef test_formula(ex):\n    before = _snapshot(ORDERS)\n    got = ex.formula(ORDERS, \"with_tax\", lambda r: round(r[\"amount\"] * 1.2, 2))\n    assert [r[\"with_tax\"] for r in got] == [144.0, 96.0, 54.6]\n    assert ORDERS == before, \"Formula must not modify its input rows\"\n\n\ndef test_unique(ex):\n    rows = [{\"c\": \"A\", \"d\": 1}, {\"c\": \"B\", \"d\": 1}, {\"c\": \"A\", \"d\": 1}, {\"c\": \"A\", \"d\": 2}]\n    u, d = ex.unique(rows, [\"c\", \"d\"])\n    assert u == [{\"c\": \"A\", \"d\": 1}, {\"c\": \"B\", \"d\": 1}, {\"c\": \"A\", \"d\": 2}]\n    assert d == [{\"c\": \"A\", \"d\": 1}]\n\n\ndef test_join(ex):\n    before = _snapshot(ORDERS)\n    j, l, r = ex.join(ORDERS, PRODUCTS, \"product_id\")\n    assert [x[\"order_id\"] for x in j] == [1, 2]\n    assert j[0] == {\"order_id\": 1, \"region\": \"North\", \"amount\": 120.0, \"product_id\": \"P1\",\n                    \"name\": \"Widget\", \"Right_region\": \"Global\"}, f\"J row was {j[0]!r}\"\n    assert [x[\"order_id\"] for x in l] == [3], \"order 3 has no product: L anchor\"\n    assert [x[\"product_id\"] for x in r] == [\"P3\"], \"P3 was never ordered: R anchor\"\n    assert ORDERS == before\n\n\ndef test_join_many_matches(ex):\n    j, l, r = ex.join([{\"k\": 1}], [{\"k\": 1, \"v\": \"a\"}, {\"k\": 1, \"v\": \"b\"}], \"k\")\n    assert j == [{\"k\": 1, \"v\": \"a\"}, {\"k\": 1, \"v\": \"b\"}] and l == [] and r == []\n\n\ndef test_union(ex):\n    got = ex.union([{\"a\": 1}], [{\"a\": 2}], [{\"a\": 3}])\n    assert got == [{\"a\": 1}, {\"a\": 2}, {\"a\": 3}]\n\n\ndef test_summarize(ex):\n    assert ex.summarize(ORDERS, \"region\", \"amount\", \"sum\") == [\n        {\"region\": \"North\", \"Sum_amount\": 165.5}, {\"region\": \"South\", \"Sum_amount\": 80.0}]\n    assert ex.summarize(ORDERS, \"region\", \"amount\", \"count\") == [\n        {\"region\": \"North\", \"Count_amount\": 2}, {\"region\": \"South\", \"Count_amount\": 1}]\n    assert ex.summarize(ORDERS, \"region\", \"amount\", \"avg\")[0] == {\"region\": \"North\", \"Avg_amount\": 82.75}\n    assert ex.summarize(ORDERS, \"region\", \"amount\", \"max\")[0][\"Max_amount\"] == 120.0\n\n\ndef test_multi_row(ex):\n    rows = [{\"m\": 1, \"x\": 10}, {\"m\": 2, \"x\": 5}, {\"m\": 3, \"x\": 7}]\n    got = ex.multi_row(rows, \"rt\", lambda prev, r: r[\"x\"] + (prev[\"rt\"] if prev else 0))\n    assert [r[\"rt\"] for r in got] == [10, 15, 22]\n    chg = ex.multi_row(rows, \"chg\", lambda prev, r: None if prev is None else r[\"x\"] - prev[\"x\"])\n    assert [r[\"chg\"] for r in chg] == [None, -5, 2]\n    assert \"rt\" not in rows[0], \"don't modify the input rows\"\n\n\ndef test_cross_tab(ex):\n    sales = [\n        {\"region\": \"North\", \"quarter\": \"Q1\", \"amount\": 60},\n        {\"region\": \"North\", \"quarter\": \"Q2\", \"amount\": 50},\n        {\"region\": \"South\", \"quarter\": \"Q2\", \"amount\": 70},\n        {\"region\": \"North\", \"quarter\": \"Q1\", \"amount\": 40},\n    ]\n    got = ex.cross_tab(sales, \"region\", \"quarter\", \"amount\")\n    assert got == [{\"region\": \"North\", \"Q1\": 100, \"Q2\": 50}, {\"region\": \"South\", \"Q1\": 0, \"Q2\": 70}], f\"got {got!r}\"\n", "solution": "\"\"\"Module A05 solutions.\"\"\"\n\n\ndef select(rows, fields, rename=None):\n    rename = rename or {}\n    return [{rename.get(f, f): row[f] for f in fields} for row in rows]\n\n\ndef filter_rows(rows, condition):\n    true_rows = [{**r} for r in rows if condition(r)]\n    false_rows = [{**r} for r in rows if not condition(r)]\n    return true_rows, false_rows\n\n\ndef formula(rows, field, expression):\n    return [{**r, field: expression(r)} for r in rows]\n\n\ndef unique(rows, keys):\n    seen = set()\n    uniq, dupes = [], []\n    for r in rows:\n        k = tuple(r[f] for f in keys)\n        (dupes if k in seen else uniq).append({**r})\n        seen.add(k)\n    return uniq, dupes\n\n\ndef join(left, right, key):\n    index = {}\n    for r in right:\n        index.setdefault(r[key], []).append(r)\n    joined, left_only, matched_keys = [], [], set()\n    for l in left:\n        matches = index.get(l[key])\n        if not matches:\n            left_only.append({**l})\n            continue\n        matched_keys.add(l[key])\n        for r in matches:\n            merged = {**l}\n            for k, v in r.items():\n                if k == key:\n                    continue\n                merged[f\"Right_{k}\" if k in l else k] = v\n            joined.append(merged)\n    right_only = [{**r} for r in right if r[key] not in matched_keys]\n    return joined, left_only, right_only\n\n\ndef union(*tables):\n    return [{**r} for table in tables for r in table]\n\n\ndef summarize(rows, group_by, field, action):\n    groups = {}\n    for r in rows:\n        groups.setdefault(r[group_by], []).append(r[field])\n    funcs = {\"sum\": sum, \"count\": len, \"avg\": lambda v: round(sum(v) / len(v), 2), \"min\": min, \"max\": max}\n    name = f\"{action.capitalize()}_{field}\"\n    return [{group_by: g, name: funcs[action](values)} for g, values in groups.items()]\n\n\ndef multi_row(rows, field, expression):\n    out, prev = [], None\n    for r in rows:\n        new = {**r}\n        new[field] = expression(prev, r)\n        out.append(new)\n        prev = new\n    return out\n\n\ndef cross_tab(rows, group_field, header_field, value_field):\n    headers, table = [], {}\n    for r in rows:\n        if r[header_field] not in headers:\n            headers.append(r[header_field])\n        cell = table.setdefault(r[group_field], {})\n        cell[r[header_field]] = cell.get(r[header_field], 0) + r[value_field]\n    return [{group_field: g, **{h: cells.get(h, 0) for h in headers}} for g, cells in table.items()]\n"}, "support": {}}, {"id": "A06", "slug": "A06_pandas_analytics", "track": "ai", "title": "pandas for Business Analytics", "goal": "do everyday analyst work in pandas (
